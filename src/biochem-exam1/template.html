<header><div class="hin">

const MODS=[];
</script>

<script>
(function(){
"use strict";
const KEY="bmsc3401-exam1";
let S={q:{},mocks:0,set:{timer:true,fb:"each",len:25},drills:{},flag:{},saved:{},pos:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
S.flag=S.flag||{};S.saved=S.saved||{};S.pos=S.pos||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const Q=[],LOS=[],LOBY={},QBY={};
MODS.forEach(m=>{m.los.forEach(l=>{l.mod=m;LOS.push(l);LOBY[l.id]=l;});m.questions.forEach(q=>{q.mod=m;Q.push(q);QBY[q.id]=q;});});
document.getElementById("modlist").textContent="· "+MODS.map(m=>m.short).join(", ");

const $=(s,el)=>(el||document).querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v);}kids.flat().forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c));});return e;}
const main=$("#main");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function seeded(str){let x=0;for(const c of str)x=(x*31+c.charCodeAt(0))|0;return()=>{x=(x*1103515245+12345)|0;return((x>>>8)&0xffff)/65536;};}
function seededShuffle(a,seed){const r=seeded(seed);a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fig(k){if(!k||!FIGS[k])return null;return h("div",{class:"fig",html:FIGS[k]});}
function loLabel(q){return "LO "+q.lo+" · "+q.mod.short+" "+q.src;}
function flagBtn(q){const b=h("button",{class:"flag"});const p=()=>{const on=!!S.flag[q.id];b.textContent=on?"Flagged":"Flag";b.classList.toggle("on",on);b.title=on?"Remove flag":"Flag for review";};b.addEventListener("click",()=>{if(S.flag[q.id])delete S.flag[q.id];else S.flag[q.id]=1;save();p();});p();return b;}

// options: returns [{text,correct}] in display order
function optsFor(q,shuf){
  if(q.type==="tf")return [{t:"True",c:q.ans===true},{t:"False",c:q.ans===false}];
  const o=q.opts.map((t,i)=>({t,c:i===q.ans}));
  if(q.fixed)return o;
  return shuf==="seed"?seededShuffle(o,q.id):shuffle(o);
}
function record(q,ok){const r=S.q[q.id]||{n:0,t:0,c:null};r.n++;r.t=Date.now();r.c=ok;S.q[q.id]=r;save();}

// ---- question view (shared) ----
// opts: {onAnswer(ok, idx), reveal:bool, picked:idx}
function qView(q,order,o){
  const w=h("div");
  w.append(h("div",{class:"stem",html:q.stem+(q.tag==="beyond"?' <span class="tag">beyond lecture</span>':"")}));
  const f=fig(q.fig);if(f)w.append(f);
  const box=h("div",{class:"opts"});
  const btns=order.map((op,i)=>{const b=h("button",{class:"opt",html:op.t});b.addEventListener("click",()=>o.onPick(i));box.append(b);return b;});
  w.append(box);
  const fbw=h("div");w.append(fbw);
  function paint(picked,reveal){
    btns.forEach((b,i)=>{b.className="opt";
      if(reveal){b.disabled=true;if(order[i].c)b.classList.add("ok");else if(i===picked)b.classList.add("bad");}
      else if(i===picked)b.classList.add("pick");});
    fbw.innerHTML="";
    if(reveal){const ok=picked!=null&&order[picked].c;fbw.append(explain(q,ok,picked==null,reveal==="show"&&picked==null));}
  }
  return {el:w,paint};
}
function explain(q,ok,skipped,shown){
  const d=h("div",{class:"fb "+(shown?"ok":ok?"ok":"bad")});
  d.append(h("b",{class:"v"},shown?"Answer":skipped?"Not answered":(ok?"Correct":"Incorrect")));
  d.append(h("div",{html:q.exp}));
  if(q.steps){const det=h("details",{class:"steps"},h("summary",null,"Work it through"),h("ol",null,q.steps.map(s=>h("li",{html:s}))));d.append(det);}
  return d;
}

// ---- tabs ----
let tab=null;const tabs={};
document.getElementById("nav").addEventListener("click",e=>{const t=e.target.dataset.t;if(t){go(t);}});
function go(t,arg){savePos();tab=t;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));if(tabs[t].cleanup)tabs[t].cleanup();main.innerHTML="";document.body.dataset.tab=t;tabs[t].render(arg);window.scrollTo(0,t==="sheet"?(S.pos.sheet||0):0);S.tab=t;save();try{history.replaceState(null,"","#"+t);}catch(e){}}
function savePos(){if(tab==="sheet"&&main.querySelector(".sheet")){S.pos.sheet=Math.round(window.scrollY);save();}}
let st_;window.addEventListener("scroll",()=>{clearTimeout(st_);st_=setTimeout(savePos,250);},{passive:true});
window.addEventListener("pagehide",savePos);

function loSelect(id,withAll){

function buildMock(mods,len){
  const age=q=>{const r=S.q[q.id];return r?r.t:0;};
  // per module quota
  const n=Math.min(len,Q.filter(q=>mods.includes(q.mod)).length);
  const quota=new Map(mods.map(m=>[m,0]));let left=n;
  while(left>0){let moved=false;for(const m of mods){if(left<=0)break;if(quota.get(m)<m.questions.length){quota.set(m,quota.get(m)+1);left--;moved=true;}}if(!moved)break;}
  let picked=[];
  mods.forEach(m=>{
    const byLo=m.los.map(l=>shuffle(m.questions.filter(q=>q.lo===l.id)).sort((a,b)=>age(a)-age(b)));
    let k=quota.get(m),i=0;

  });

}

      d.append(h("div",{class:"sm"},h("span",{class:"ya"},"Your answer: "),h("span",{html:s.pick==null?"none":s.order[s.pick].t})));
      d.append(h("div",{class:"sm"},h("span",{class:"ca"},"Correct: "),h("span",{html:s.order.find(o=>o.c).t})));
      const ex=explain(s.q,false,s.pick==null);ex.firstChild.remove();d.append(ex);main.append(d);
    });
    main.append(h("div",{class:"row"},h("button",{class:"btn pri",onclick:()=>go("mock")},"New mock"),miss.length?h("button",{class:"btn",onclick:()=>runPractice(miss.map(s=>s.q),"Missed from mock "+num)},"Practice the missed ones"):null));
  }
  show();
}

// ===== STUDY GUIDE =====
let io=null;
tabs.sheet={cleanup(){if(io){io.disconnect();io=null;}},render(){
  const onlySaved=!!S.set.onlySaved;
  const wrap=h("div",{class:"gwrap"});const side=h("aside",{class:"gside"});const body=h("div",{class:"gbody"});wrap.append(side,body);main.append(wrap);
  // sidebar / outline
  const sv=h("button",{class:"pill"+(onlySaved?" on":""),onclick:()=>{S.set.onlySaved=!onlySaved;S.pos.sheet=0;save();go("sheet");}},"Saved only ("+Object.keys(S.saved).length+")");
  side.append(h("div",{class:"gtitle"},"Contents"),sv);
  const jumpSel=h("select",{class:"gjump"},h("option",{value:""},"Jump to…"));
  const outl=h("div",{class:"outline"});side.append(outl);
  body.append(h("div",{class:"gtop"},jumpSel,sv.cloneNode(true)));
  body.querySelector(".gtop .pill").addEventListener("click",()=>{S.set.onlySaved=!onlySaved;S.pos.sheet=0;save();go("sheet");});
  jumpSel.addEventListener("change",()=>{const e=document.getElementById(jumpSel.value);if(e)e.scrollIntoView();jumpSel.value="";});
  if(onlySaved&&!Object.keys(S.saved).length)body.append(h("p",{class:"mut"},"Nothing saved yet. Use Save at the top of any objective."));
  const links={};
  MODS.forEach(m=>{
    const los=m.los.filter(l=>!onlySaved||S.saved[l.id]);if(!los.length)return;
    outl.append(h("div",{class:"omod"},m.short+": "+m.name.split(": ")[1]));
    body.append(h("div",{class:"modhead"},m.name));
    los.forEach(l=>{
      const id="s"+l.id.replace(".","-");
      const blocks=(m.guide||{})[l.id]||[];
      const qids=blocks.flatMap(b=>b.check||[]);
      const prog=()=>qids.filter(x=>S.q[x]).length+" / "+qids.length;
      const pr=h("span",{class:"oprog"},prog());
      const a=h("a",{href:"#"+id,onclick:e=>{e.preventDefault();document.getElementById(id).scrollIntoView();}},h("span",null,l.id),h("span",{class:"ot"},l.nick||shortT(l.title)),pr);
      outl.append(a);links[id]=a;
      jumpSel.append(h("option",{value:id},l.id+" "+(l.nick||shortT(l.title))));
      const sec=h("section",{class:"unit",id});
      const sb=h("button",{class:"flag"});const sp=()=>{const on=!!S.saved[l.id];sb.textContent=on?"Saved":"Save";sb.classList.toggle("on",on);};sb.addEventListener("click",()=>{if(S.saved[l.id])delete S.saved[l.id];else S.saved[l.id]=1;save();sp();});sp();
      const upr=h("span",{class:"uprog"});const updProg=()=>{const t=prog();pr.textContent=t;upr.textContent=qids.length?t+" checks done":"";};updProg();
      sec.append(h("div",{class:"uhead"},h("div",null,h("div",{class:"eyebrow"},"Objective "+l.id),h("h2",null,l.title),upr),sb));
      blocks.forEach(b=>sec.append(block(b,m,updProg)));
      body.append(sec);
    });
  });
  // highlight current section in outline
  try{io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){Object.values(links).forEach(a=>a.classList.remove("cur"));const a=links[e.target.id];if(a)a.classList.add("cur");}});},{rootMargin:"-30% 0px -60% 0px"});body.querySelectorAll(".unit").forEach(u=>io.observe(u));}catch(e){}
}};
function shortT(t){return t.replace(/^(Relate|Describe|Determine|Apply knowledge of|Summarize|Outline|Classify|Explain|Interpret|Categorize|Investigate|Apply|Diagram|Predict) /,"").replace(/^the /,"").replace(/^./,c=>c.toUpperCase());}
function block(b,m,onAns){
  if(b.check){
    const w=h("div",{class:"checks"},h("div",{class:"clabel"},"Check yourself"));
    b.check.forEach(id=>{const q=QBY[id];if(!q)return;const c=qCard(q,false,q.type==="tf"?"True or false":"Multiple choice");c.addEventListener("click",()=>setTimeout(onAns,0));w.append(c);});
    return w;
  }
  if(b.drill){
    const d=(m.drills||[]).find(x=>x.id===b.drill);const w=h("div",{class:"card drill"});
    w.append(h("div",{class:"clabel"},"Drill"),h("h3",null,d.title),h("p",{class:"mut sm"},d.intro));
    const bd=h("div");w.append(bd);
    if(d.kind==="sort")sortDrill(d,bd,0);else if(d.kind==="case")caseDrill(d,bd);
    return w;
  }
  if(b.tool){const w=h("div",{class:"card"});w.append(h("div",{class:"clabel"},"Try it"),h("h3",null,"pH / ratio explorer"),h("p",{class:"mut sm"},"Drag pKa and pH, or tap a preset from the lecture."),TOOLS[b.tool]());return w;}
  if(b.steps){
    const w=h("div",{class:"card"});w.append(h("div",{class:"clabel"},"Worked example"),h("h3",null,b.steps));
    const ol=h("ol",{class:"wsteps"});w.append(ol);let n=0;
    const nb=h("button",{class:"btn sm",onclick:()=>{n++;paint();}},"Next step");const all=h("button",{class:"btn link sm",onclick:()=>{n=b.s.length;paint();}},"Show all");
    w.append(h("div",{class:"row"},nb,all));
    function paint(){ol.innerHTML="";b.s.slice(0,Math.max(1,n)).forEach((x,i)=>ol.append(h("li",{html:x,class:i===b.s.length-1?"last":""})));const done=n>=b.s.length-1&&n>0||b.s.length===1;nb.disabled=n>=b.s.length;nb.classList.toggle("hide",n>=b.s.length);all.classList.toggle("hide",n>=b.s.length);}
    n=1;paint();return w;
  }
  const w=h("div",{class:"card"});
  if(b.h)w.append(h("h3",{html:b.h}));
  const bodyEl=h("div",{class:"cb",html:b.b||""});
  bodyEl.querySelectorAll("table").forEach(t=>{const x=h("div",{class:"tw"});t.replaceWith(x);x.append(t);});
  const f=b.fig?fig(b.fig):null;
  if(f&&(b.fig==="phscale"||b.fig==="forces"||b.fig==="classes"||b.fig==="water"||b.fig==="bicarb")){w.append(f,bodyEl);}else{w.append(bodyEl);if(f)w.append(f);}
  if(b.key)w.append(h("div",{class:"call key"},h("b",null,"Key idea"),h("div",{html:b.key})));
  if(b.trap)w.append(h("div",{class:"call trap"},h("b",null,"Watch out"),h("div",{html:b.trap})));
  return w;
}

document.getElementById("reset").addEventListener("click",function(){
  if(this.dataset.arm){S={q:{},mocks:0,set:S.set,drills:{},flag:{},saved:S.saved,pos:S.pos,hist:[]};save();this.textContent="Reset progress";delete this.dataset.arm;go(tab);}
  else{this.dataset.arm="1";this.textContent="Tap again to reset";setTimeout(()=>{this.textContent="Reset progress";delete this.dataset.arm;},3000);}
});
const start=(location.hash||"").slice(1)||S.tab;tab=null;go(tabs[start]?start:"sheet");
})();
