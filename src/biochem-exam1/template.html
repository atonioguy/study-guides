<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMSC 3401 Biochemistry: Exam 1</title>
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<style>
:root{--fg:#1c1c1c;--mut:#666;--line:#ddd;--soft:#f5f5f3;--acc:#1f4b8f;--accbg:#eef2f9;--ok:#1d7a3a;--okbg:#eef7f0;--bad:#b42318;--badbg:#fdf1f0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--fg);background:#fff}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.hin{max-width:780px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.brand{font-weight:600;font-size:15px;margin-right:auto}
.brand span{font-weight:400;color:var(--mut)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{font:inherit;font-size:15px;background:none;border:0;padding:7px 10px;border-radius:6px;color:var(--mut);cursor:pointer}
nav button.on{color:var(--fg);background:var(--soft);font-weight:600}
main{max-width:780px;margin:0 auto;padding:16px 16px 72px}
h1{font-size:22px;margin:6px 0 6px}
h2{font-size:18px;margin:28px 0 8px}
h3{font-size:16px;margin:22px 0 6px}
h4{font-size:15px;margin:18px 0 6px}
p{margin:8px 0}
.mut{color:var(--mut)}.sm{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.btn{font:inherit;font-size:15px;padding:9px 14px;border:1px solid #c8c8c8;border-radius:6px;background:#fff;color:var(--fg);cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{font-size:14px;padding:6px 10px}
.btn:disabled{opacity:.45;cursor:default}
.btn.link{border:0;padding:6px 4px;color:var(--mut);text-decoration:underline;text-underline-offset:2px}
@media (hover:hover){.btn:hover:not(:disabled){border-color:#888}.opt:hover:not(:disabled){border-color:#888}}
select{font:inherit;font-size:15px;padding:8px;border:1px solid #c8c8c8;border-radius:6px;background:#fff;max-width:100%;color:var(--fg)}
label.chk{display:flex;gap:6px;align-items:center;font-size:15px;cursor:pointer}
.seg{display:inline-flex;border:1px solid #c8c8c8;border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:14px;border:0;background:#fff;padding:7px 11px;cursor:pointer;color:var(--fg)}
.seg button+button{border-left:1px solid #c8c8c8}
.case.done .seg button{cursor:default}
.seg button.on{background:var(--acc);color:#fff}
.box{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0;background:var(--soft)}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;background:#fff}
@media (hover:hover){.card.link:hover{border-color:#999}.outline a:hover{background:#ecece8}}
.card.link b{display:block}
.qhead{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--mut)}
.bar{height:3px;background:#eee;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--acc)}
.stem{font-size:17px;margin:12px 0}
.tag{display:inline-block;font-size:12px;font-weight:500;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}
.fig{margin:10px 0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;padding:11px 14px;border:1px solid #c8c8c8;border-radius:6px;background:#fff;color:var(--fg);cursor:pointer}
.opt:disabled{cursor:default}
.opt.pick{border-color:var(--acc);background:var(--accbg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.mine{box-shadow:inset 0 0 0 1px currentColor}.opt.ok.mine{box-shadow:inset 0 0 0 1px var(--ok)}.opt.bad.mine{box-shadow:inset 0 0 0 1px var(--bad)}
.fb{margin:12px 0;padding:10px 14px;border-left:3px solid var(--line);background:var(--soft)}
.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.fb b.v{display:block;margin-bottom:2px}
.fb.ok b.v{color:var(--ok)}.fb.bad b.v{color:var(--bad)}
details.steps{margin-top:8px}
details.steps summary{cursor:pointer;color:var(--acc);font-size:15px}
details.steps ol{margin:6px 0 0;padding-left:22px}
details.steps li{margin:3px 0}
table{border-collapse:collapse;width:100%;margin:8px 0;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-weight:600;background:var(--soft)}
.tw{overflow-x:auto}
.conf{border-left:3px solid var(--acc);padding:4px 10px;background:var(--accbg)}
ul,ol{padding-left:22px}
li{margin:3px 0}
.lohd{font-size:14px;color:var(--mut);margin:-2px 0 8px}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.jump a{font-size:14px;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:4px 8px;text-decoration:none}
.sheet{scroll-margin-top:70px}
.qli{border-top:1px solid var(--line);padding:12px 0}
.qli .stem{font-size:16px;margin:4px 0 8px}
.qli .fig{max-width:460px}
.stem+.fig{max-width:540px}
.qlo{list-style:none;padding:0;margin:0 0 6px}
.qlo li{padding:4px 8px 4px 26px;position:relative;border-radius:4px;font-size:15px;margin:2px 0}
.qlo li.ok{background:var(--okbg);font-weight:600}
.qlo li.ok:before{content:"✓";position:absolute;left:8px;color:var(--ok)}
.qli .ex{font-size:15px;color:#333;margin:6px 0 0}
details.lo>summary{cursor:pointer;font-weight:600;padding:10px 0;border-top:1px solid var(--line);list-style-position:outside}
details.mod{margin:8px 0}
details.mod>summary{cursor:pointer;font-size:17px;font-weight:600;padding:8px 0}
.res td.n{text-align:right;white-space:nowrap}
.miss{border-top:1px solid var(--line);padding:12px 0}
.miss .stem{font-size:16px}
.ya{color:var(--bad)}.ca{color:var(--ok)}
#timer.late{color:var(--bad);font-weight:600}
/* drills */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;min-height:38px}
.chip{font:inherit;font-size:15px;padding:6px 11px;border:1px solid #c8c8c8;border-radius:16px;background:#fff;cursor:pointer;color:var(--fg)}
.chip.sel{border-color:var(--acc);background:var(--acc);color:#fff}
.chip.done{cursor:default;border-color:var(--ok);background:var(--okbg);font-size:14px;padding:3px 9px}
.chip.rev{border-color:var(--bad);background:var(--badbg)}
.bins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bin{border:1px dashed #bbb;border-radius:8px;padding:8px;min-height:64px;background:#fff}
.bin.arm{cursor:pointer;border-color:var(--acc);border-style:solid;background:var(--accbg)}
.bin h5{margin:0 0 6px;font-size:14px}
.bin .chips{margin:0;min-height:0;gap:4px}
.msg{min-height:24px;font-size:15px;margin:8px 0}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.case{border:1px solid var(--line);border-radius:8px;padding:14px;margin:12px 0}
.case .t{font-size:17px;font-weight:600;margin-bottom:10px}
.fld{margin:8px 0}.fld .l{font-size:13px;color:var(--mut);margin-bottom:4px}
.fld .seg{flex-wrap:wrap}
.fld .seg button.ok{background:var(--ok);color:#fff}.fld .seg button.bad{background:var(--bad);color:#fff}
/* hh tool */
.hh{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0}
.tal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.tal div{border:1px solid var(--line);border-radius:6px;padding:6px 4px;text-align:center;font-size:13px;color:var(--mut)}.tal b{display:block;font-size:17px;color:var(--fg)}.tal .full{border-color:var(--acc)}.tal .full b{color:var(--acc)}
.pills{gap:6px;flex-wrap:wrap}
.rdo{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:14px;margin:8px 0}.rbar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}.rbar i{display:block;height:100%}
.hh .sl{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin:6px 0}
.hh input[type=range]{width:100%;accent-color:var(--acc)}
.hh .out{font-size:15px;margin:8px 0}
.split{display:flex;height:26px;border-radius:5px;overflow:hidden;border:1px solid var(--line);font-size:13px}
.split div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;transition:width .15s}
.split .ha{background:#d9dee6}.split .a{background:var(--acc);color:#fff}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kin .sl{grid-template-columns:104px 1fr 54px}.kin .seg{flex-wrap:wrap;margin:4px 0 6px}.kin .sl input:disabled{opacity:.4}
.kplots{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kplots .fig{margin:0}
@media (max-width:640px){.kplots{grid-template-columns:1fr}}
.pq .fig{max-width:420px}
footer{max-width:780px;margin:0 auto;padding:0 16px 24px;font-size:13px;color:var(--mut)}
.hide{display:none!important}
@media(max-width:560px){.gtop{top:76px!important}.unit{scroll-margin-top:130px}.hin{padding:6px 10px 4px}.brand{width:100%;font-size:14px}nav{width:100%;justify-content:space-between}nav button{font-size:14px;padding:6px 7px}main{padding-top:12px}}
.frow{display:flex;justify-content:flex-end;margin:-6px 0 6px}
.flag{font:inherit;font-size:13px;color:var(--mut);background:none;border:1px solid var(--line);border-radius:5px;padding:2px 8px;cursor:pointer}
.flag.on{color:var(--acc);border-color:var(--acc);background:var(--accbg);font-weight:600}
.shd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qhead .flag{vertical-align:1px}

/* v1.1 layout */
body{background:#f6f6f3}
header{background:#fff}
.hin,main,footer{max-width:760px}
body[data-tab=sheet] .hin,body[data-tab=sheet] main,body[data-tab=sheet] footer{max-width:1040px}
.btn{background:#fff}
.eyebrow{font-size:13px;font-weight:600;color:var(--acc);letter-spacing:.02em}
.pill{white-space:nowrap;font:inherit;font-size:14px;padding:6px 12px;border:1px solid #c8c8c8;border-radius:999px;background:#fff;color:var(--fg);cursor:pointer}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.filters{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin:12px 0 8px}
.filters .row{margin:10px 0}
h2.lohead{font-size:18px;margin:30px 0 10px;line-height:1.35}
h2.lohead .eyebrow{display:block;margin-bottom:2px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.qcard .stem{margin:8px 0 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0}
.card.link{cursor:pointer;padding:12px 16px}
.card h3{font-size:19px;margin:0 0 10px;line-height:1.3}
.card .fig{border:0;border-radius:8px;margin:6px 0 12px;background:#fff}
.cb{font-size:17px;line-height:1.65}
.cb p{margin:0 0 10px}.cb p:last-child{margin-bottom:0}
.cb table{font-size:15px;margin:4px 0 6px}
.call{margin:14px 0 0;padding:10px 14px;border-radius:8px;font-size:16px;line-height:1.55}
.call>b{display:block;font-size:13px;letter-spacing:.02em;margin-bottom:2px}
.call.key{background:var(--accbg)}.call.key b{color:var(--acc)}
.call.trap{background:#fdf6e7}.call.trap b{color:#8a5a00}
.clabel{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.checks{margin:14px 0 22px;padding:0 0 0 14px;border-left:3px solid var(--acc)}
.checks .qcard{margin:8px 0}
.card.drill{border-color:#c9d3e4}
.trio,.duo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 12px}
.duo{grid-template-columns:repeat(2,1fr)}
.trio>div,.duo>div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fafaf8;display:flex;flex-direction:column;gap:3px;font-size:15px;line-height:1.4}
.trio b,.duo b{font-size:16px}
.trio i,.duo i{font-style:normal;color:var(--acc);font-size:14px}
@media(max-width:620px){.trio{grid-template-columns:1fr}}
.wsteps{counter-reset:s;list-style:none;padding:0;margin:6px 0}
.wsteps li{counter-increment:s;position:relative;padding:8px 10px 8px 40px;border-radius:8px;background:#fafaf8;margin:6px 0;font-size:16px}
.wsteps li:before{content:counter(s);position:absolute;left:10px;top:8px;width:21px;height:21px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.wsteps li.last{background:var(--accbg)}
/* guide grid */
.gwrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px}
.gside{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;padding-top:8px}
.gtitle{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.outline{margin-top:12px}
.omod{font-size:13px;font-weight:600;margin:14px 0 4px}
.outline a{display:grid;grid-template-columns:30px 1fr auto;gap:4px;align-items:baseline;padding:6px 8px;border-radius:6px;color:var(--fg);text-decoration:none;font-size:14px;line-height:1.3}

.outline a.cur{background:#fff;box-shadow:0 0 0 1px var(--line);font-weight:600}
.outline .ot{color:#444}.outline .oprog{font-size:12px;color:var(--mut)}
.gtop{display:none}
.modhead{font-size:14px;font-weight:600;color:var(--mut);margin:10px 0 0}
.unit{scroll-margin-top:64px;margin:6px 0 40px}
.uhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:16px 0 4px}
.uhead h2{font-size:24px;margin:2px 0 4px;line-height:1.25}
.uprog{font-size:13px;color:var(--mut)}
@media(max-width:900px){.gwrap{grid-template-columns:minmax(0,1fr)}.gside{display:none}.gtop{display:flex;gap:8px;align-items:center;position:sticky;top:52px;z-index:3;background:#f6f6f3;padding:8px 0}.gjump{flex:1}.uhead h2{font-size:21px}.card{padding:16px}}
/* figures as html */
.aag{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;padding:4px 0}
.aagc{display:flex;flex-direction:column;gap:4px}
.aagc b{font-size:12px;color:var(--mut);font-weight:600}
.aag span,.aagl span{display:inline-block;text-align:center;font-size:14px;padding:3px 0;border-radius:6px;border:1px solid #c8c8c8}
.aag .pho,.aagl .pho{background:#e9d9a6;border-color:#c9b06a}
.aag .phi,.aagl .phi{background:#fff}
.aag .ex,.aagl .ex{border:2px solid var(--bad);font-weight:700}
.aagl{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}.aagl span{padding:2px 10px;font-size:13px}
.fbars{padding:4px 0}
.fbr{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;align-items:center;margin:8px 0}
.fbr .fn{font-weight:600;font-size:15px}
.fbg{height:12px;background:#eee;border-radius:6px;overflow:hidden}.fbg i{display:block;height:100%;background:var(--acc);border-radius:6px}
.fbr .fe{grid-column:2;font-size:13px;color:var(--mut);margin-top:-4px}
.fnote{font-size:12px;color:var(--mut);text-align:right}
.phs{padding:6px 0 4px}
.phrow{display:grid;grid-template-columns:repeat(15,1fr);border-radius:6px;overflow:hidden}
.phrow span{text-align:center;font-size:13px;padding:7px 0;color:#222}
.phlab{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:4px}
.phmk{position:relative;height:22px;font-size:12px}
.phmk span{position:absolute;transform:translateX(-50%);white-space:nowrap;color:var(--fg)}
.phmk span:before{content:"▲ ";color:var(--acc)}

.flagi{background:none;border:0;padding:3px;margin:-3px 0;cursor:pointer;color:var(--mut);display:inline-flex;vertical-align:middle;border-radius:5px}
.flagi svg{width:18px;height:18px;display:block}.flagi.on{color:var(--acc)}
@media (hover:hover){.flagi:hover{background:#ecece8}}
.so{margin:14px 0 0;padding:6px 0 6px 12px;border-left:3px solid var(--acc);font-size:16px;line-height:1.5;color:#333}
.call.note{background:#f4f4f1}.call.note>b{color:var(--mut)}
.limg{margin:4px 0 12px}.limg img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px}
.credit{font-size:13px;color:var(--mut);margin:4px 0 0}
.fb .rev{display:inline-block;margin:8px 0 0;padding:0;font-size:15px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto;z-index:50}
.modal>.mbox{background:var(--bg,#fff);border-radius:12px;max-width:760px;width:100%;padding:6px 6px 12px}
.modal .card{margin:6px 0}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px 0}
.outline a.les{display:block;padding:3px 8px 3px 42px;font-size:13px;color:#555}
.gtop .gjump{flex:1 1 auto;min-width:0;width:0}.gtop .pill{flex:none}
.card .hl{background:#fff4b8!important;box-shadow:0 0 0 5px #fff4b8;border-radius:3px;animation:hlin 1.1s ease-out .15s both}
@keyframes hlin{0%{background:transparent;box-shadow:0 0 0 5px transparent}35%{background:#ffe680;box-shadow:0 0 0 7px #ffe680}100%{background:#fff4b8;box-shadow:0 0 0 5px #fff4b8}}
@media (prefers-reduced-motion:reduce){.card .hl{animation:none}}
.lhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.lhead h3{margin:0 0 10px}
.chip:not(.done){touch-action:none;cursor:grab}.chip.dragging{opacity:.35}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:60;cursor:grabbing;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.bin.over{border-color:var(--acc);border-style:solid;background:var(--accbg)}
details.drills{margin:6px 0 2px}details.drills summary{cursor:pointer;color:var(--acc);font-size:15px;padding:6px 0}
.dtop{display:flex;justify-content:flex-end;margin:0 0 6px}
/* lecture window */
.lecb{font:inherit;font-size:13px;color:var(--acc);background:#fff;border:1px solid #c5d1e5;border-radius:5px;padding:0 6px;margin:-2px 0;cursor:pointer;display:inline-flex;align-items:center;gap:4px;vertical-align:middle;line-height:1.5}
.lecb svg{flex:none}
@media (hover:hover){.lecb:hover{background:var(--accbg)}}
.lw{position:fixed;z-index:40;background:#fff;border:1px solid #c8c8c8;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden}
.lwgrip{display:none}
.lwhead{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border-bottom:1px solid var(--line);background:var(--soft);cursor:move;touch-action:none;user-select:none;-webkit-user-select:none}

.lwgrip i{width:40px;height:4px;border-radius:2px;background:#bbb}
.lw.sheet .lwhead{cursor:ns-resize;padding-top:2px}
.lw.sheet .lwrz{display:none}
.lw.sheet .lwbody{padding:2px 14px 24px}
.lwt{font-size:17px;margin:12px 0 4px}
.lwb img{max-width:100%;height:auto;display:block}
.lwb figure{margin:10px 0}

<script>
(function(){

function fig(k){if(!k||!FIGS[k])return null;return h("div",{class:"fig",html:FIGS[k]});}

const FLAG_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path class="fl" d="M5 4h12l-2.5 4.5L17 13H5"/></svg>';
const BMK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path class="fl" d="M6 3h12v18l-6-4.5L6 21z"/></svg>';
function bmkBtn(id){const b=h("button",{class:"flagi",type:"button",html:BMK_SVG});const p=()=>{const on=!!S.saved[id];b.classList.toggle("on",on);b.querySelector(".fl").setAttribute("fill",on?"currentColor":"none");const t=on?"Remove bookmark":"Bookmark this lesson";b.title=t;b.setAttribute("aria-label",t);b.setAttribute("aria-pressed",on?"true":"false");};b.addEventListener("click",e=>{e.stopPropagation();if(S.saved[id])delete S.saved[id];else S.saved[id]=1;save();document.querySelectorAll('[data-bmk="'+id+'"]').forEach(x=>x.dispatchEvent(new Event("bmk")));});b.dataset.bmk=id;b.addEventListener("bmk",p);p();return b;}

// options: returns [{text,correct}] in display order
function optsFor(q,shuf){
  if(q.type==="tf")return [{t:"True",c:q.ans===true},{t:"False",c:q.ans===false}];
  const o=q.opts.map((t,i)=>({t,c:i===q.ans}));
  if(q.fixed)return o;
  return shuf==="seed"?seededShuffle(o,q.id):shuffle(o);
}
function record(q,ok,pick){const r=S.q[q.id]||{n:0,t:0,c:null};r.n++;r.t=Date.now();r.c=ok;if(pick!=null)r.pp=pick;else delete r.pp;S.q[q.id]=r;save();}

// ---- question view (shared) ----
// opts: {onAnswer(ok, idx), reveal:bool, picked:idx}
function qView(q,order,o){
  const w=h("div");
  w.append(h("div",{class:"stem",html:q.stem+(q.tag==="beyond"?' <span class="tag">beyond lecture</span>':"")}));
  const f=fig(q.fig);if(f)w.append(f);
  const box=h("div",{class:"opts"});
  const btns=order.map((op,i)=>{const b=h("button",{class:"opt",html:op.t});b.addEventListener("click",()=>o.onPick(i));box.append(b);return b;});
  w.append(box);
  const fbw=h("div");w.append(fbw);
  function paint(picked,reveal){
    btns.forEach((b,i)=>{b.className="opt";
      if(reveal){b.disabled=!o.change;if(order[i].c)b.classList.add("ok");else if(i===picked)b.classList.add("bad");if(o.change&&i===picked)b.classList.add("mine");}
      else if(i===picked)b.classList.add("pick");});
    fbw.innerHTML="";
    if(reveal){const ok=picked!=null&&order[picked].c;fbw.append(explain(q,ok,picked==null,reveal==="show"&&picked==null));}
  }
  return {el:w,paint};
}
function explain(q,ok,skipped,shown){
  const d=h("div",{class:"fb "+(shown?"ok":ok?"ok":"bad")});
  d.append(h("b",{class:"v"},shown?"Answer":skipped?"Not answered":(ok?"Correct":"Incorrect")));
  d.append(h("div",{html:q.exp}));
  if(q.steps){const det=h("details",{class:"steps"},h("summary",null,"Work it through"),h("ol",null,q.steps.map(s=>h("li",{html:s}))));d.append(det);}
  if(q.ref&&LES[q.ref])d.append(h("div",null,h("button",{class:"btn link rev",type:"button",onclick:()=>openLesson(q.ref,q.hl)},"Review: "+LES[q.ref].h)));
  return d;
}
function openLesson(id,hl){
  const L=LES[id];if(!L)return;
  const close=()=>{m.remove();document.removeEventListener("keydown",esc);};
  const esc=e=>{if(e.key==="Escape")close();};
  const m=h("div",{class:"modal",role:"dialog","aria-modal":"true","aria-label":L.h});
  const box=h("div",{class:"mbox"});m.append(box);
  box.append(h("div",{class:"mrow"},h("span",{class:"mut sm"},"LO "+L.lo+" · study guide"),h("button",{class:"btn sm",type:"button",onclick:close},"Close")));
  const card=block(L,L.mod);card.removeAttribute("id");box.append(card);const hx=applyHL(card,hl);
  box.append(h("div",{class:"mrow"},h("button",{class:"btn link",type:"button",onclick:()=>{close();if(tabs.mock.cleanup)tabs.mock.cleanup();S.set.onlySaved=false;go("sheet");const e=document.getElementById(id);if(e){const t=applyHL(e,hl);(t||e).scrollIntoView({block:t?"center":"start"});}}},"Open in study guide (leaves this page)")));
  m.addEventListener("click",e=>{if(e.target===m)close();});
  document.addEventListener("keydown",esc);document.body.append(m);box.querySelector("button").focus();if(hx)hx.scrollIntoView({block:"center"});
}

// ---- lecture window ----
// q.lec={b,hl} points at a block of lectures/biochem-exam1/<mod>.json (fetched on first open, then cached).
// Desktop: floating window, drag by the header, resize from the corner, position/size kept in localStorage.
// Phone: bottom sheet; drag the handle or header to change its height. Clicking another lecture button swaps the
// lesson (or just re-scrolls if it's the same one). Re-rendering or closing removes the DOM, which stops any video.
// closeLec is registered in ANIMS, so go() and openDrill() close the window and drop its listeners.
const BOOK_SVG='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 5.5C5.5 4 8.5 4 12 6c3.5-2 6.5-2 9-.5V19c-2.5-1.5-5.5-1.5-9 .5-3.5-2-6.5-2-9-.5z"/><path d="M12 6v13.5"/></svg>';
const LECDIR="lectures/biochem-exam1/",LKEY="bmsc3401-lecwin",LCACHE={};
const PHONE=matchMedia("(max-width:640px)");
let LW=null;
function lecData(mod){if(!LCACHE[mod])LCACHE[mod]=fetch(LECDIR+mod+".json").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}).catch(e=>{delete LCACHE[mod];throw e;});return LCACHE[mod];}
function lecGeo(){try{return JSON.parse(localStorage.getItem(LKEY))||{};}catch(e){return {};}}
function lecSaveGeo(g){try{localStorage.setItem(LKEY,JSON.stringify(Object.assign(lecGeo(),g)));}catch(e){}}
function lecBtn(q){const tag=q.mod.short+" "+q.src;const b=h("button",{class:"lecb",type:"button",title:"Open the lecture ("+tag+")","aria-label":"Open the lecture, "+tag,html:BOOK_SVG});b.append(h("span",null,tag));
  b.addEventListener("click",e=>{e.stopPropagation();tutDismiss();openLec(q);});tutWatch(b);return b;}
function openLec(q){
  if(!LW)buildLW();
  const mod=q.mod.lecture,key=mod+q.src;LW.q=q;
  if(LW.key===key){if(LW.ready)lecHL(q.lec);return;}
  LW.key=key;LW.ready=false;LW.title.textContent=q.mod.short+" "+q.src;
  LW.body.innerHTML="";LW.body.append(h("p",{class:"mut"},"Loading the lecture…"));
  lecData(mod).then(d=>{
    if(!LW||LW.key!==key)return;const les=d.lessons[q.src];if(!les)throw new Error("no lesson");
    LW.title.textContent=q.mod.short+" "+q.src+" · "+les.t;LW.body.innerHTML="";LW.body.scrollTop=0;
    LW.body.append(h("h3",{class:"lwt"},les.t));
    const notes=q.mod.lecnotes||{};
    les.b.forEach(b=>{const e=h("div",{class:"lwb",html:b.h});e.dataset.b=b.id;LW.body.append(e);
      const n=(notes[b.id]||[]).filter(id=>LES[id]);
      if(n.length)LW.body.append(h("div",{class:"lwnote"},n.map(id=>h("button",{class:"btn link",type:"button",onclick:()=>openLesson(id)},n.length>1?"Lecture wording: "+LES[id].h:"Lecture wording"))));});
    LW.ready=true;lecHL(LW.q.lec);
  }).catch(()=>{
    if(!LW||LW.key!==key)return;LW.key=null;LW.body.innerHTML="";
    LW.body.append(h("p",null,"Couldn't load the lecture. Check your connection and try again."),h("button",{class:"btn sm",type:"button",onclick:()=>openLec(LW.q)},"Try again"));
  });
}
function lecWrap(el,re){
  const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];let s="";
  for(let n;(n=tw.nextNode());){nodes.push([n,s.length]);s+=n.data;}
  const m=re.exec(s);if(!m)return null;const a=m.index,z=a+m[0].length;let first=null;
  for(const [n,o] of nodes){const e=o+n.data.length;if(e<=a||o>=z)continue;let t=n;const st=Math.max(0,a-o),en=Math.min(n.data.length,z-o);
    if(en<t.data.length)t.splitText(en);if(st>0)t=t.splitText(st);if(!t.data.trim()&&first)continue;
    const mk=document.createElement("mark");mk.className="lwhl";t.replaceWith(mk);mk.append(t);if(!first)first=mk;}
  return first;
}
// same segment rule as tests/validate_lec.js: the snippet sits inside one text element of the block
function lecHL(ref){
  const B=LW.body;B.querySelectorAll("mark.lwhl").forEach(m=>m.replaceWith(...m.childNodes));B.querySelectorAll(".lwhit").forEach(e=>e.classList.remove("lwhit"));B.normalize();
  const blk=B.querySelector('[data-b="'+ref.b+'"]');if(!blk)return;
  const re=new RegExp(ref.hl.trim().replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/\s+/g,"\\s+"));
  const els=[...blk.querySelectorAll("p,li,td,th,h4,h5,summary,figcaption,caption")].filter(e=>re.test(e.textContent));
  const vis=els.filter(e=>!e.closest(".lw-ans"));const pool=vis.length?vis:els;
  const el=pool.find(e=>!pool.some(o=>o!==e&&e.contains(o)));
  let tgt=el?lecWrap(el,re):null;
  if(!tgt){blk.classList.add("lwhit");tgt=blk;}
  for(let d=tgt.closest("details");d;d=d.parentElement&&d.parentElement.closest("details"))d.open=true;
  requestAnimationFrame(()=>{if(!LW)return;B.scrollTop+=tgt.getBoundingClientRect().top-B.getBoundingClientRect().top-B.clientHeight*0.3;});
}
function buildLW(){
  const grip=h("div",{class:"lwgrip","aria-hidden":"true"},h("i")),title=h("div",{class:"lwtitle"});
  const x=h("button",{class:"btn sm",type:"button","aria-label":"Close the lecture"},"Close");
  const head=h("div",{class:"lwhead"},title,x),body=h("div",{class:"lwbody"}),rz=h("div",{class:"lwrz","aria-hidden":"true"});
  const w=h("div",{class:"lw",role:"dialog","aria-label":"Lecture"},grip,head,body,rz);document.body.append(w);
  LW={w,title,body,key:null,ready:false,q:null};
  x.addEventListener("click",closeLec);
  body.addEventListener("click",e=>{const p=e.target.closest(".lw-play");if(!p)return;const v=p.parentNode,id=v.dataset.yt,st=+v.dataset.start||0;
    if(!/^[\w-]{11}$/.test(id))return;
    p.replaceWith(h("iframe",{src:"https://www.youtube-nocookie.com/embed/"+id+"?autoplay=1&rel=0"+(st?"&start="+st:""),title:(p.getAttribute("aria-label")||"").replace(/^Play video: /,""),allow:"autoplay; encrypted-media; picture-in-picture; fullscreen",allowfullscreen:true,referrerpolicy:"strict-origin-when-cross-origin"}));});
  // pointer drags: header moves (desktop) or sets height (phone); the corner resizes (desktop)
  function drag(el,fn){el.addEventListener("pointerdown",e=>{if(e.button!==0||e.target.closest("button"))return;const st=fn(e);if(!st)return;e.preventDefault();el.setPointerCapture(e.pointerId);
    const mv=ev=>st.move(ev),up=()=>{el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);st.end();};
    el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);});}
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const sheetDrag=e=>{const y0=e.clientY,h0=w.offsetHeight;let hh=h0;return {move(ev){hh=clamp(h0+y0-ev.clientY,innerHeight*0.25,innerHeight*0.9);w.style.height=hh+"px";document.body.style.paddingBottom=hh+"px";},end(){lecSaveGeo({sh:Math.round(hh)});}};};
  drag(head,e=>{if(PHONE.matches)return sheetDrag(e);const x0=e.clientX,y0=e.clientY,l0=w.offsetLeft,t0=w.offsetTop;let X=l0,Y=t0;
    return {move(ev){X=clamp(l0+ev.clientX-x0,8,innerWidth-w.offsetWidth-8);Y=clamp(t0+ev.clientY-y0,8,innerHeight-w.offsetHeight-8);w.style.left=X+"px";w.style.top=Y+"px";},end(){lecSaveGeo({x:Math.round(X),y:Math.round(Y)});}};});
  drag(grip,e=>PHONE.matches?sheetDrag(e):null);
  drag(rz,e=>{if(PHONE.matches)return null;const x0=e.clientX,y0=e.clientY,w0=w.offsetWidth,h0=w.offsetHeight;let W=w0,H=h0;
    return {move(ev){W=clamp(w0+ev.clientX-x0,300,innerWidth-w.offsetLeft-8);H=clamp(h0+ev.clientY-y0,220,innerHeight-w.offsetTop-8);w.style.width=W+"px";w.style.height=H+"px";},end(){lecSaveGeo({w:Math.round(W),h:Math.round(H)});}};});
  document.addEventListener("keydown",lecEsc);addEventListener("resize",lecLayout);
  try{PHONE.addEventListener("change",lecLayout);}catch(e){PHONE.addListener(lecLayout);}
  ANIMS.add(closeLec);lecLayout();
}
function lecLayout(){
  if(!LW)return;const w=LW.w,g=lecGeo(),vw=document.documentElement.clientWidth,vh=innerHeight;
  if(PHONE.matches){w.classList.add("sheet");const hh=Math.round(Math.min(vh*0.9,Math.max(vh*0.25,g.sh||vh*0.55)));w.style.cssText="height:"+hh+"px";document.body.style.paddingBottom=hh+"px";return;}
  w.classList.remove("sheet");document.body.style.paddingBottom="";
  const W=Math.max(300,Math.min(vw-16,g.w||Math.min(480,Math.round(vw*0.4)))),H=Math.max(220,Math.min(vh-16,g.h||Math.round(vh*0.72)));
  const X=Math.max(8,Math.min(vw-W-8,g.x!=null?g.x:vw-W-16)),Y=Math.max(8,Math.min(vh-H-8,g.y!=null?g.y:72));
  w.style.cssText="left:"+X+"px;top:"+Y+"px;width:"+W+"px;height:"+H+"px";
}
function lecEsc(e){if(e.key==="Escape"&&!document.querySelector(".modal"))closeLec();}
function closeLec(){
  if(!LW)return;LW.w.remove();LW=null;document.body.style.paddingBottom="";
  document.removeEventListener("keydown",lecEsc);removeEventListener("resize",lecLayout);
  try{PHONE.removeEventListener("change",lecLayout);}catch(e){PHONE.removeListener(lecLayout);}
  ANIMS.delete(closeLec);
}
// ---- lecture button tutorial: points at the first lecture button that is fully on screen, once per page load ----
const TUT_SVG='<svg viewBox="0 0 132 72" aria-hidden="true"><rect x="1" y="4" width="76" height="64" rx="4" fill="#fff" stroke="#bbb"/><rect x="7" y="10" width="22" height="7" rx="2" fill="#fff" stroke="#1f4b8f"/><rect x="7" y="23" width="60" height="3" fill="#ccc"/><rect x="7" y="30" width="52" height="3" fill="#ccc"/><rect x="7" y="40" width="60" height="7" rx="2" fill="#fff" stroke="#ddd"/><rect x="7" y="51" width="60" height="7" rx="2" fill="#fff" stroke="#ddd"/><rect x="62" y="14" width="68" height="56" rx="4" fill="#fff" stroke="#1f4b8f"/><rect x="62" y="14" width="68" height="9" rx="2" fill="#1f4b8f"/><rect x="68" y="29" width="54" height="3" fill="#ccc"/><rect x="66" y="36" width="60" height="7" fill="#fff4b8"/><rect x="68" y="38" width="50" height="3" fill="#999"/><rect x="68" y="48" width="56" height="3" fill="#ccc"/><rect x="68" y="55" width="44" height="3" fill="#ccc"/></svg>';
let tutDone=false,tutEl=null,tutIO=null;
function tutWatch(b){if(tutDone||tutEl||!("IntersectionObserver" in window))return;
  if(!tutIO)tutIO=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting&&!tutEl&&!tutDone&&e.target.isConnected){tutShow(e.target);break;}},{threshold:1});
  tutIO.observe(b);}

// one answerable question card (used in Practice list and in the study guide)
function qCard(q,show,label){
  const c=h("div",{class:"qcard"});
  c.append(h("div",{class:"qhead"},h("span",null,label||loLabel(q,true)),flagBtn(q)));
  const order=optsFor(q,"seed");let done=false;
  // tap another option to change the answer; tap your current answer again to clear the question
  let cur=null;
  const v=qView(q,order,{change:true,onPick(k){
    if(k===cur){cur=null;delete S.q[q.id];save();v.paint(null,show?"show":false);return;}
    cur=k;record(q,order[k].c,order[k].t);v.paint(k,true);}});
  c.append(v.el);const r=S.q[q.id];const pk=r&&r.pp!=null?order.findIndex(o=>o.t===r.pp):-1;

  return c;
}

function runPractice(pool,title){
  // unseen first, then oldest
  const qs=shuffle(pool).sort((a,b)=>((S.q[a.id]||{}).t||0)-((S.q[b.id]||{}).t||0));
  let i=0,right=0;const missedIds=[];
  function show(){
    main.innerHTML="";
    if(i>=qs.length){
      main.append(h("h1",null,title+" done"),h("p",null,right+" / "+qs.length+" correct"));
      const r=h("div",{class:"row"});
      if(missedIds.length)r.append(h("button",{class:"btn pri",onclick:()=>runPractice(missedIds.map(id=>QBY[id]),"Retry")},"Retry the "+missedIds.length+" missed"));
      r.append(h("button",{class:"btn",onclick:()=>go("practice")},"Back"));main.append(r);return;
    }

function sortDrill(d,body,ri){

  if(d.rounds.length>1)body.append(h("h3",{style:"margin-top:4px"},"Round "+(ri+1)+" of "+d.rounds.length+": "+R.name));
  const items=shuffle(R.items).map(([t,bin,why])=>({t,bins:Array.isArray(bin)?bin:[bin],why,miss:0,done:false}));

  const pool=h("div",{class:"chips"});const msg=h("div",{class:"msg"});
  const binEls={};const bins=h("div",{class:"bins"});
  R.bins.forEach(b=>{const cs=h("div",{class:"chips"});const el=h("div",{class:"bin","data-bin":b,onclick:()=>place(b)},h("h5",null,b),cs);binEls[b]={el,cs};bins.append(el);});
  body.append(pool,msg,bins);
  const chipEl=new Map();
  items.forEach(it=>{const c=h("button",{class:"chip",type:"button"},it.t);chipEl.set(it,c);pool.append(c);
    let st=null,gh=null,over=null;
    c.addEventListener("pointerdown",e=>{if(it.done||e.button>0)return;st={x:e.clientX,y:e.clientY};try{c.setPointerCapture(e.pointerId);}catch(_){}});
    c.addEventListener("pointermove",e=>{if(!st)return;
      if(!gh){if(Math.hypot(e.clientX-st.x,e.clientY-st.y)<6)return;sel=it;paint();gh=c.cloneNode(true);gh.className="chip sel ghost";document.body.append(gh);c.classList.add("dragging");}

      const t=document.elementFromPoint(e.clientX,e.clientY);const bn=t&&t.closest(".bin");if(over&&over!==bn)over.classList.remove("over");over=bn;if(bn)bn.classList.add("over");e.preventDefault();});
    const end=()=>{if(!st)return;st=null;if(!gh)return;gh.remove();gh=null;c.classList.remove("dragging");c.dataset.nc="1";setTimeout(()=>{delete c.dataset.nc;},0);
      const b=over&&over.dataset.bin;if(over)over.classList.remove("over");over=null;if(b)place(b);else{sel=null;paint();}};
    c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end);
    c.addEventListener("click",()=>{if(c.dataset.nc||it.done)return;sel=(sel===it?null:it);paint();});
  });
  function paint(){items.forEach(it=>{const c=chipEl.get(it);if(!it.done){c.className="chip"+(it===sel?" sel":"")+(it.miss>=2?" rev":"");}});Object.values(binEls).forEach(b=>b.el.classList.toggle("arm",!!sel));}

      sel=null;
    }else{
      it.miss++;msg.className="msg bad";
      msg.textContent=it.miss>=2?it.t+" goes in "+it.bins[0]+"."+(it.why?" "+it.why+".":""):it.t+" isn't "+b+". Try again.";

      const res=first+" / "+items.length+" on first try";S.drills[d.id]=res;save();

      if(ri+1<d.rounds.length)row.append(h("button",{class:"btn pri",onclick:()=>sortDrill(d,body,ri+1)},"Next round"));

// ===== KINETICS PLOTS =====
// mode "mm" (V vs [S]) or "lb" (1/V vs 1/[S]); curves [{km,vm,col,dash,lab}]
function kinSVG(mode,curves,o){
  o=o||{};const W=320,H=232,L=34,R=310,T=12,B=200;
  let g=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12"><rect width="${W}" height="${H}" fill="#fff"/>`;
  const line=(pts,c)=>`<polyline fill="none" stroke="${c.col}" stroke-width="2.4"${c.dash?` stroke-dasharray="${c.dash}"`:""} points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}"/>`;
  let leg;
  if(mode==="mm"){
    const sx=o.smax||10,vy=o.vmax||Math.max(...curves.map(c=>c.vm))*1.15;
    const X=v=>L+(R-L)*v/sx,Y=v=>B-(B-T)*v/vy;
    g+=`<line x1="${L}" y1="${B}" x2="${R}" y2="${B}" stroke="#1c1c1c"/><line x1="${L}" y1="${T}" x2="${L}" y2="${B}" stroke="#1c1c1c"/>`;
    curves.forEach(c=>{const p=[];for(let k=0;k<=120;k++){const S=sx*k/120;p.push([X(S),Y(c.vm*S/(c.km+S))]);}
      if(o.vlines)g+=`<line x1="${L}" x2="${R}" y1="${Y(c.vm)}" y2="${Y(c.vm)}" stroke="${c.col}" stroke-width="1" stroke-dasharray="2 3"/>`;
      g+=line(p,c);
      if(o.marks&&c.km<=sx)g+=`<line x1="${X(c.km)}" x2="${X(c.km)}" y1="${Y(c.vm/2)}" y2="${B}" stroke="${c.col}" stroke-width="1" stroke-dasharray="3 3"/><circle cx="${X(c.km)}" cy="${Y(c.vm/2)}" r="3.5" fill="${c.col}"/>`;});
    g+=`<text x="${R}" y="${B+16}" text-anchor="end" fill="#666">[S] →</text><text x="${L+4}" y="${T+10}" fill="#666">V</text>`;
    leg=[R-6,T+14,"end"];
  }else{
    const xmax=o.xmax||2.5,xmin=Math.min(...curves.map(c=>-1/c.km))*1.3;
    const ymax=Math.max(...curves.map(c=>c.km/c.vm*xmax+1/c.vm))*1.08;
    const X=v=>L+(R-L)*(v-xmin)/(xmax-xmin),Y=v=>B-(B-T)*v/ymax;
    g+=`<line x1="${L}" y1="${B}" x2="${R}" y2="${B}" stroke="#1c1c1c"/><line x1="${X(0)}" y1="${T}" x2="${X(0)}" y2="${B}" stroke="#1c1c1c"/>`;
    curves.forEach(c=>{const x0=-1/c.km;g+=line([[X(x0),Y(0)],[X(xmax),Y(c.km/c.vm*xmax+1/c.vm)]],c);
      g+=`<circle cx="${X(x0)}" cy="${Y(0)}" r="3.5" fill="${c.col}"/><circle cx="${X(0)}" cy="${Y(1/c.vm)}" r="3.5" fill="${c.col}"/>`;});
    g+=`<text x="${R}" y="${B+16}" text-anchor="end" fill="#666">1/[S]</text><text x="${X(0)+5}" y="${T+10}" fill="#666">1/V</text>`;
    leg=[L+4,T+14,"start"];
  }
  curves.forEach((c,i)=>{if(!c.lab)return;const y=leg[1]+i*16,x=leg[0];const lx=leg[2]==="end"?x-20:x;
    g+=`<line x1="${lx}" x2="${lx+16}" y1="${y-4}" y2="${y-4}" stroke="${c.col}" stroke-width="2.4"${c.dash?` stroke-dasharray="${c.dash}"`:""}/><text x="${leg[2]==="end"?x-24:x+20}" y="${y}" text-anchor="${leg[2]}" fill="${c.col}">${c.lab}</text>`;});
  return g+"</svg>";
}
function plotDrill(d,body){
  const N=10,BK="#1c1c1c",BL="#1f4b8f";
  const kinds=shuffle(["mmI","mmI","mmI","lbI","lbI","lbI","mmK","mmV","lbK","lbV"]);
  const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
  const TY=["Competitive","Noncompetitive","Uncompetitive"];
  const WHY={mm:["Same plateau, so Vmax is unchanged. The blue curve needs more substrate to reach half of it, so Km went up. Extra substrate outcompetes the inhibitor: competitive.","Lower plateau, but both curves reach half of their own maximum at the same [S]. Vmax down, Km unchanged: noncompetitive.","Lower plateau, and the blue curve reaches half of its own maximum at a lower [S]. Vmax and Km both dropped: uncompetitive."],
    lb:["The lines meet on the y-axis. Same 1/Vmax means same Vmax. The blue x-intercept moved toward zero, so −1/Km got smaller in size and Km went up: competitive.","The lines meet on the x-axis. Same −1/Km means same Km. The blue y-intercept is higher, so 1/Vmax went up and Vmax went down: noncompetitive.","The lines are parallel, so both intercepts moved. Higher y-intercept means lower Vmax. The x-intercept moved farther left, so Km went down too: uncompetitive."]};
  const items=kinds.slice(0,N).map(k=>{
    const mode=k.slice(0,2),q=k.slice(2);
    if(q==="I"){const t=Math.floor(Math.random()*3),K=rnd(.5,.9),a=pick([2,2.5,3]);let km=K,vm=100;if(t===0)km=K*a;if(t===1)vm=100/a;if(t===2){km=K/a;vm=100/a;}
      return {mode,cur:[{km:K,vm:100,col:BK,lab:"no inhibitor"},{km,vm,col:BL,lab:"+ inhibitor"}],t:"Black has no inhibitor. Blue has an inhibitor added. Which type of inhibitor is it?",opts:TY,a:t,e:WHY[mode][t]};}
    const r=pick([1/3,1,3]),K=rnd(.45,.7),V=pick([80,100,120]);
    let kmA=K,kmB=K,vmA=V,vmB=V;
    if(q==="K"){kmB=K*r;vmB=pick([V*.6,V,V*1.5]);if(r===1&&vmB===V)vmB=V*1.5;}
    else{vmB=V*r**.45;kmB=pick([K/2.5,K,K*2.5]);if(r===1&&kmB===K)kmB=K*2.5;}
    const cur=[{km:kmA,vm:vmA,col:BK,lab:"enzyme A"},{km:kmB,vm:vmB,col:BL,lab:"enzyme B"}];
    const opts=["Enzyme A (black)","Enzyme B (blue)","About the same"];
    if(q==="K"){const a=Math.abs(kmA-kmB)<1e-6?2:(kmA<kmB?0:1);
      const e=mode==="mm"?"Read each curve at half of its own plateau, then drop down to [S]. "+(a===2?"Both reach half of Vmax at the same [S], so the Km values match even though the plateaus differ.":"Enzyme "+(a===0?"A":"B")+" gets there at lower [S], so it has the lower Km."):"The x-intercept is −1/Km. "+(a===2?"Both lines hit the x-axis at the same point, so Km is the same.":"The intercept farther left of zero means a larger 1/Km, so a smaller Km: enzyme "+(a===0?"A":"B")+".");
      return {mode,cur,t:"Which enzyme has the lower Km for this substrate?",opts,a,e};}
    const a=Math.abs(vmA-vmB)<1e-6?2:(vmA>vmB?0:1);
    const e=mode==="mm"?"Vmax is the plateau each curve levels off toward. "+(a===2?"Both level off at the same height.":"Enzyme "+(a===0?"A":"B")+" levels off higher."):"The y-intercept is 1/Vmax, so the lower intercept is the higher Vmax. "+(a===2?"Both lines cross the y-axis at the same point.":"Enzyme "+(a===0?"A":"B")+" has the lower y-intercept.");
    return {mode,cur,t:"Which enzyme has the higher Vmax?",opts,a,e};
  });
  let i=0,right=0;
  function show(){
    body.innerHTML="";
    body.append(h("div",{class:"dtop"},h("button",{class:"btn sm",type:"button",onclick:()=>plotDrill(d,body)},"Restart")));
    if(i>=N){const res=right+" / "+N+" correct";S.drills[d.id]=res;save();body.append(h("p",null,res),h("div",{class:"row"},h("button",{class:"btn pri",onclick:()=>plotDrill(d,body)},"New set")));return;}
    const it=items[i];

      const f=fig(s.q.fig);if(f){f.style.maxWidth="460px";d.append(f);}
      d.append(h("div",{class:"sm"},h("span",{class:"ya"},"Your answer: "),h("span",{html:s.pick==null?"none":s.order[s.pick].t})));
      d.append(h("div",{class:"sm"},h("span",{class:"ca"},"Correct: "),h("span",{html:s.order.find(o=>o.c).t})));
      const ex=explain(s.q,false,s.pick==null);ex.firstChild.remove();d.append(ex);main.append(d);
    });
    main.append(h("div",{class:"row"},h("button",{class:"btn pri",onclick:()=>go("mock")},"New mock"),miss.length?h("button",{class:"btn",onclick:()=>runPractice(miss.map(s=>s.q),"Missed from mock "+num)},"Practice the missed ones"):null));
  }
  show();return true;
}

// ===== STUDY GUIDE =====
let io=null;
tabs.sheet={cleanup(){if(io){io.disconnect();io=null;}},render(){
  const onlySaved=!!S.set.onlySaved;
  const wrap=h("div",{class:"gwrap"});const side=h("aside",{class:"gside"});const body=h("div",{class:"gbody"});wrap.append(side,body);main.append(wrap);
  // sidebar / outline
  const sv=h("button",{class:"pill"+(onlySaved?" on":""),onclick:()=>{S.set.onlySaved=!onlySaved;S.pos.sheet=0;save();go("sheet");}},"Saved only ("+Object.keys(S.saved).filter(k=>LES[k]).length+")");
  side.append(h("div",{class:"gtitle"},"Contents"),sv);
  const jumpSel=h("select",{class:"gjump"},h("option",{value:""},"Jump to…"));
  const outl=h("div",{class:"outline"});side.append(outl);
  body.append(h("div",{class:"gtop"},jumpSel,sv.cloneNode(true)));
  body.querySelector(".gtop .pill").addEventListener("click",()=>{S.set.onlySaved=!onlySaved;S.pos.sheet=0;save();go("sheet");});
  jumpSel.addEventListener("change",()=>{const e=document.getElementById(jumpSel.value);if(e)e.scrollIntoView();jumpSel.value="";});
  if(onlySaved&&!Object.keys(S.saved).filter(k=>LES[k]).length)body.append(h("p",{class:"mut"},"Nothing saved yet. Tap the bookmark on any lesson."));
  const links={};
  MODS.forEach(m=>{
    const los=m.los.filter(l=>!onlySaved||((m.guide||{})[l.id]||[]).some(b=>b.id&&S.saved[b.id]));if(!los.length)return;
    outl.append(h("div",{class:"omod"},m.short+": "+m.name.split(": ")[1]));
    body.append(h("div",{class:"modhead"},m.name));
    los.forEach(l=>{
      const id="s"+l.id.replace(".","-");
      const blocks=((m.guide||{})[l.id]||[]).filter(b=>!onlySaved||(b.id&&S.saved[b.id]));
      const qids=Q.filter(q=>q.lo===l.id).map(q=>q.id);
      const prog=()=>qids.filter(x=>S.q[x]).length+" / "+qids.length;
      const pr=h("span",{class:"oprog"},prog());
      const a=h("a",{href:"#"+id,onclick:e=>{e.preventDefault();document.getElementById(id).scrollIntoView();}},h("span",null,l.id),h("span",{class:"ot"},l.nick||shortT(l.title)),pr);
      outl.append(a);links[id]=a;
      jumpSel.append(h("option",{value:id},l.id+" "+(l.nick||shortT(l.title))));
      blocks.filter(b=>b.id).forEach(b=>{outl.append(h("a",{class:"les",href:"#"+b.id,onclick:e=>{e.preventDefault();document.getElementById(b.id).scrollIntoView();}},b.h));jumpSel.append(h("option",{value:b.id},"\u00a0\u00a0\u00a0"+b.h));});
      const sec=h("section",{class:"unit",id});
      const upr=h("span",{class:"uprog"});const updProg=()=>{const t=prog();pr.textContent=t;upr.textContent=qids.length?t+" practice questions answered":"";};updProg();
      sec.append(h("div",{class:"uhead"},h("div",null,h("div",{class:"eyebrow"},"Objective "+l.id),h("h2",null,l.title),upr)));
      blocks.forEach(b=>sec.append(block(b,m)));
      body.append(sec);
    });
  });
  // highlight current section in outline
  try{io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){Object.values(links).forEach(a=>a.classList.remove("cur"));const a=links[e.target.id];if(a)a.classList.add("cur");}});},{rootMargin:"-30% 0px -60% 0px"});body.querySelectorAll(".unit").forEach(u=>io.observe(u));}catch(e){}
}};
function shortT(t){return t.replace(/^(Relate|Describe|Determine|Apply knowledge of|Summarize|Outline|Classify|Explain|Interpret|Categorize|Investigate|Apply|Diagram|Predict) /,"").replace(/^the /,"").replace(/^./,c=>c.toUpperCase());}
function block(b,m){
  if(b.drill){
    const d=(m.drills||[]).find(x=>x.id===b.drill);const w=h("div",{class:"card drill"});
    w.append(h("div",{class:"clabel"},"Drill"),h("h3",null,d.title),h("p",{class:"mut sm"},d.intro));
    const bd=h("div");w.append(bd);
    if(d.kind==="sort")sortDrill(d,bd,0);else if(d.kind==="case")caseDrill(d,bd);else if(d.kind==="plot")plotDrill(d,bd);
    return w;
  }
  if(b.tool){const tm=TOOLMETA[b.tool];const w=h("div",{class:"card"});w.append(h("div",{class:"clabel"},"Tool"),h("h3",null,tm[0]),h("p",{class:"mut sm"},tm[1]),TOOLS[b.tool]());return w;}
  if(b.steps){
    const w=h("div",{class:"card"});w.append(h("div",{class:"clabel"},"Worked example"),h("h3",{html:b.steps}));
    const ol=h("ol",{class:"wsteps"});w.append(ol);let n=0;
    const nb=h("button",{class:"btn sm",onclick:()=>{n++;paint();}},"Next step");const all=h("button",{class:"btn link sm",onclick:()=>{n=b.s.length;paint();}},"Show all");
    w.append(h("div",{class:"row"},nb,all));
    function paint(){ol.innerHTML="";b.s.slice(0,Math.max(1,n)).forEach((x,i)=>ol.append(h("li",{html:x,class:i===b.s.length-1?"last":""})));nb.disabled=n>=b.s.length;nb.classList.toggle("hide",n>=b.s.length);all.classList.toggle("hide",n>=b.s.length);}
    n=1;paint();return w;
  }
  const w=h("div",{class:"card",id:b.id||null});
  if(b.h)w.append(h("div",{class:"lhead"},h("h3",{html:b.h+(b.beyond?' <span class="tag">beyond lecture</span>':"")}),b.id?bmkBtn(b.id):null));
  const bodyEl=h("div",{class:"cb",html:b.b||""});
  bodyEl.querySelectorAll("table").forEach(t=>{const x=h("div",{class:"tw"});t.replaceWith(x);x.append(t);});
  const f=b.fig?fig(b.fig):null;
  if(f&&(b.fig==="phscale"||b.fig==="forces"||b.fig==="classes"||b.fig==="water"||b.fig==="bicarb")){w.append(f,bodyEl);}else{w.append(bodyEl);if(f)w.append(f);}
  if(b.img){const fi=h("figure",{class:"limg"},h("img",{src:b.img.src,alt:b.img.alt,loading:"lazy"}),h("figcaption",{class:"credit",html:b.img.credit}));w.insertBefore(fi,bodyEl.nextSibling);}
  if(b.note)w.append(h("div",{class:"call note"},h("b",null,b.nl||"Note"),h("div",{html:b.note})));
  if(b.so)w.append(h("p",{class:"so",html:b.so}));
  return w;
}

document.getElementById("reset").addEventListener("click",function(){
  if(this.dataset.arm){S={q:{},mocks:0,set:S.set,drills:{},flag:{},saved:S.saved,pos:S.pos,hist:[]};save();this.textContent="Reset progress";delete this.dataset.arm;go(tab);}
  else{this.dataset.arm="1";this.textContent="Tap again to reset";setTimeout(()=>{this.textContent="Reset progress";delete this.dataset.arm;},3000);}
});
const start=(location.hash||"").slice(1)||"mock";tab=null;go(tabs[start]?start:"mock");
})();
</script>
