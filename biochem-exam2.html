stem:"The figure shows the regulators of phosphofructokinase-1. Which molecule belongs at 2?",
opts:["Fructose-2,6-bisphosphate","Phosphoenolpyruvate","Glucose-6-phosphate","Alanine"],ans:0,
exp:"The activators of PFK-1 are AMP and fructose-2,6-bisphosphate. Phosphoenolpyruvate is an inhibitor and belongs at 1."},
{id:"m4b16",lo:"4.2",src:"L2",ref:"m4-reg1",type:"mc",kind:"why",inv:["m4-reg1.c4"],
stem:"Why is AMP a more sensitive regulator of phosphofructokinase-1 than ATP?",
opts:["AMP is normally very low, so a rise in AMP stands out","AMP is always at a high concentration in the cell","AMP is a product of the citric acid cycle","AMP is made from F6P by phosphofructokinase-2"],ans:0,
exp:"ATP is always abundant. AMP is normally very low because it is rapidly converted to ADP, so a rise in AMP means too much ATP has been spent."},
{id:"m4b17",lo:"4.2",src:"L2",ref:"m4-phases",type:"mc",kind:"ex",inv:["m4-phases.c1"],
stem:"What does one glucose become at the end of glycolysis, and where in the cell does this happen?",
opts:["Two pyruvate, in the cytoplasm","Two pyruvate, in the mitochondrial matrix","One pyruvate, in the cytoplasm","Two acetyl CoA, in the mitochondrial matrix"],ans:0,
exp:"Glycolysis breaks one glucose into two pyruvate. It takes place in the cytoplasm, in 10 steps that proceed in one direction."},
{id:"m4b18",lo:"4.2",src:"L2",ref:"m4-phases",type:"tf",kind:"ex",inv:["m4-phases.c3"],
stem:"In Phase I of glycolysis, one glucose is cleaved into two phosphorylated trioses, and ATP provides the phosphates.",ans:true,
exp:"Phase I is the ATP-requiring phase. The hexose is cleaved into two 3-carbon sugars that carry phosphates taken from ATP."},
{id:"m4b19",lo:"4.2",src:"L2",ref:"m4-phases",type:"mc",kind:"fig",inv:["m4-phases.c4"],fig:"q-phases",
stem:"The figure summarizes the two phases of glycolysis. What happens in phase 2?",
opts:["The two trioses are oxidized and transfer their phosphates to ADP","One glucose is cleaved into two phosphorylated trioses","ATP provides the phosphates for the two trioses","Pyruvate is oxidized to acetyl CoA"],ans:0,
exp:"Phase 2 is steps 6 to 10, the ATP-generating phase. The two trioses are oxidized and then pass their phosphates to ADP."},
{id:"m4b20",lo:"4.2",src:"L2",ref:"m4-ph1",type:"mc",kind:"fig",inv:["m4-ph1.c1"],fig:"q-ph1-r1",
stem:"The figure shows Phase I of glycolysis. Which molecule belongs in the blank?",
opts:["Glucose-6-phosphate","Glucose-1-phosphate","Fructose-2,6-bisphosphate","1,3-Bisphosphoglycerate"],ans:0,
exp:"In step 1, hexokinase transfers a phosphate from ATP to glucose to produce glucose-6-phosphate."},
{id:"m4b21",lo:"4.2",src:"L2",ref:"m4-ph1",type:"mc",kind:"ex",inv:["m4-ph1.c2"],
stem:"What does phosphoglucose isomerase do in step 2 of glycolysis?",
opts:["Rearranges G6P into its isomer, fructose-6-phosphate","Transfers a phosphate from ATP to G6P","Splits G6P into two 3-carbon sugars","Converts DHAP into G3P"],ans:0,
exp:"Phosphoglucose isomerase converts G6P to fructose-6-phosphate. F6P is an isomer of G6P."},
{id:"m4b22",lo:"4.2",src:"L2",ref:"m4-ph1",type:"mc",kind:"why",inv:["m4-ph1.c5"],
stem:"Aldolase produces DHAP and G3P. Why does step 5 convert the DHAP into G3P?",
opts:["Only G3P can serve as the substrate for the next step","DHAP would inhibit phosphofructokinase-1","DHAP cannot be phosphorylated","G3P is the only form that can leave the cell"],ans:0,
exp:"DHAP and G3P are isomers, but only G3P can serve as the substrate for the next step, so the phase ends with two G3P."},
{id:"m4b23",lo:"4.2",src:"L2",ref:"m4-hkgk",type:"tf",kind:"ex",inv:["m4-hkgk.c1"],
stem:"Once glucose is phosphorylated, glucose-6-phosphate can leave the cell through a membrane transporter.",ans:false,
exp:"There is no membrane transporter for G6P, so it cannot leave the cell. Phosphorylation commits glucose to being metabolized."},
{id:"m4b24",lo:"4.2",src:"L2",ref:"m4-reg1",type:"mc",kind:"fig",inv:["m4-reg1.c3"],fig:"q-pfk",
stem:"The figure shows the regulators of phosphofructokinase-1. Which molecule belongs at 1?",
opts:["Phosphoenolpyruvate","Fructose-2,6-bisphosphate","Acetyl CoA","Glucose-6-phosphate"],ans:0,
exp:"The inhibitors of PFK-1 are ATP, citrate and phosphoenolpyruvate. High levels of these signal that the cell has ample energy."},
{id:"m4b25",lo:"4.2",src:"L2",ref:"m4-reg1",type:"mc",kind:"why",inv:["m4-reg1.c5"],
stem:"A high concentration of fructose-6-phosphate speeds up phosphofructokinase-1. Why?",
opts:["PFK-2 turns F6P into F2,6BP, which activates PFK-1","F6P binds PFK-1 and removes ATP from it","F6P is converted to AMP, which activates PFK-1","F6P inhibits hexokinase, which frees more ATP"],ans:0,
exp:"PFK-2 turns F6P, the substrate of PFK-1, into F2,6BP in a parallel pathway. F2,6BP tells PFK-1 to increase the rate."},
// ---------------- L3 ----------------
{id:"m4c01",lo:"4.2",src:"L3",ref:"m4-ph2",type:"mc",kind:"ex",inv:["m4-ph2.c1"],
stem:"When NAD gains an electron in glycolysis, which form does it make?",
opts:["NADH, the high-energy charged form","NAD⁺, the high-energy charged form","NADH, the low-energy uncharged form","NAD⁺, the low-energy uncharged form"],ans:0,
exp:"NAD carries high-energy electrons by alternating between NAD⁺ and NADH. Gaining an electron makes NADH, and losing one makes NAD⁺ again, so it is recycled."},
{id:"m4c02",lo:"4.2",src:"L3",ref:"m4-ph2",type:"mc",kind:"ex",inv:["m4-ph2.c2"],
stem:"What role does coenzyme A play in glucose metabolism?",
opts:["It carries acetyl groups, holding them on a sulfur","It carries electrons, alternating between two forms","It donates phosphates to ADP","It activates pyruvate kinase"],ans:0,
exp:"CoA is the acetyl group carrier. It moves an acetyl group from a substrate onto itself, or the reverse, using a sulfur group."},
{id:"m4c03",lo:"4.2",src:"L3",ref:"m4-ph2",type:"mc",kind:"why",inv:["m4-ph2.c3"],
stem:"Steps 7 and 10 each form one ATP, yet Phase II yields 4 ATP per glucose. Why?",
opts:["Both G3P made from one glucose run through Phase II in parallel","Steps 7 and 10 each form two ATP from every G3P","The NADH from step 6 is converted to 2 ATP","Enolase forms ATP when it releases water"],ans:0,
exp:"One glucose gives two G3P, and both run steps 6 to 10. After the 2 ATP spent in Phase I, glycolysis nets 2 ATP."},
{id:"m4c04",lo:"4.2",src:"L3",ref:"m4-ph2",type:"mc",kind:"fig",inv:["m4-ph2.c4"],fig:"q-ph2-r1",
stem:"The figure shows Phase II of glycolysis. Which molecule belongs in the blank?",
opts:["1,3-Bisphosphoglycerate","Fructose-1,6-bisphosphate","Fructose-2,6-bisphosphate","Acetyl CoA"],ans:0,
exp:"Step 6, glyceraldehyde-3-phosphate dehydrogenase, converts G3P to 1,3-BPG and makes NADH."},
{id:"m4c05",lo:"4.2",src:"L3",ref:"m4-ph2",type:"mc",kind:"ex",inv:["m4-ph2.c4"],
stem:"What does glyceraldehyde-3-phosphate dehydrogenase do to G3P in step 6?",
opts:["Removes a hydrogen to NAD⁺, then attaches a free phosphate from the cytosol","Transfers a phosphate from G3P to ADP","Removes water to make an unstable molecule","Moves the phosphate over to a different carbon"],ans:0,
exp:"Step 6 has two parts. A hydrogen goes to NAD⁺, forming NADH, and a free phosphate from the cytosol is attached, forming 1,3-BPG."},
{id:"m4c06",lo:"4.2",src:"L3",ref:"m4-ph2",type:"mc",kind:"fig",inv:["m4-ph2.c5"],fig:"q-ph2-atp",fixed:true,
stem:"The figure shows Phase II of glycolysis. At which lettered step is the first ATP formed?",
opts:["A","B","C","D"],ans:1,
exp:"Step 7, phosphoglycerate kinase (B), transfers a phosphate from 1,3-BPG to ADP to form the first ATP. The second ATP comes at step 10 (D)."},
{id:"m4c07",lo:"4.2",src:"L3",ref:"m4-ph2",type:"mc",kind:"ex",inv:["m4-ph2.c6"],
stem:"What happens to 3-phosphoglycerate in steps 8 and 9?",
opts:["Its phosphate is moved over to make 2-phosphoglycerate, then water is released to make PEP","Its phosphate goes to ADP, then NADH is formed","It is split into two 3-carbon sugars","A free phosphate is attached, then it becomes pyruvate"],ans:0,
exp:"Phosphoglycerate mutase moves the phosphate over to make 2-phosphoglycerate. Enolase converts that to the unstable PEP, forming and releasing water."},
{id:"m4c08",lo:"4.2",src:"L3",ref:"m4-ph2",type:"mc",kind:"fig",inv:["m4-ph2.c7"],fig:"q-ph2-e10",
stem:"The figure shows Phase II of glycolysis. Which enzyme belongs in the blank?",
opts:["Pyruvate kinase","Pyruvate dehydrogenase","Phosphofructokinase-1","Lactate dehydrogenase"],ans:0,
exp:"Pyruvate kinase transfers the final phosphate on PEP to ADP, forming pyruvate and the second ATP. It is the rate-limiting step of Phase II."},
{id:"m4c09",lo:"4.2",src:"L3",ref:"m4-ph2",type:"tf",kind:"ex",inv:["m4-ph2.c7"],
stem:"The pyruvate kinase reaction, PEP to pyruvate, is reversible.",ans:false,
exp:"The conversion of PEP to pyruvate is irreversible and highly regulated. Step 10 is the rate-limiting step of Phase II."},
{id:"m4c10",lo:"4.2",src:"L3",ref:"m4-reg2",type:"mc",kind:"fig",inv:["m4-reg2.c1"],fig:"q-pk-a",
stem:"The figure shows the regulators of pyruvate kinase. Which molecule belongs at 1?",
opts:["Fructose-1,6-bisphosphate","Fructose-2,6-bisphosphate","AMP","Glucose-6-phosphate"],ans:0,
exp:"F1,6BP and PEP activate pyruvate kinase. AMP and F2,6BP are the activators of PFK-1."},
{id:"m4c11",lo:"4.2",src:"L3",ref:"m4-reg2",type:"mc",kind:"why",inv:["m4-reg2.c1"],
stem:"Fructose-1,6-bisphosphate is made in step 3 but activates pyruvate kinase in step 10. Why?",
opts:["To speed up the later steps when the earlier steps are producing a lot of product","To slow glycolysis when the cell has plenty of energy","To signal that the cell must make glucose","To keep fructose-1,6-bisphosphate from leaving the cell"],ans:0,
exp:"Regulating a later enzyme is feedforward stimulation. When F1,6BP builds up, it tells pyruvate kinase to speed up."},
{id:"m4c12",lo:"4.2",src:"L3",ref:"m4-reg2",type:"mc",kind:"fig",inv:["m4-reg2.c2"],fig:"q-pk-i",
stem:"The figure shows the regulators of pyruvate kinase. Which molecule belongs at 1?",
opts:["Alanine","AMP","Fructose-2,6-bisphosphate","Glucose-6-phosphate"],ans:0,
exp:"ATP, citrate and alanine inhibit pyruvate kinase. All three signal that glucose does not need to be broken down."},
{id:"m4c13",lo:"4.2",src:"L3",ref:"m4-reg2",type:"mc",kind:"why",inv:["m4-reg2.c2"],
stem:"Why does a high concentration of alanine inhibit pyruvate kinase?",
opts:["It indicates the cell must make glucose, so glucose should not be broken down","It indicates the citric acid cycle is producing plenty of energy","It is a product of step 9 that has nowhere to go","It is the product that pyruvate kinase forms"],ans:0,
exp:"Alanine is an intermediate in a pathway that creates new glucose. In some cells, high alanine indicates the cell must make glucose, not catabolize it."},
{id:"m4c14",lo:"4.2",src:"L3",ref:"m4-reg2",type:"tf",kind:"ex",inv:["m4-reg2.c3"],
stem:"Intermediates of glycolysis can regulate glycolytic enzymes through both feedback and feedforward mechanisms.",ans:true,
exp:"G6P inhibiting hexokinase is feedback. F1,6BP activating pyruvate kinase, a later enzyme, is feedforward."},
{id:"m4c15",lo:"4.2",src:"L3",ref:"m4-pdh",type:"mc",kind:"fig",inv:["m4-pdh.c1"],fig:"q-fork",
stem:"The figure shows the two fates of pyruvate. Which molecule belongs at 2?",
opts:["Acetyl CoA","Citrate","Phosphoenolpyruvate","Glucose"],ans:0,
exp:"With oxygen, pyruvate dehydrogenase oxidizes pyruvate to acetyl CoA, the substrate that enters the citric acid cycle."},
{id:"m4c16",lo:"4.2",src:"L3",ref:"m4-pdh",type:"mc",kind:"ex",inv:["m4-pdh.c2"],
stem:"Glycolysis ends in the cytoplasm. How does pyruvate reach the enzyme that oxidizes it?",
opts:["It crosses the mitochondrial membrane on a protein transporter","It diffuses freely into the mitochondria","It is converted to acetyl CoA in the cytoplasm first","Coenzyme A carries it into the mitochondria"],ans:0,
exp:"Not just any molecule can enter the mitochondria, but pyruvate passes through the mitochondrial membrane using a protein transporter. Pyruvate dehydrogenase oxidizes it inside."},
{id:"m4c17",lo:"4.2",src:"L3",ref:"m4-pdh",type:"mc",kind:"fig",inv:["m4-pdh.c3"],fig:"q-pdh",
stem:"The figure shows the three steps of pyruvate oxidation. What leaves at 1?",
opts:["CO₂","NADH","Water","Coenzyme A"],ans:0,
exp:"In decarboxylation, pyruvate dehydrogenase removes a carboxyl group from pyruvate, releasing CO₂. NAD⁺ is reduced in step 2 and CoA joins in step 3."},
{id:"m4c18",lo:"4.2",src:"L3",ref:"m4-pdh",type:"tf",kind:"ex",inv:["m4-pdh.c4"],
stem:"Pyruvate oxidation runs once for every glucose that enters glycolysis.",ans:false,
exp:"One glucose makes two pyruvates, and both are oxidized, so the pathway runs twice per glucose."},
{id:"m4c19",lo:"4.2",src:"L3",ref:"m4-anaer",type:"mc",kind:"ex",inv:["m4-anaer.c1"],
stem:"How much ATP does anaerobic glycolysis make per glucose?",
opts:["2, all from glycolysis","2 from glycolysis plus 2 from lactate dehydrogenase","4, from Phase II","None, because it only recycles NAD⁺"],ans:0,
exp:"In anaerobic metabolism, ATP is only generated through glycolysis, so only 2 ATP are made. That makes it much less efficient."},
{id:"m4c20",lo:"4.2",src:"L3",ref:"m4-anaer",type:"mc",kind:"fig",inv:["m4-anaer.c2"],fig:"q-nadloop",
stem:"The figure shows anaerobic glycolysis. Which molecule is 1?",
opts:["NAD⁺","ATP","Coenzyme A","Pyruvate"],ans:0,
exp:"Glycolysis consumes NAD⁺ and makes NADH. Lactate dehydrogenase uses the NADH and regenerates NAD⁺, which goes back to glycolysis."},
{id:"m4c21",lo:"4.2",src:"L3",ref:"m4-anaer",type:"mc",kind:"why",inv:["m4-anaer.c2"],
stem:"The reactions of glycolysis do not require oxygen. Why does a cell need a different process when oxygen is absent?",
opts:["Without aerobic respiration, NADH is not recycled to NAD⁺, and glycolysis needs NAD⁺","Without oxygen, hexokinase cannot phosphorylate glucose","Pyruvate cannot leave the cytoplasm without oxygen","Glycolysis makes no ATP without oxygen"],ans:0,
exp:"Aerobic respiration normally converts NADH back to NAD⁺. Without it, NAD⁺ runs out and glycolysis cannot proceed."},
{id:"m4c22",lo:"4.2",src:"L3",ref:"m4-anaer",type:"mc",kind:"fig",inv:["m4-anaer.c3"],fig:"q-fork",
stem:"The figure shows the two fates of pyruvate. Which enzyme belongs at 1?",
opts:["Lactate dehydrogenase","Pyruvate kinase","Glyceraldehyde-3-phosphate dehydrogenase","Glucokinase"],ans:0,
exp:"Without oxygen, lactate dehydrogenase converts pyruvate to lactate, using NADH and regenerating NAD⁺."},
{id:"m4c23",lo:"4.2",src:"L3",ref:"m4-anaer",type:"mc",kind:"ex",inv:["m4-anaer.c4"],
stem:"Most cells can't metabolize lactate into a usable substrate. What happens to the lactate they make?",
opts:["It is released into the blood and travels to the liver","It is converted back to pyruvate in the same cell","It is exhaled as CO₂","It is stored as glycogen in the same cell"],ans:0,
exp:"Cells that produce lactate release it into the bloodstream to travel to the liver, where it can be used."},
{id:"m4c24",lo:"4.2",src:"L3",ref:"m4-anaer",type:"mc",kind:"why",inv:["m4-anaer.c5"],
stem:"Why is anaerobic glycolysis the only way red blood cells can get energy?",
opts:["They do not contain mitochondria","They cannot take up glucose","They lack lactate dehydrogenase","They cannot make NADH"],ans:0,
exp:"Without mitochondria, aerobic respiration cannot occur, so red blood cells don't use up the oxygen they carry."},
// ---------------- L4 ----------------
{id:"m4d01",lo:"4.2",src:"L4",ref:"m4-glystr",type:"mc",kind:"fig",inv:["m4-glystr.c2"],fig:"q-glybond",
stem:"The figure shows part of a glycogen molecule. Which bond is at 1?",
opts:["α-(1,4)-glycosidic bond","α-(1,6)-glycosidic bond","α-(1,2)-glycosidic bond","β-(1,6)-glycosidic bond"],ans:0,
exp:"Bond 1 is in a linear chain. α-(1,4)-glycosidic bonds form the linear chains, and α-(1,6)-glycosidic bonds form the branches."},
{id:"m4d02",lo:"4.2",src:"L4",ref:"m4-glystr",type:"mc",kind:"ex",inv:["m4-glystr.c2"],
stem:"Which bonds form the branches in glycogen?",
opts:["α-(1,6)-glycosidic bonds","α-(1,4)-glycosidic bonds","Hydrogen bonds between chains","Phosphate bonds from UDP"],ans:0,
exp:"α-(1,6)-glycosidic bonds form the branches. α-(1,4)-glycosidic bonds form the linear chains."},
{id:"m4d03",lo:"4.2",src:"L4",ref:"m4-glystr",type:"mc",kind:"why",inv:["m4-glystr.c1"],
stem:"Why do its branches make glycogen a good energy storage molecule?",
opts:["They allow rapid access to many glucose molecules","They let glycogen cross the cell membrane","They link glucose to other sugars such as fructose","They keep glycogen from being broken down"],ans:0,
exp:"Glycogen is linear chains of glucose with occasional branches, and the branches allow rapid access to many glucose molecules."},
{id:"m4d04",lo:"4.2",src:"L4",ref:"m4-tissue",type:"mc",kind:"ex",inv:["m4-tissue.c1"],
stem:"Blood sugar is low. Which tissue can release glucose from its glycogen into the blood for other tissues to use?",
opts:["Liver","Skeletal muscle","Both liver and skeletal muscle","Neither; glucose from glycogen stays in the cell that stored it"],ans:0,
exp:"Only the liver can use glycogen to supply glucose to the blood. Skeletal muscle uses its glycogen for its own energy needs."},
{id:"m4d05",lo:"4.2",src:"L4",ref:"m4-tissue",type:"tf",kind:"ex",inv:["m4-tissue.c2"],
stem:"Skeletal muscle releases glucose from its glycogen into the blood when blood sugar is low.",ans:false,
exp:"Skeletal muscle stores glucose as glycogen but does not release it into the blood. Only the muscle cell itself can use it."},
{id:"m4d06",lo:"4.2",src:"L4",ref:"m4-tissue",type:"mc",kind:"fig",inv:["m4-tissue.c3","m4-tissue.c4"],fig:"q-horm-p",
stem:"The figure shows how two hormones control glycogen in liver cells. Which process is 1?",
opts:["Glycogenesis","Glycogenolysis","Gluconeogenesis","Glycolysis"],ans:0,
exp:"Insulin stimulates glycogenesis, the synthesis of glycogen. Glucagon stimulates glycogenolysis, the breakdown of glycogen, at 2."},
{id:"m4d07",lo:"4.2",src:"L4",ref:"m4-tissue",type:"mc",kind:"fig",inv:["m4-tissue.c5"],fig:"q-horm-h",
stem:"The figure shows how two hormones control glycogen in liver cells. Which hormone is 2?",
opts:["Glucagon","Insulin","Glucose-6-phosphate","UDP-glucose"],ans:0,
exp:"Glucagon, released when blood sugar is low, stimulates glycogenolysis. Insulin, at 1, stimulates glycogenesis."},
{id:"m4d08",lo:"4.2",src:"L4",ref:"m4-tissue",type:"mc",kind:"ex",inv:["m4-tissue.c4"],
stem:"Blood sugar is high after a meal. What does insulin do to glycogen metabolism in the liver?",
opts:["Stimulates glycogenesis and inhibits glycogenolysis","Stimulates both glycogenesis and glycogenolysis","Inhibits glycogenesis and stimulates glycogenolysis","Inhibits both glycogenesis and glycogenolysis"],ans:0,
exp:"Insulin directs the body to store glucose in glycogen, so it stimulates glycogenesis and inhibits glycogenolysis."},
{id:"m4d09",lo:"4.2",src:"L4",ref:"m4-tissue",type:"mc",kind:"why",inv:["m4-tissue.c5"],
stem:"Why does glucagon stimulate glycogenolysis in the liver?",
opts:["Blood sugar is low, and the liver releases the freed glucose into the blood","Blood sugar is high, and the liver stores the extra glucose","The liver needs the glucose for its own energy only","Glycogenolysis makes new glucose from amino acids"],ans:0,
exp:"Glucagon is released when blood sugar is low. The liver breaks down glycogen and releases the glucose into the blood for other tissues."},
{id:"m4d10",lo:"4.2",src:"L4",ref:"m4-states",type:"mc",kind:"fig",inv:["m4-states.c2"],fig:"q-gsrc-s",
stem:"The graph shows where oxidized glucose comes from over time after a meal. Which metabolic state is 2, and which hormone rises during it?",
opts:["Fasting state, glucagon","Fasting state, insulin","Fed state, glucagon","Starvation, insulin"],ans:0,
exp:"State 2 is the fasting state, which begins about 2 hours after a meal. Insulin decreases, glucagon increases and liver glycogen is broken down."},
{id:"m4d11",lo:"4.2",src:"L4",ref:"m4-states",type:"mc",kind:"fig",inv:["m4-states.c4"],fig:"q-gsrc-c",fixed:true,
stem:"The graph shows where oxidized glucose comes from over time after a meal. Which curve is glycogenolysis?",
opts:["A","B","C"],ans:1,
exp:"Glycogenolysis, curve B, rises early in fasting and is gone by about a day. A is ingested glucose and C is gluconeogenesis."},
{id:"m4d12",lo:"4.2",src:"L4",ref:"m4-states",type:"mc",kind:"fig",inv:["m4-states.c1"],fig:"q-gsrc-s",
stem:"The graph shows where oxidized glucose comes from over time after a meal. What happens during state 1?",
opts:["Blood sugar rises and the pancreas releases insulin","Blood sugar falls and the pancreas releases glucagon","Liver glycogen is broken down and the glucose is released into the blood","The liver builds new glucose by gluconeogenesis"],ans:0,
exp:"State 1 is the fed state. Digestion and absorption raise blood sugar, and the rise triggers the pancreas to release insulin."},
{id:"m4d13",lo:"4.2",src:"L4",ref:"m4-states",type:"tf",kind:"ex",inv:["m4-states.c1","m4-states.c2"],
stem:"The fasting state is also called the postprandial state.",ans:false,
exp:"Postprandial, like absorptive, is another name for the fed state. The fasting state is also called the post-absorptive state."},
{id:"m4d14",lo:"4.2",src:"L4",ref:"m4-states",type:"mc",kind:"why",inv:["m4-states.c3","m4-states.c2"],
stem:"Why is gluconeogenesis the only source of blood glucose after about 24 hours without food?",
opts:["Liver glycogen stores are depleted by then","Insulin rises and blocks glycogenolysis","Skeletal muscle stops releasing its glycogen into the blood","Glycogen phosphorylase is only active in the fed state"],ans:0,
exp:"Glycogen breakdown maintains blood sugar only until liver glycogen is depleted, about 24 hours. After that, the liver builds new glucose by gluconeogenesis."},
{id:"m4d15",lo:"4.2",src:"L4",ref:"m4-genesis",type:"mc",kind:"why",inv:["m4-genesis.c1"],
stem:"In the fed state, why does the hepatocyte store glucose-6-phosphate as glycogen instead of sending it through glycolysis?",
opts:["ATP builds up in the hepatocyte and halts glycolysis","Glucokinase cannot make G6P in the fed state","G6P leaves the cell unless it is stored","Glucagon blocks glycolysis in the fed state"],ans:0,
exp:"In the fed state ATP builds up and halts glycolysis. G6P cannot cross the cell membrane, so the hepatocyte stores it as glycogen."},
{id:"m4d16",lo:"4.2",src:"L4",ref:"m4-genesis",type:"mc",kind:"fig",inv:["m4-genesis.c2"],fig:"q-gen-r",
stem:"The figure shows glycogenesis in the liver. Which molecule is 1?",
opts:["Glucose-1-phosphate","Fructose-6-phosphate","UDP-glucose","Pyruvate"],ans:0,
exp:"Phosphoglucomutase forms glucose-1-phosphate from G6P. G6P cannot be added to glycogen chains, but G1P can."},
{id:"m4d17",lo:"4.2",src:"L4",ref:"m4-genesis",type:"mc",kind:"fig",inv:["m4-genesis.c3"],fig:"q-gen-r",
stem:"The figure shows glycogenesis in the liver. Which molecule is 2?",
opts:["UDP-glucose","Glucose-1-phosphate","Fructose-6-phosphate","Lactate"],ans:0,
exp:"UDP, which comes from UTP, attaches to glucose-1-phosphate to form UDP-glucose, the main donor of glucose for glycogen synthesis."},
{id:"m4d18",lo:"4.2",src:"L4",ref:"m4-genesis",type:"mc",kind:"ex",inv:["m4-genesis.c3"],
stem:"What is the main donor of glucose during the synthesis of glycogen?",
opts:["UDP-glucose","Glucose-6-phosphate","Glycogenin","Free glucose from the blood"],ans:0,
exp:"UDP-glucose is the main donor. G6P cannot be added to glycogen chains, so it is converted to G1P and then to UDP-glucose."},
{id:"m4d19",lo:"4.2",src:"L4",ref:"m4-genesis",type:"mc",kind:"fig",inv:["m4-genesis.c4"],fig:"q-gen-e",
stem:"The figure shows glycogenesis in the liver. Which enzyme is 1?",
opts:["Glycogen synthase","Glycogen phosphorylase","Glucokinase","Glucose-6-phosphatase"],ans:0,
exp:"Glycogen synthase is the key, rate-limiting enzyme of glycogen synthesis. Glycogen phosphorylase breaks glycogen down."},
{id:"m4d20",lo:"4.2",src:"L4",ref:"m4-genesis",type:"mc",kind:"ex",inv:["m4-genesis.c4"],
stem:"In glycogenesis, what is UDP-glucose attached to first?",
opts:["Glycogenin","Glycogen synthase","Glucose-6-phosphatase","UTP"],ans:0,
exp:"UDP-glucose is attached to glycogenin, a foundation that can be built upon. Glucose is then added one by one into linear chains, and branches are added last."},
{id:"m4d21",lo:"4.2",src:"L4",ref:"m4-genesis",type:"tf",kind:"ex",inv:["m4-genesis.c4","m4-lysis.c1"],
stem:"The rate-limiting enzymes in glycogen synthesis and degradation are glycogen synthase and glycogen phosphorylase.",ans:true,
exp:"Glycogen synthase is rate-limiting for building glycogen and glycogen phosphorylase for breaking it down."},
{id:"m4d22",lo:"4.2",src:"L4",ref:"m4-lysis",type:"mc",kind:"fig",inv:["m4-lysis.c1"],fig:"q-tissue",
stem:"The figure compares glycogen breakdown in the liver and in skeletal muscle. Which enzyme is 1?",
opts:["Glycogen phosphorylase","Glycogen synthase","Glucokinase","Hexokinase"],ans:0,
exp:"Glycogen phosphorylase, activated by glucagon, adds a phosphate to the glucose at the end of a chain and frees it as glucose-1-phosphate."},
{id:"m4d23",lo:"4.2",src:"L4",ref:"m4-lysis",type:"mc",kind:"ex",inv:["m4-lysis.c2"],
stem:"Which statement about glycogen metabolism is true?",
opts:["Glucose-6-phosphate stimulates glycogen synthesis","Degradation of glycogen usually produces more glucose than glucose-1-phosphate","Exercise increases glycogen synthesis","Glycogen phosphorylase adds glucose to the end of a chain"],ans:0,
exp:"G6P stimulates glycogen synthesis. Glycogen breakdown produces mostly glucose-1-phosphate, and exercise does not increase glycogen synthesis."},
{id:"m4d24",lo:"4.2",src:"L4",ref:"m4-lysis",type:"mc",kind:"fig",inv:["m4-lysis.c3","m4-tissue.c2"],fig:"q-tissue",
stem:"The figure compares glycogen breakdown in the liver and in skeletal muscle. Skeletal muscle lacks enzyme 2. Which enzyme is it?",
opts:["Glucose-6-phosphatase","Glycogen phosphorylase","Hexokinase","Glycogen synthase"],ans:0,
exp:"Skeletal muscle does not have glucose-6-phosphatase, so it cannot release glucose from the cell. Its glycogen serves only its own energy needs."},
{id:"m4d25",lo:"4.2",src:"L4",ref:"m4-lysis",type:"mc",kind:"ex",inv:["m4-lysis.c3"],
stem:"Which enzyme do skeletal muscle cells use to make G6P from glucose?",
opts:["Hexokinase","Glucokinase","Phosphoglucomutase","Glucose-6-phosphatase"],ans:0,
exp:"Myocytes use hexokinase instead of glucokinase. Otherwise glycogen synthesis in muscle is essentially the same as in the liver."},
// ---------------- L5 ----------------
{id:"m4e01",lo:"4.2",src:"L5",ref:"m4-gng",type:"mc",kind:"ex",inv:["m4-gng.c1"],
stem:"In gluconeogenesis, glucose is created from which molecules?",
opts:["Amino acids, lactate and glycerol","Glycogen, sucrose and lactose","Acetyl CoA, CO₂ and water","Ketones, citrate and NADH"],ans:0,
exp:"Gluconeogenesis creates glucose from molecules such as amino acids, lactate and glycerol, which come from β-oxidation and protein catabolism."},
{id:"m4e02",lo:"4.2",src:"L5",ref:"m4-gng",type:"mc",kind:"fig",inv:["m4-gng.c1"],fig:"q-loop",
stem:"The figure shows glucose and lactate moving between muscle and the liver. Which process is 1?",
opts:["Gluconeogenesis","Glycogenolysis","Glycogenesis","Pyruvate oxidation"],ans:0,
exp:"Lactate is one of the molecules the liver uses to create new glucose by gluconeogenesis."},
{id:"m4e03",lo:"4.2",src:"L5",ref:"m4-bypass",type:"mc",kind:"fig",inv:["m4-gng.c2","m4-bypass.c1"],fig:"q-bypass",
stem:"The figure compares glycolysis and gluconeogenesis. How does gluconeogenesis carry out the stretch marked A, from phosphoenolpyruvate to fructose 1,6-bisphosphate?",
opts:["With the glycolytic enzymes acting in reverse","With four enzymes not used in glycolysis","With pyruvate carboxylase and PEP carboxykinase","It cannot; that stretch is irreversible"],ans:0,
exp:"PEP is converted to fructose-1,6-bisphosphate by the glycolytic enzymes in reverse, from enolase to aldolase. Only the three irreversible steps need different enzymes."},
{id:"m4e04",lo:"4.2",src:"L5",ref:"m4-gng",type:"tf",kind:"ex",inv:["m4-gng.c3"],
stem:"Gluconeogenesis and glycolysis occur at the same time in liver cells.",ans:false,
exp:"Gluconeogenesis is energy expensive and highly regulated, and it does not occur at the same time as glycolysis."},
{id:"m4e05",lo:"4.2",src:"L5",ref:"m4-gng",type:"mc",kind:"fig",inv:["m4-gng.c4"],fig:"q-pepck",
stem:"The figure shows the most important point of regulation in gluconeogenesis. Which enzyme catalyzes this reaction?",
opts:["PEP carboxykinase","Pyruvate carboxylase","Pyruvate kinase","Fructose-1,6-bisphosphatase"],ans:0,
exp:"PEP carboxykinase converts oxaloacetate to PEP. It is the most important point of regulation and is regulated primarily by glucagon."},
{id:"m4e06",lo:"4.2",src:"L5",ref:"m4-gng",type:"mc",kind:"why",inv:["m4-gng.c4"],
stem:"Why does glucagon stimulate PEP carboxykinase?",
opts:["Glucagon is released when blood glucose is low, and gluconeogenesis raises blood glucose","Glucagon is released after a meal, when glucose must be stored","PEP carboxykinase breaks down glycogen","Glucagon signals that ATP is plentiful"],ans:0,
exp:"The pancreas releases glucagon when blood glucose is low, so glucagon stimulates gluconeogenesis to increase the blood glucose concentration."},
{id:"m4e07",lo:"4.4",src:"L5",ref:"m4-timeline",type:"mc",kind:"fig",inv:["m4-timeline.c1"],fig:"q-gsrc-c",fixed:true,
stem:"The graph shows where oxidized glucose comes from over time after a meal. Which curve is the only source of blood glucose after a whole day without food?",
opts:["A","B","C"],ans:2,
exp:"After a whole day without food, gluconeogenesis (curve C) is the only way to maintain blood glucose. Liver glycogen is depleted after about 24 hours."},
{id:"m4e08",lo:"4.4",src:"L5",ref:"m4-timeline",type:"mc",kind:"fig",inv:["m4-timeline.c1"],fig:"q-gsrc-c",
stem:"The graph shows where oxidized glucose comes from over time after a meal. About when do glycogenolysis (B) and gluconeogenesis (C) contribute nearly equally?",
opts:["12 to 18 hours after the meal","2 hours after the meal","2 days after the meal","40 days after the meal"],ans:0,
exp:"Around 12 to 18 hours after the last meal, glycogenolysis and gluconeogenesis contribute nearly equally to maintaining blood sugar."},
{id:"m4e09",lo:"4.4",src:"L5",ref:"m4-timeline",type:"mc",kind:"why",inv:["m4-timeline.c2"],
stem:"In starvation, why does it become really important to obtain food?",
opts:["When substrates for gluconeogenesis run low, blood sugar drops, and a prolonged drop can be fatal","Glycogen stores refill only after the next meal","The brain cannot use ketones","Gluconeogenesis stops as soon as glucagon rises"],ans:0,
exp:"When the body runs low on substrates for gluconeogenesis, blood sugar can drop (hypoglycemia). A significant decrease for an extended period can be fatal."},
{id:"m4e10",lo:"4.4",src:"L5",ref:"m4-timeline",type:"mc",kind:"ex",inv:["m4-timeline.c3"],
stem:"Which cells rely on glucose for almost all of their energy needs?",
opts:["Neurons, red blood cells and exercising skeletal muscle","Liver cells and resting skeletal muscle","Red blood cells only","Liver and kidney cells"],ans:0,
exp:"Neurons, red blood cells and, during exercise, skeletal muscle cells rely on glucose for almost all of their energy."},
{id:"m4e11",lo:"4.4",src:"L5",ref:"m4-timeline",type:"tf",kind:"ex",inv:["m4-timeline.c3"],
stem:"During the fed and fasting states, the brain uses only glucose for energy.",ans:true,
exp:"The brain uses around 70% of the body's glucose. It turns to other molecules, namely ketones, only in starvation."},
{id:"m4e12",lo:"4.2",src:"L5",ref:"m4-bypass",type:"mc",kind:"fig",inv:["m4-bypass.c4"],fig:"q-bypass",
stem:"The figure compares glycolysis and gluconeogenesis. Which enzyme is 1?",
opts:["Glucose-6-phosphatase","Glucokinase","Glycogen phosphorylase","Phosphoglucomutase"],ans:0,
exp:"Glucose-6-phosphatase converts G6P to glucose, bypassing hexokinase. The glucose can then leave the cell."},
{id:"m4e13",lo:"4.2",src:"L5",ref:"m4-bypass",type:"mc",kind:"fig",inv:["m4-bypass.c3"],fig:"q-bypass",
stem:"The figure compares glycolysis and gluconeogenesis. Which enzyme is 2?",
opts:["Fructose-1,6-bisphosphatase","Phosphofructokinase-2","Aldolase","Glucose-6-phosphatase"],ans:0,
exp:"Fructose-1,6-bisphosphatase removes one phosphate from fructose-1,6-bisphosphate to give fructose-6-phosphate, bypassing phosphofructokinase-1."},
{id:"m4e14",lo:"4.2",src:"L5",ref:"m4-bypass",type:"mc",kind:"fig",inv:["m4-bypass.c2"],fig:"q-bypass",
stem:"The figure compares glycolysis and gluconeogenesis. Which enzymes are 3 and 4?",
opts:["3 pyruvate carboxylase, 4 PEP carboxykinase","3 PEP carboxykinase, 4 pyruvate carboxylase","3 pyruvate dehydrogenase, 4 PEP carboxykinase","3 pyruvate carboxylase, 4 enolase"],ans:0,
exp:"Pyruvate carboxylase converts pyruvate into oxaloacetate, then PEP carboxykinase converts oxaloacetate to PEP. Together they bypass pyruvate kinase."},
{id:"m4e15",lo:"4.2",src:"L5",ref:"m4-bypass",type:"mc",kind:"ex",inv:["m4-bypass.c2"],
stem:"Pyruvate kinase cannot convert pyruvate back into PEP. How does gluconeogenesis make PEP from pyruvate?",
opts:["Pyruvate carboxylase makes oxaloacetate, then PEP carboxykinase makes PEP","PEP carboxykinase converts pyruvate directly to PEP","Pyruvate dehydrogenase makes acetyl CoA, which becomes PEP","Enolase converts pyruvate to PEP"],ans:0,
exp:"The first bypass step takes two enzymes: pyruvate carboxylase turns pyruvate into oxaloacetate, and PEP carboxykinase turns oxaloacetate into PEP."},
{id:"m4e16",lo:"4.2",src:"L5",ref:"m4-bypass",type:"mc",kind:"ex",inv:["m4-bypass.c3"],
stem:"Which pairs a glycolysis enzyme with its gluconeogenesis counterpart correctly?",
opts:["Phosphofructokinase-1 : fructose-1,6-bisphosphatase","Hexokinase : pyruvate carboxylase","Pyruvate kinase : glucose-6-phosphatase","Phosphofructokinase-1 : PEP carboxykinase"],ans:0,
exp:"Phosphofructokinase-1 pairs with fructose-1,6-bisphosphatase, pyruvate kinase with PEP carboxykinase and pyruvate carboxylase, and hexokinase with glucose-6-phosphatase."},
{id:"m4e17",lo:"4.2",src:"L5",ref:"m4-bypass",type:"mc",kind:"why",inv:["m4-bypass.c4"],
stem:"Why can the glucose made by gluconeogenesis in the liver enter the bloodstream?",
opts:["Glucose-6-phosphatase converts G6P to glucose, which can leave the cell","Pyruvate carboxylase exports glucose from the cell","G6P has its own membrane transporter","Glycogen synthase releases it into the blood"],ans:0,
exp:"G6P cannot leave the cell. Glucose-6-phosphatase catalyzes the final step, G6P to glucose, and the glucose can then enter the bloodstream."},
{id:"m4e18",lo:"4.2",src:"L5",ref:"m4-bypass",type:"mc",kind:"ex",inv:["m4-bypass.c1"],
stem:"How does gluconeogenesis get around the three irreversible steps of glycolysis?",
opts:["Four enzymes that are not involved in glycolysis","Three glycolytic enzymes run in reverse","Two enzymes, each used twice","Ten enzymes shared with glycolysis"],ans:0,
exp:"Gluconeogenesis uses four enzymes not involved in glycolysis to bypass the three irreversible steps. In all it has 11 steps and forms one glucose from 2 pyruvate."}

],

guide:{
"5.1":[
// ---------------- L1 Lipid Structure and Function ----------------
{id:"m5-fatag",h:"Fatty acids and triglycerides",
img:{src:"lectures/biochem-exam2/img/m5/image-62a0d3a8c78ac.webp",alt:"Glycerol and a free fatty acid, and a triglyceride: a glycerol backbone with three fatty acid chains attached",credit:"Lecture figure, Lesson 1."},
b:`<p>Module 1 introduced the main classes of lipids: triglycerides, phospholipids, and steroids and waxes. This lesson adds detail to each, starting with the fatty acids (FAs), the building blocks of the triglycerides.</p>
<p>A <b>fatty acid</b> is a chain of carbon atoms with a methyl group (-CH₃) at one end and a carboxylic acid group (-COOH), the acid part of the name, at the other end. The length of the chain can vary. Other structures can be linked to the carboxyl end through ester bonds.</p>
<p>A <b>triglyceride</b> is the storage form of fatty acids: three fatty acids combined together by a glycerol backbone, attached through ester bonds. We store these fatty acids in our adipose tissue.</p>
<p>The fatty acid is the derived lipid, coming from the hydrolysis of the triglyceride. The two terms are often used interchangeably, because the part we care about for metabolism is the fatty acid and the triglyceride is just how we store it. They are not the same thing: a fatty acid is one part of a triglyceride.</p>`,
so:"A fatty acid is one chain. A triglyceride is three of them on glycerol, stored in adipose tissue."},

{id:"m5-roles",h:"What fats do",
b:`<p>Fats provide high energy, about twice as much energy as carbohydrates, for long-term use. They have other roles as well.</p>
<ul><li><b>Thermal insulation.</b> Adipose tissue, where we store fat, maintains the temperature of our subcutaneous tissues and vital organs.</li>
<li><b>Electrical insulation.</b> Fats make up the myelin sheath around nerve cells, which allows rapid passage of action potentials down long axons. This is vital for quick communication between nerves.</li>
<li><b>Absorbing nutrients.</b> Many vitamins and nutrients are nonpolar, so they will not dissolve in water. For the body to absorb them, they need to dissolve in fat.</li>
<li><b>Other functions.</b> Fats, especially omegas, also assist with hormone production, blood clotting, brain function, cholesterol transport and inflammation.</li></ul>
<p><b>Prostaglandins</b> are one type of fat. They act as a hormone found in almost every mammalian tissue. They trigger the inflammatory response in cases of injury and illness, affect blood flow for blood clotting, and help induce labor.</p>
<p>From the lecture's check: as fat, I am both a thermal and electrical insulator.</p>`,
so:"Long-term energy, thermal and electrical insulation, absorbing nonpolar nutrients, and signals such as prostaglandins."},

{id:"m5-sat",h:"Saturated, cis, trans, omega-3",
img:{src:"lectures/biochem-exam2/img/m5/file-62a0eba76b7ee.webp",alt:"Four fatty acid chains: saturated with only single bonds, monounsaturated cis with one double bond and a bend, polyunsaturated cis omega-3 with three double bonds, and monounsaturated trans with one double bond and a straight chain",credit:"Lecture figure, Lesson 1."},
b:`<p>Fatty acids are sorted by their double bonds, and the bonds decide how tightly the chains pack.</p>
<table><tr><th>Type</th><th>Bonds and packing</th><th>Room temperature</th></tr>
<tr><td>Saturated</td><td>No double bonds, all carbon-carbon single bonds. Tightly packed, higher melting temperature.</td><td>Solid. Typically animal fats.</td></tr>
<tr><td>Cis unsaturated</td><td>One or more double bonds in the cis formation. Loosely packed, lower melting temperature.</td><td>Liquid. Typically plant-based fats.</td></tr>
<tr><td>Trans unsaturated</td><td>Double bonds in the trans formation. Man-made during food processing.</td><td>Likely to stay solid</td></tr></table>
<p><b>Saturated</b> fatty acids have the full amount of hydrogens possible. They cannot take any more on.</p>
<p>An <b>unsaturated</b> fatty acid contains one or more double bonds. A monounsaturated fat contains a single double bond, and a polyunsaturated fat contains two or more. When fats are unsaturated in nature, they are almost always in the cis formation.</p>
<p><b>Trans fats.</b> When fats are saturated during food processing, the saturation is man-made, and the double bonding typically occurs in the trans formation rather than the cis formation. Their structure makes trans fats harder to break down. They are likely to stay solid, clogging arteries and leading to cardiovascular disease. They are found in shortenings and margarines, any time a traditionally liquid fat is turned into a solid fat, and in foods made with these, like fried foods and baked goods.</p>
<p>Trans fats also hide under another name, <b>partially hydrogenated oil</b>. It is used to increase the shelf life of products, but it converts the cis bonds to trans bonds.</p>
<p><b>Omega-3 fatty acids</b> are unsaturated fatty acids in which the double bonding starts on the third carbon from the end of the chain. They are great for brain and nervous system power. Several are essential, meaning we must obtain them in our diet because we do not produce them ourselves. Fish and nuts are great sources.</p>
<p>From the lecture's check: a fatty acid full of single bonds is a saturated fatty acid, a man-made unsaturated FA is a trans fat, and partially hydrogenated oil is another name for a trans fat.</p>`,
nl:"Lecture wording",note:`The trans fat paragraph says trans fats end up with an even higher melting point than saturated fats. The rest of the lecture describes trans fats only as likely to stay solid.`,
so:"Saturated: single bonds, solid, animal. Cis: double bonds, liquid, plant. Trans: man-made, stays solid. Omega-3: double bonds start at the third carbon from the end."},
{drill:"m5d1"},

{id:"m5-complex",h:"Phospholipids and glycolipids",
img:{src:"lectures/biochem-exam2/img/m5/file-62a11ed5728bd.webp",alt:"Block diagrams and structures of a glycerophospholipid (alcohol, phosphate, glycerol and two fatty acids) and two sphingolipids: sphingomyelin (alcohol, phosphate, sphingosine and one fatty acid) and a glycosphingolipid (sugar, sphingosine and one fatty acid)",credit:"Lecture figure, Lesson 1."},
b:`<p><b>Complex lipids</b> are lipids that have the typical alcohol and one or two fatty acids, plus another group. They often have a nitrogen-containing base as well, but it is the other group that makes them complex. The lecture focuses on two groups because of their importance in cell membranes.</p>
<table><tr><th>Lipid</th><th>Other group and alcohol</th><th>Where</th></tr>
<tr><td>Glycero&shy;phospholipid</td><td>Phosphate. Glycerol, with two fatty acids.</td><td>The primary component of cell membranes</td></tr>
<tr><td>Sphingo&shy;phospholipid</td><td>Phosphate. Sphingosine, with one fatty acid.</td><td>Cell membranes, in lipid rafts</td></tr>
<tr><td>Glycolipid</td><td>Sugar. Sphingosine, with one fatty acid.</td><td>The glycocalyx on the outer membrane</td></tr></table>
<p><b>Phospholipids.</b> The other group is a phosphate. The alcohol is typically glycerol, so what we call phospholipids are technically glycerophospholipids. They have a hydrophilic head and two hydrophobic fatty acid tails, and they are the primary component of cell membranes. Other phospholipids are important surfactants, and one plays an active role in apoptosis.</p>
<p>Replacing the glycerol with a sphingosine gives a <b>sphingophospholipid</b>. It has one fatty acid, and the long end of the sphingosine makes the other hydrophobic tail. These are also major components of cell membranes, making up lipid rafts for compartmentalization, cell signaling and transport. A common one is sphingomyelin, a component of the myelin sheath wrapping around neurons.</p>
<p><b>Glycolipids.</b> If the other group is a sugar instead of a phosphate, the lipid is a glycolipid. Its alcohol is also a sphingosine, so it has one fatty acid, and glycolipids can also be called sphingoglycolipids. They attach to carbohydrates on the outer parts of the membrane as part of the <b>glycocalyx</b>. The glycocalyx is for adhesion to other cells and surfaces, and it is a protective barrier, like a glue trap for pathogens trying to enter. Galactosylceramide, a common glycolipid in animal tissues, plays an important role in the myelin of nervous tissue.</p>`,
nl:"Lecture wording",note:`The glycolipid section calls glycolipids "another important membrane protein." They are membrane lipids, one of the three common forms along with phospholipids and cholesterol.`,
so:"A phosphate makes a phospholipid and a sugar makes a glycolipid. Glycerol carries two fatty acids, sphingosine carries one."},

{id:"m5-steroid",h:"Steroids and cholesterol",
img:{src:"lectures/biochem-exam2/img/m5/file-62a1288aec673.webp",alt:"Cholesterol in the cell membrane: its polar hydroxyl group sits with the phosphate heads, and its rigid carbon rings and nonpolar tail sit among the hydrophobic tails of the phospholipids",credit:"Lecture figure, Lesson 1."},
b:`<p>All steroids have four rings. Three of them have six carbons and one has five carbons. You don't need the structural detail from organic chemistry.</p>
<p>The most commonly known steroid is <b>cholesterol</b>. Cholesterol is important, and like the other lipids in this lesson it plays a major role in cell membranes. It helps maintain the fluid state of the membrane by acting as a stopgap for the lipids:</p>
<ul><li>As temperature drops, the lipids cannot get consolidated enough to completely solidify, because they cannot condense past the cholesterols.</li>
<li>As temperature increases, the membrane does not melt away, because the lipids cannot separate more than the distance of the cholesterols.</li></ul>
<p>Cholesterol is widely distributed in all cells, but it is found most in nervous tissue.</p>
<p>Other important steroids:</p>
<ul><li><b>Sex hormones:</b> estrogens, androgens and progesterones. They facilitate puberty and standard development, menstrual cycles and pregnancy.</li>
<li><b>Cortisol:</b> important for inflammation, metabolism and stress response.</li>
<li><b>Bile acids:</b> synthesized in the liver. They are digestive surfactants that help digest lipids.</li></ul>
<p>From the lecture's check: the common forms of membrane lipids are phospholipids, glycolipids and cholesterol. Triglycerides are not one of them.</p>`,
so:"Four rings, three of six carbons and one of five. Cholesterol keeps the membrane from solidifying in the cold or melting in the heat."}
],
"5.2":[
// ---------------- L2 Fatty Acids Part 1 ----------------
{id:"m5-lipolysis",h:"Release from storage",
img:{src:"lectures/biochem-exam2/img/m5/file-62a24f344853e.webp",alt:"In the fat cell, triacylglycerol splits into glycerol and fatty acids. Glycerol goes to the liver cell, where glycolysis makes pyruvate or gluconeogenesis makes glucose. Fatty acids go to other tissues, where fatty acid oxidation makes acetyl CoA for the citric acid cycle.",credit:"Lecture figure, Lesson 2."},
b:`<p>Fatty acids are stored as triglycerides in adipose tissue. When a muscle needs energy, during exercise for example, the fatty acids have to get from the adipose tissue to the muscle. Fatty acid degradation is a three step process:</p>
<ol><li>Release of free fatty acids from the triglycerides, so they can be sent out into the bloodstream.</li>
<li>Activation of the fatty acids, so they can enter the mitochondria.</li>
<li>Breakdown of the fatty acids (beta oxidation).</li></ol>
<p><b>Lipolysis</b> is the breakdown of triglycerides into their separate components, glycerol and free fatty acids. It is catalyzed by <b>lipases</b>, which are triggered by a variety of hormonal signals that let the enzymes know energy is needed somewhere. Both the glycerol and the fatty acids are released into the bloodstream.</p>
<p>Fatty acids are not water soluble. In the bloodstream, traveling to their target tissue, they are bound to <b>albumin</b>. Once in the target tissue, they are bound to a fatty acid binding protein.</p>
<p>The glycerol is taken up by the liver and phosphorylated. It is converted into either pyruvate or glucose, through the glycolytic or gluconeogenic pathway.</p>
<p>From the lecture's check: "triglycerides enter the liver before being processed for energy breakdown" is false, and "fatty acid degradation is a three step process" is true.</p>`,
so:"Lipases split triglyceride into glycerol and fatty acids. The fatty acids ride on albumin, and the glycerol goes to the liver."},

{id:"m5-carnitine",h:"Activation and the carnitine shuttle",
img:{src:"lectures/biochem-exam2/img/m5/file-62a252459398c.webp",alt:"The carnitine shuttle. On the intermembrane space side, carnitine acyltransferase I swaps the CoA on acyl CoA for carnitine, making acyl carnitine. A translocase in the inner membrane carries acyl carnitine to the matrix side, where carnitine acyltransferase II puts CoA back on, and the carnitine returns.",credit:"Lecture figure, Lesson 2."},
b:`<p><b>Activation.</b> The fatty acid is converted into an active intermediate by binding with coenzyme A to form <b>acyl CoA</b>, not to be confused with acetyl CoA, which forms in the next stage. This requires energy from ATP and the enzyme <b>CoA synthetase</b>. The reaction takes place on the outer membrane of the mitochondria.</p>
<p>One more step is needed to pass through the inner mitochondrial membrane, the carnitine shuttle:</p>
<ol><li><b>Carnitine acyltransferase I</b> combines the fatty acid with the alcohol carnitine to form acyl carnitine, releasing the CoA.</li>
<li>A <b>translocase</b> shuttles acyl carnitine across the inner mitochondrial membrane.</li>
<li>Inside the mitochondrial matrix, <b>carnitine acyltransferase II</b> reverses the first reaction, replacing the carnitine with the CoA. The translocase returns the carnitine to the cytoplasmic side.</li></ol>
<p>Carnitine acyltransferase I is the key regulatory step for fatty acid degradation. Various hormones and products of other metabolic pathways inhibit it, blocking the flow of fatty acids into the mitochondria and halting fatty acid degradation.</p>
<p>In diseases where fatty acids can't enter the mitochondria, often called carnitine deficiencies, the result can be muscle cramping, weakness and even death.</p>
<p>From the lecture's check: fatty acids are linked to coenzyme A before entering the mitochondria, and fatty acid degradation requires the input of ATP energy. Both are true.</p>`,
nl:"Lecture wording",note:`The activation paragraph says the fatty acid is shuttled into the intermembrane space "through voltage dependent ion channels." The lecture's own check marks "fatty acids enter the mitochondrial matrix through voltage dependent ion channels" false. The way into the matrix is the carnitine shuttle.`,
so:"CoA synthetase makes acyl CoA. Carnitine carries it across the inner membrane, and carnitine acyltransferase I is the control point."},

{id:"m5-betaox",h:"Beta oxidation",
b:`<p>Beta oxidation is the breakdown stage and the bulk of fatty acid degradation. It is a series of oxidation reactions (dehydrogenations), called beta because they happen on the beta carbon.</p>
<p>It is a series of four reactions. The number of times the four reactions repeat depends on how long the fatty acid chain is. Each round cuts 2 carbons from the fatty acid in the form of acetyl CoA.</p>
<ol><li><b>Oxidation</b> by <b>acyl-CoA dehydrogenase</b>. Two hydrogen atoms are removed from the fatty acid, and a new double bond forms in their place. FAD is reduced to FADH₂.</li>
<li><b>Hydration</b> by <b>enoyl-CoA hydratase</b>. Water is added to saturate the double bond, which adds a hydroxyl group.</li>
<li><b>Oxidation</b> by <b>hydroxyacyl-CoA dehydrogenase</b>. The new hydroxyl group is dehydrogenated, making a carbonyl group. NAD⁺ is reduced to NADH.</li>
<li><b>Thiolysis</b> by <b>thiolase</b>. The end of the chain now looks a lot like an acetyl CoA, so it is cut off to release an acetyl CoA. The shortened fatty acid is ready for another round.</li></ol>
<p>One round of beta oxidation gives one FADH₂, one NADH, and one acetyl CoA that can go into the citric acid cycle.</p>
<p><b>Palmitate</b>, a 16 carbon fatty acid, takes 7 rounds of oxidation: 7 FADH₂, 7 NADH and 8 acetyl CoA. There is one more acetyl CoA than rounds because the last split turns a four carbon molecule into two acetyl CoA. After two ATP are used to activate the palmitate, 108 ATP are generated, for a net of 106 ATP. This is why fats are so much more efficient at providing energy than carbohydrates.</p>`,
nl:"Lecture wording",note:`The lecture writes FAD+ and FADH for FAD and FADH₂. Its thiolysis step also says a new acyl-CoA is added to the end of the fatty acid. What remains after the acetyl CoA is cut off is an acyl CoA two carbons shorter, ready for the next round.`,
so:"Oxidation, hydration, oxidation, thiolysis. Each round gives one FADH₂, one NADH and one acetyl CoA."},

{id:"m5-odd",h:"Fatty acids that need extra handling",
b:`<p>Not all fatty acids are created equal. Three kinds need a variation on the standard pathway.</p>
<table><tr><th>Fatty acid</th><th>What is different</th></tr>
<tr><td>Very long chain, more than 20 or 22 carbons</td><td>Broken down in peroxisomes, not for energy as in the mitochondria. The end product is octanoyl-CoA, not acetyl CoA.</td></tr>
<tr><td>Unsaturated</td><td>Additional steps are required. Isomerases and reductases rearrange them into isomers that are known intermediates of the pathway.</td></tr>
<tr><td>Odd chain</td><td>Oxidized in much the same way, except that propionyl CoA, a three carbon molecule, forms at the end of the final round. Propionyl CoA is converted into succinyl CoA, which enters the citric acid cycle.</td></tr></table>`,
so:"Very long chains go to peroxisomes and end as octanoyl-CoA. Unsaturated ones need isomerases and reductases. Odd chains end as propionyl CoA, then succinyl CoA."},

{id:"m5-ketone",h:"Ketone bodies",
img:{src:"lectures/biochem-exam2/img/m5/image-6308f6b7410ba.webp",alt:"Liver, blood and extrahepatic tissues. In the liver, acyl CoA becomes acetyl CoA, which enters the citric acid cycle or makes ketone bodies. Ketone bodies travel in the blood. Acetone leaves through the lungs and urine, and the others go to extrahepatic tissues, where they become acetyl CoA for the citric acid cycle.",credit:"Lecture figure, Lesson 2."},
b:`<p>Most of the acetyl CoA made from fatty acids enters the citric acid cycle. When there is an abundance of fatty acid oxidation, the liver produces <b>ketone bodies</b>, an alternative fuel source, in a process called <b>ketogenesis</b>. This is the connection to the keto diet, a diet high in fat.</p>
<p>Ketone bodies are produced in the mitochondria of the liver. Ketogenesis happens because acetyl CoA builds up during beta oxidation. Acetyl CoA enters the citric acid cycle, but the oxaloacetate it binds to is saturated and no more is being produced, so the acetyl CoA goes on to make ketone bodies instead of waiting in line.</p>
<p>The three major ketone bodies are acetoacetate, beta-hydroxybutyrate and acetone.</p>
<ul><li><b>Acetone</b> cannot be used to produce energy. It is released through the lungs and the bladder, in breath and urine.</li>
<li>The other two are sent to tissues that need energy, and they enter the citric acid cycle in extrahepatic tissues.</li></ul>
<p>Higher than normal amounts of ketone bodies in the blood is <b>ketonemia</b>, and in the urine <b>ketonuria</b>. The overall issue is called <b>ketosis</b>. It is most common during starvation, when there is a long-term depletion of available carbohydrates. It is also seen in long-term keto diets, and in individuals with diabetes mellitus due to their deficient glucose metabolism.</p>
<p>Ketosis can lead to <b>ketoacidosis</b>, which can dangerously decrease the pH of the blood.</p>
<p>From the lecture's check: of the scenarios given, the person stranded for 21 days without food is the one expected to have excessive ketone bodies in the urine.</p>`,
so:"Too much acetyl CoA for the oxaloacetate available, so the liver makes ketone bodies. Too many is ketosis, which can lower blood pH."},

// ---------------- L3 Fatty Acids Part 2: biosynthesis ----------------
{id:"m5-shuttle",h:"Getting acetyl CoA to the cytosol",
img:{src:"lectures/biochem-exam2/img/m5/file-62a8b7314a4fb.webp",alt:"The citrate-malate shuttle. In the mitochondrion, acetyl CoA joins oxaloacetate to make citrate, which crosses into the cytoplasm. ATP citrate lyase uses an ATP to split citrate into acetyl CoA and oxaloacetate. Oxaloacetate takes NADH to become malate, malate becomes pyruvate and releases NADPH, and pyruvate crosses back into the mitochondrion and becomes oxaloacetate.",credit:"Lecture figure, Lesson 3."},
b:`<p>Fatty acid biosynthesis, also called <b>lipogenesis</b> when new fatty acids are generated from non-lipid materials, is essentially fatty acid degradation in reverse. Acetyl CoA is the precursor for virtually all fatty acids. Synthesis converts it back into palmitate, the 16-carbon fatty acid from the previous lesson, which then goes on to form a variety of other fatty acids.</p>
<p>Fatty acid degradation takes place in the mitochondria. Fatty acid synthesis takes place in the cytosol. The starting material, acetyl CoA, is in the mitochondria, so the pre-step is to get it out of the mitochondria and into the cytosol. The lecture does not count this preparation as an actual step of synthesis.</p>
<p>This happens through the first step of the citric acid cycle, in a process called the <b>citrate-malate shuttle</b>.</p>
<ol><li>In the mitochondria, acetyl CoA and oxaloacetate form citrate. The citrate moves into the cytosol instead of proceeding to the next step of the citric acid cycle. This is how citrate inhibits citrate synthase through feedback inhibition, from Module 3.</li>
<li>In the cytosol, <b>ATP-citrate lyase</b> cleaves citrate, at the expense of an ATP, reversing the reaction that generated it. This gives oxaloacetate and acetyl CoA in the cytosol.</li>
<li>Oxaloacetate cannot penetrate the mitochondrial membrane any more than acetyl CoA could. To get back into the mitochondria it is converted to malate. Back inside the matrix, malate converts back into oxaloacetate, recreating the final step of the citric acid cycle.</li></ol>
<p>This process generates an NADPH, and its energy is used later to help synthesize the fatty acid.</p>
<p>The preparation phase is stimulated by <b>insulin</b>, which is typically released in times of high blood glucose.</p>`,
nl:"Lecture figure",note:`The figure shows malate becoming pyruvate, which is where it marks the NADPH, and pyruvate crossing back into the mitochondrion to become oxaloacetate. The text has malate itself crossing back. Either way, oxaloacetate cannot cross the membrane on its own, and the return trip generates NADPH.`,
so:"Acetyl CoA leaves the mitochondria as citrate. ATP-citrate lyase splits it in the cytosol for one ATP, and the shuttle generates NADPH."},

{id:"m5-acc",h:"Making malonyl CoA",
img:{src:"lectures/biochem-exam2/img/m5/file-62a8cb79def23.webp",alt:"Acetyl CoA plus ATP plus bicarbonate goes to malonyl CoA plus ADP, phosphate and a hydrogen ion, catalyzed by acetyl-CoA carboxylase 1",credit:"Lecture figure, Lesson 3."},
b:`<p>With acetyl CoA in the cytosol, the first official step of fatty acid synthesis is the <b>carboxylation</b> of acetyl CoA by the biotin-dependent enzyme <b>acetyl-CoA carboxylase 1</b>. This turns acetyl CoA into its activated form, <b>malonyl CoA</b>. The conversion requires carbon dioxide in the form of bicarbonate (HCO₃⁻) and energy from ATP.</p>
<p>The reaction is a two step process:</p>
<ol><li><b>Carboxylation of biotin.</b> Biotin, attached inside the enzyme, holds the carboxyl group from the bicarbonate. It acts as the transfer intermediate for the carboxyl group.</li>
<li><b>Malonyl CoA formation.</b> The carboxyl group is transferred to acetyl CoA, forming malonyl CoA.</li></ol>
<p>Malonyl CoA is a 3 carbon molecule. In the next stage, two of its three carbons are added onto acetyl CoA, over and over, until there is a 16 carbon fatty acid.</p>
<p>The activation of acetyl CoA is the primary regulatory step in lipogenesis. The preparation phase can be regulated through insulin and citrate availability, but this step is irreversible, so it commits the acetyl CoA to fatty acid biosynthesis.</p>`,
so:"Acetyl-CoA carboxylase 1 uses biotin, bicarbonate and ATP to make malonyl CoA. The step is irreversible and is the main control point."},

{id:"m5-fareg",h:"Regulation by diet",
b:`<p>Fatty acid synthesis is controlled in a few ways that all lead back to diet. Activation is the key to synthesis, so regulation happens through control of acetyl-CoA carboxylase 1. If malonyl CoA cannot be made, fatty acids cannot be made.</p>
<p>The absence of citrate or acetyl CoA in the cytosol would stop it, since there would be nothing to convert. More importantly, a variety of hormones regulate lipogenesis, including glucagon, epinephrine and especially insulin.</p>
<p>The change is adaptive control, meaning it happens at the gene transcription level. Insulin, and with it very high carbohydrate diets, triggers the body to make more carboxylase enzymes, not just turn on the current ones. This significantly increases the rate of lipogenesis, and it can happen within a matter of days of a diet change.</p>
<p>The main regulatory factor for the rate of lipogenesis is the nutritional state:</p>
<table><tr><th>State</th><th>Fatty acid synthesis</th></tr>
<tr><td>Fed, with a diet high in carbohydrates</td><td>High</td></tr>
<tr><td>Fasted: restricted calorie intake, high-fat diets, or a deficiency of insulin as in diabetes mellitus</td><td>Depressed</td></tr></table>
<p>Lesson 2 described regulating fatty acid degradation by blocking the transfer of fatty acids into the mitochondria. The most common way that transferase, carnitine acyltransferase I, is inhibited is by the product of a reaction catalyzed by <b>acetyl-CoA carboxylase 2</b>.</p>
<p><b>Ethanol</b> increases the rate of fatty acid synthesis. Ethanol breakdown in the liver releases NADH. The NADH inhibits fatty acid oxidation and triggers fatty acid synthesis, which causes fatty liver disease. The same NADH inhibits gluconeogenesis and causes lactate to accumulate, which can lead to hypoglycemia and lactic acidosis.</p>`,
so:"Fed on carbohydrates, synthesis is high. Fasting, high-fat diets and insulin deficiency depress it. Insulin works by making more acetyl-CoA carboxylase."},

{id:"m5-elong",h:"Elongation and fatty acid synthase",
b:`<p><b>Elongation</b> is where carbons are added to the fatty acid. It starts with a two carbon acetyl CoA and adds two carbons at a time, from malonyl CoA, until it reaches the 16 carbon palmitate.</p>
<p>Each round is a series of four reactions, the exact reverse of the four in beta oxidation:</p>
<ol><li>Condensation</li><li>Reduction</li><li>Dehydration</li><li>Reduction</li></ol>
<p>Each cycle adds two carbons to the carboxyl end of the molecule, instead of removing two as in beta oxidation. This happens at the expense of two NADPH.</p>
<p><b>Fatty acid synthase.</b> All the steps are controlled by one multifunctional enzyme complex, fatty acid synthase. Its individual enzymes are covalently joined together. This allows compartmentalization of the process within the cell without the need for permeability barriers, and the synthesis of all the enzymes in the complex is easily coordinated because it is encoded by a single gene. The complex resides on the cytoplasmic side of the smooth endoplasmic reticulum, so synthesis still takes place in the cytoplasm, but technically on the SER as well.</p>
<p>The synthesis of one palmitate requires:</p>
<ul><li>8 acetyl CoA: 1 starting acetyl CoA and 7 converted to malonyl CoA</li>
<li>7 rounds of elongation, since the starting acetyl CoA has 2 carbons and 14 more are needed</li>
<li>7 ATP, one each time acetyl CoA is activated to malonyl CoA. This does not include the ATP used to move acetyl CoA out of the mitochondria, which is a pre-step.</li>
<li>14 NADPH, two per round of elongation. Some is generated when malate returns to the mitochondria, and the rest comes from the pentose phosphate pathway.</li></ul>
<p><b>Modification.</b> Fatty acid synthesis always results in a free palmitate. Fatty acids with more or fewer carbons, or unsaturated ones, come from modifications later on as needed. Further elongation can be stimulated, as can partial degradation of the chain, and additional enzymes can introduce double bonds.</p>
<p>Mammals lack the enzymes to introduce double bonds at carbon atoms beyond C-9 of the fatty acid chain. Mammals require several such fatty acids, including linoleate and linolenate, which is why they are among the essential fatty acids.</p>`,
nl:"Lecture wording",note:`The modification paragraph gives prostaglandins as an example of an enzyme that introduces double bonds. Lesson 1 describes prostaglandins as a type of fat that acts as a hormone.`,
so:"Condensation, reduction, dehydration, reduction, all on fatty acid synthase. One palmitate takes 8 acetyl CoA, 7 ATP and 14 NADPH."},

{id:"m5-vs",h:"Degradation and synthesis side by side",
b:`<p>Synthesis is essentially degradation in reverse, so each part of one pathway has a counterpart in the other.</p>
<table><tr><th></th><th>Degradation</th><th>Synthesis</th></tr>
<tr><td>Where</td><td>Mitochondria</td><td>Cytosol, on fatty acid synthase at the smooth ER</td></tr>
<tr><td>Crossing the membrane</td><td>The fatty acid goes in as acyl carnitine</td><td>Acetyl CoA comes out as citrate</td></tr>
<tr><td>Activation</td><td>Fatty acid to acyl CoA, by CoA synthetase</td><td>Acetyl CoA to malonyl CoA, by acetyl-CoA carboxylase 1</td></tr>
<tr><td>Four reactions</td><td>Oxidation, hydration, oxidation, thiolysis</td><td>Condensation, reduction, dehydration, reduction</td></tr>
<tr><td>Two carbons per round</td><td>Removed as acetyl CoA</td><td>Added from malonyl CoA</td></tr>
<tr><td>Electron carriers</td><td>FAD and NAD⁺ are reduced</td><td>Two NADPH are used</td></tr>
<tr><td>Key regulatory step</td><td>Carnitine acyl&shy;transferase I</td><td>Acetyl-CoA carboxylase 1</td></tr></table>`,
so:"Degradation runs in the mitochondria on FAD and NAD⁺ and is controlled at carnitine acyltransferase I. Synthesis runs in the cytosol on NADPH and is controlled at acetyl-CoA carboxylase 1."}
],
"5.3":[
// ---------------- L4 Storage and Membrane Lipids ----------------
{id:"m5-pa",h:"Phosphatidate",
img:{src:"lectures/biochem-exam2/img/m5/file-62af86d734e36.webp",alt:"Glucose goes to DHAP and then glycerol 3-phosphate. In adipose tissue or diet, triacylglycerol breaks down into glycerol and free fatty acids. Glycerol 3-phosphate and fatty acids form phosphatidate in the endoplasmic reticulum, which becomes triacylglycerol in the liver or phospholipid with an activated alcohol.",credit:"Lecture figure, Lesson 4."},
b:`<p>Storage lipids (triglycerides) and membrane lipids (phospholipids and sphingolipids) have something in common: they are fatty acids combined to an alcohol. This means the processes to create them are almost the same.</p>
<p>Triglycerides and phospholipids start out exactly the same, because both involve the addition of the alcohol glycerol. Fatty acids and glycerol are joined to form <b>phosphatidate</b>. The parts come from pathways already covered: fatty acids from fatty acid synthesis, and glycerol from releasing fatty acids from a triglyceride. Phosphatidate is a diglyceride, meaning two fatty acids added to a glycerol molecule.</p>
<p><b>Step 1: Activation.</b> Both the fatty acid and the glycerol need to be activated to be ready to react.</p>
<ul><li>For a fatty acid, the active form is acyl CoA, as in fatty acid oxidation. It is made with the help of the enzyme <b>acyl-CoA synthetase</b>.</li>
<li>Glycerol is activated into glycerol-3-phosphate (G3P) by the enzyme <b>glycerol kinase</b>, present in the liver, kidneys, intestine, brown adipose tissue and lactating mammary glands.</li></ul>
<p>Tissues without glycerol kinase, like the muscles, get G3P another way, by converting dihydroxyacetone phosphate (DHAP) into G3P.</p>
<p><b>Step 2: Acyl transfer, twice.</b> G3P is processed into phosphatidate in two steps catalyzed by acyl transferase. The other name for phosphatidate is <b>diacylglycerol-3-phosphate</b>, because it is a 2 acyl glycerol molecule. A triglyceride is also known as a triacylglyceride.</p>
<p>From this step, the paths for a triglyceride and a phospholipid diverge. The biosynthesis of triglycerides and of phospholipids both take place on the cytosol side of the smooth endoplasmic reticulum.</p>`,
so:"Acyl CoA and glycerol-3-phosphate, joined by two acyl transfers, give phosphatidate. Both lipids are made on the cytosol side of the smooth ER."},

{id:"m5-tag",h:"Finishing a triglyceride",
img:{src:"lectures/biochem-exam2/img/m5/file-62af8b4ebf07c.webp",alt:"Phosphatidate loses its phosphate to become diacylglycerol, then gains a third fatty acid from acyl CoA to become triacylglycerol. The triacylglycerol synthetase complex catalyzes both steps.",credit:"Lecture figure, Lesson 4."},
b:`<p>The <b>triacylglycerol synthetase complex</b> completes a triglyceride from phosphatidate in a two step process:</p>
<ol><li>It removes the phosphate from phosphatidate (diacylglycerol-3-phosphate), giving diacylglycerol.</li>
<li>It adds another fatty acid. This would be a third acyl transferase step.</li></ol>
<p>Triglyceride formation happens primarily in the liver. The triglycerides are then transported to muscles for fuel or to adipose tissue for storage. 85% of our energy is stored as triglycerides in adipose tissue.</p>`,
so:"Take the phosphate off phosphatidate and add a third fatty acid. Made mostly in the liver, stored in adipose tissue."},

{id:"m5-pl",h:"Finishing a phospholipid",
img:{src:"lectures/biochem-exam2/img/m5/file-62af94e9c48ed.webp",alt:"Phosphatidic acid phosphatase removes a phosphate from phosphatidate to make diacylglycerol, and diacylglycerol kinase reverses it. Phosphatidate goes on to phosphatidylinositol and cardiolipin. Diacylglycerol goes on to phosphatidylethanolamine, phosphatidylcholine, phosphatidylserine and triacylglycerol. Both act as second messengers.",credit:"Lecture figure, Lesson 4."},
b:`<p>There are a variety of phospholipids. They vary based on the alcohol attached to the phosphate group, and each type needs its own enzymes and reactions. The lecture wants the overall general process, not the variations for each type.</p>
<p>Either the phosphatidate or the alcohol must be activated during phospholipid formation.</p>
<ul><li><b>Phosphatidate activated:</b> cardiolipin and phosphatidylinositol. Phosphatidate is directly activated.</li>
<li><b>Alcohol activated:</b> phosphatidylcholine and phosphatidylethanolamine. Phosphatidate is first converted to diacylglycerol by removing a phosphate, just as for a triglyceride, then combined with the activated alcohol.</li></ul>
<p><b>Cardiolipin</b> is produced solely in the mitochondria, for mitochondrial membranes. It helps organize the enzymes in the electron transport chain.</p>
<p><b>Phosphatidylcholine</b> is the most common phospholipid, comprising up to 55% of our membranes. Creating it takes the enzyme choline kinase and two transferase steps. In parallel, phosphatidate is converted to diacylglycerol before it combines with the phosphocholine, so there is only a one step difference between forming phosphatidylcholine and forming triacylglycerol.</p>
<p>The reaction requires ATP. It is an anabolic reaction, so it needs energy input to build the molecule.</p>
<p>Phosphatidylcholine is important enough that the body has a second way to make it: phosphatidylethanolamine can be converted directly into phosphatidylcholine when needed.</p>
<p><b>Regulation.</b> In general, the formation of triglycerides and phospholipids is controlled by the availability of free fatty acids. Without free fatty acids, no lipids can be generated.</p>
<p>Which lipids are generated is controlled at the split between phosphatidate and diacylglycerol, by the enzyme <b>phosphatidic acid phosphatase (PAP)</b>, the key regulatory enzyme.</p>
<ul><li>When PAP is active, it generates diacylglycerol, which can react with activated alcohols to form phospholipids or with fatty acyl CoA to form triacylglycerols.</li>
<li>When PAP is inactive, phosphatidate is used for the synthesis of different phospholipids.</li></ul>
<p>PAP also controls the amount of diacylglycerol (DAG) and phosphatidate, which both function as second messengers.</p>`,
nl:"Lecture wording",note:`The lecture refers to phospholipids as "AKA phosphoglycolipids." Lesson 1 calls the lipids with a phosphate and glycerol glycerophospholipids, and keeps the name glycolipid for lipids with a sugar.`,
so:"Activate the phosphatidate (cardiolipin, phosphatidylinositol) or the alcohol (phosphatidylcholine). PAP decides between phosphatidate and diacylglycerol."},

{id:"m5-sphingo",h:"Sphingolipids",
b:`<p>A sphingolipid starts with a sphingosine instead of a glycerol, which is why sphingolipids are not created the same way as triglycerides or phospholipids.</p>
<p>Sphingolipids are found in all membranes, but they are most abundant in nervous tissues. They are formed from <b>ceramide</b>, which is made from palmitoyl CoA (an activated fatty acid) and serine. Sphingolipids are synthesized in the endoplasmic reticulum.</p>
<p>Just as phospholipids vary, ceramide is modified as needed to form a variety of sphingolipids:</p>
<ul><li>Combined with phosphorylcholine, it makes <b>sphingomyelin</b>.</li>
<li>With sugar added, it makes <b>glycosphingolipids</b>.</li></ul>`,
so:"Palmitoyl CoA and serine make ceramide in the ER. Phosphorylcholine turns it into sphingomyelin, and sugar into glycosphingolipids."},
// ---------------- L5 Cholesterol Synthesis ----------------
{id:"m5-chol",h:"Cholesterol synthesis",
img:{src:"lectures/biochem-exam2/img/m5/file-62b0f5482572d.webp",alt:"3-Hydroxy-3-methylglutaryl CoA is reduced to mevalonate by HMG CoA reductase, using 2 NADPH and 2 H⁺ and releasing 2 NADP⁺ and CoA",credit:"Lecture figure, Lesson 5."},
b:`<p>Cholesterol is vital for the stability of our membranes, for the formation of vitamin D and steroids, and for fat digestion through bile salts. We can obtain it from the diet or synthesize it. The primary site of synthesis is the liver, where it is used to create bile salts for fat digestion, although it can also be made in the intestines.</p>
<p>Cholesterol is made from 27 carbons, all derived from acetyl CoA. The pathway is long, so the lecture asks only for the major steps.</p>
<ol><li><b>Biosynthesis of mevalonate.</b> A three step process. Two acetyl CoA combine to form acetoacetyl CoA, which combines with another acetyl CoA to form HMG-CoA (3-hydroxy-3-methylglutaryl CoA). HMG-CoA is then reduced to mevalonate by the enzyme <b>HMG-CoA reductase</b>.</li>
<li><b>Formation of isopentenyl diphosphate</b> (the isoprenoid units). In three sequential phosphorylation steps, mevalonate is converted to isopentenyl diphosphate, also known as isopentenyl pyrophosphate, which contains five carbons and two phosphate groups. This costs three ATP, one per phosphorylation, and requires three kinases. A final decarboxylation releases carbon dioxide and a phosphate group.</li>
<li><b>Formation of squalene.</b> Next we move from the cytoplasm to the lumen of the endoplasmic reticulum. Six isopentenyl diphosphates come together through a series of condensation reactions to form squalene, a 30 carbon molecule: C5 to C10 to C15 to C30. One isopentenyl diphosphate isomerizes into dimethylallyl pyrophosphate so the two isomers can bind, which begins the condensation. The final step is a reduction by NADPH.</li>
<li><b>Formation of lanosterol.</b> Still in the lumen of the ER, squalene begins to fold. It forms lanosterol, a structure close to a steroid nucleus, via a mixed function oxidase, <b>squalene epoxidase</b>. This requires oxygen and NADPH.</li>
<li><b>Formation of cholesterol.</b> On the membrane of the ER, bonds and elements within lanosterol are moved around to remove three carbons and close the rings, forming cholesterol.</li></ol>
<p>Steps 4 and 5 are the cyclization. From the lecture's check: the first two steps, acetyl CoA to isopentenyl diphosphate, happen in the cytosol.</p>
<p>The reduction of HMG-CoA to mevalonate, the last part of step 1, is the commitment step for cholesterol synthesis. It is irreversible and commits acetyl CoA to forming cholesterol. It is also the rate-limiting step, so it is the point used to control the rate of cholesterol synthesis.</p>
<p>Cholesterol is vital to our survival. Mice without HMG-CoA reductase, and therefore without the ability to synthesize cholesterol, die.</p>`,
so:"Mevalonate and isopentenyl diphosphate in the cytosol, squalene and lanosterol in the ER lumen, cholesterol on the ER membrane. HMG-CoA reductase is the committed, rate-limiting step."},
{drill:"m5d2"},

{id:"m5-cholreg",h:"Regulation of cholesterol synthesis",
b:`<p>The rate of cholesterol synthesis responds to feedback at the cellular level through control of the HMG-CoA reductase enzyme, the rate-limiting step.</p>
<p>The most common control mechanism is at the molecular level, through a <b>sterol regulatory element-binding protein (SREBP)</b> that controls the transcription of the enzyme.</p>
<p>Hormones push HMG-CoA reductase activity up or down:</p>
<ul><li><b>Increase</b> HMG-CoA reductase activity, and therefore cholesterol production: insulin and thyroid hormone.</li>
<li><b>Decrease</b> HMG-CoA reductase activity: glucagon and glucocorticoids.</li></ul>`,
nl:"Lecture wording",note:`The lecture says SREBP is inhibited by insulin and increased by glucagon and glucocorticoids, which runs opposite to the hormone effects on HMG-CoA reductase listed below.`,
so:"HMG-CoA reductase is controlled at transcription through SREBP. Insulin and thyroid hormone raise cholesterol production. Glucagon and glucocorticoids lower it."},

{id:"m5-lipoprot",h:"Lipoproteins",
img:{src:"lectures/biochem-exam2/img/m5/image-62b1dc302a5e4.webp",alt:"Dietary fat and cholesterol leave the intestine as chylomicrons, which release free fatty acids to adipose tissue and peripheral tissues and leave chylomicron remnants for the liver. The liver sends out VLDL, which becomes IDL and then LDL for peripheral tissues with LDL receptors. HDL carries cholesterol from peripheral tissues back to the liver, and bile acids pass between the liver and the intestine.",credit:"Lecture figure, Lesson 5."},
b:`<p>Cholesterol is made in the liver but used throughout the body. It is a lipid, so it is insoluble in water. To carry it through the blood to the tissues in need, we need carrier molecules called <b>lipoproteins</b>.</p>
<p>Lipoproteins are packages of lipids and proteins combined together with hydrophobic and hydrophilic regions. They are designed a lot like micelles, with hydrophobic tails on the inside and hydrophilic heads on the outside.</p>
<p>Larger lipoproteins with more lipids and less protein are less dense, and smaller, more protein-rich lipoproteins are more dense. The proteins determine the function of the lipoprotein, because they act as markers or receptors.</p>
<table><tr><th>Lipoprotein</th><th>What it does</th></tr>
<tr><td>Chylo&shy;microns</td><td>The lowest density. Primarily transport dietary fats and are cleared from the blood rapidly as part of food digestion. Their digestion transports fatty acids to the adipose tissue, heart, muscle and liver.</td></tr>
<tr><td>VLDL (very low density)</td><td>Triglycerides and cholesterol in excess of the liver's own needs are exported into the blood as VLDL. Lipoprotein lipases on capillary surfaces hydrolyze its triglycerides, and the freed fatty acids are taken into the cells.</td></tr>
<tr><td>IDL (intermediate density)</td><td>The cholesterol-rich remnant left once the fatty acids are removed from VLDL. Taken up by the liver for processing or further processed into LDL.</td></tr>
