<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMSC 3401 Biochemistry — Exam 1</title>
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<style>
:root{--fg:#1c1c1c;--mut:#666;--line:#ddd;--soft:#f5f5f3;--acc:#1f4b8f;--accbg:#eef2f9;--ok:#1d7a3a;--okbg:#eef7f0;--bad:#b42318;--badbg:#fdf1f0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--fg);background:#fff}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.hin{max-width:780px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.brand{font-weight:600;font-size:15px;margin-right:auto}
.brand span{font-weight:400;color:var(--mut)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{font:inherit;font-size:15px;background:none;border:0;padding:7px 10px;border-radius:6px;color:var(--mut);cursor:pointer}
nav button.on{color:var(--fg);background:var(--soft);font-weight:600}
main{max-width:780px;margin:0 auto;padding:16px 16px 72px}
h1{font-size:22px;margin:6px 0 6px}
h2{font-size:18px;margin:28px 0 8px}
h3{font-size:16px;margin:22px 0 6px}
h4{font-size:15px;margin:18px 0 6px}
p{margin:8px 0}
.mut{color:var(--mut)}.sm{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.btn{font:inherit;font-size:15px;padding:9px 14px;border:1px solid #c8c8c8;border-radius:6px;background:#fff;color:var(--fg);cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{font-size:14px;padding:6px 10px}
.btn:disabled{opacity:.45;cursor:default}
.btn.link{border:0;padding:6px 4px;color:var(--mut);text-decoration:underline;text-underline-offset:2px}
@media (hover:hover){.btn:hover:not(:disabled){border-color:#888}.opt:hover:not(:disabled){border-color:#888}}
select{font:inherit;font-size:15px;padding:8px;border:1px solid #c8c8c8;border-radius:6px;background:#fff;max-width:100%;color:var(--fg)}
label.chk{display:flex;gap:6px;align-items:center;font-size:15px;cursor:pointer}
.seg{display:inline-flex;border:1px solid #c8c8c8;border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:14px;border:0;background:#fff;padding:7px 11px;cursor:pointer;color:var(--fg)}
.seg button+button{border-left:1px solid #c8c8c8}
.seg button.on{background:var(--acc);color:#fff}
.box{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0;background:var(--soft)}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;cursor:pointer;background:#fff}
@media (hover:hover){.card:hover{border-color:#999}}
.card b{display:block}
.qhead{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--mut)}
.bar{height:3px;background:#eee;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--acc)}
.stem{font-size:17px;margin:12px 0}
.tag{display:inline-block;font-size:12px;font-weight:500;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}
.fig{margin:10px 0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;padding:11px 14px;border:1px solid #c8c8c8;border-radius:6px;background:#fff;color:var(--fg);cursor:pointer}
.opt:disabled{cursor:default}
.opt.pick{border-color:var(--acc);background:var(--accbg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin:12px 0;padding:10px 14px;border-left:3px solid var(--line);background:var(--soft)}
.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.fb b.v{display:block;margin-bottom:2px}
.fb.ok b.v{color:var(--ok)}.fb.bad b.v{color:var(--bad)}
details.steps{margin-top:8px}
details.steps summary{cursor:pointer;color:var(--acc);font-size:15px}
details.steps ol{margin:6px 0 0;padding-left:22px}
details.steps li{margin:3px 0}
table{border-collapse:collapse;width:100%;margin:8px 0;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-weight:600;background:var(--soft)}
.tw{overflow-x:auto}
.conf{border-left:3px solid var(--acc);padding:4px 10px;background:var(--accbg)}
ul,ol{padding-left:22px}
li{margin:3px 0}
.lohd{font-size:14px;color:var(--mut);margin:-2px 0 8px}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.jump a{font-size:14px;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:4px 8px;text-decoration:none}
.sheet{scroll-margin-top:70px}
.qli{border-top:1px solid var(--line);padding:12px 0}
.qli .stem{font-size:16px;margin:4px 0 8px}
.qli .fig{max-width:460px}
.qlo{list-style:none;padding:0;margin:0 0 6px}
.qlo li{padding:4px 8px 4px 26px;position:relative;border-radius:4px;font-size:15px;margin:2px 0}
.qlo li.ok{background:var(--okbg);font-weight:600}
.qlo li.ok:before{content:"✓";position:absolute;left:8px;color:var(--ok)}
.qli .ex{font-size:15px;color:#333;margin:6px 0 0}
details.lo>summary{cursor:pointer;font-weight:600;padding:10px 0;border-top:1px solid var(--line);list-style-position:outside}
details.mod{margin:8px 0}
details.mod>summary{cursor:pointer;font-size:17px;font-weight:600;padding:8px 0}
.res td.n{text-align:right;white-space:nowrap}
.miss{border-top:1px solid var(--line);padding:12px 0}
.miss .stem{font-size:16px}
.ya{color:var(--bad)}.ca{color:var(--ok)}
#timer.late{color:var(--bad);font-weight:600}
/* drills */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;min-height:38px}
.chip{font:inherit;font-size:15px;padding:6px 11px;border:1px solid #c8c8c8;border-radius:16px;background:#fff;cursor:pointer;color:var(--fg)}
.chip.sel{border-color:var(--acc);background:var(--acc);color:#fff}
.chip.done{cursor:default;border-color:var(--ok);background:var(--okbg);font-size:14px;padding:3px 9px}
.chip.rev{border-color:var(--bad);background:var(--badbg)}
.bins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bin{border:1px dashed #bbb;border-radius:8px;padding:8px;min-height:64px;cursor:pointer;background:#fff}
.bin.arm{border-color:var(--acc);border-style:solid;background:var(--accbg)}
.bin h5{margin:0 0 6px;font-size:14px}
.bin .chips{margin:0;min-height:0;gap:4px}
.msg{min-height:24px;font-size:15px;margin:8px 0}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.case{border:1px solid var(--line);border-radius:8px;padding:14px;margin:12px 0}
.case .t{font-size:17px;font-weight:600;margin-bottom:10px}
.fld{margin:8px 0}.fld .l{font-size:13px;color:var(--mut);margin-bottom:4px}
.fld .seg{flex-wrap:wrap}
.fld .seg button.ok{background:var(--ok);color:#fff}.fld .seg button.bad{background:var(--bad);color:#fff}
/* hh tool */
.hh{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0}
.hh .sl{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin:6px 0}
.hh input[type=range]{width:100%;accent-color:var(--acc)}
.hh .out{font-size:15px;margin:8px 0}
.split{display:flex;height:26px;border-radius:5px;overflow:hidden;border:1px solid var(--line);font-size:13px}
.split div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;transition:width .15s}
.split .ha{background:#d9dee6}.split .a{background:var(--acc);color:#fff}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
footer{max-width:780px;margin:0 auto;padding:0 16px 24px;font-size:13px;color:var(--mut)}
.hide{display:none!important}
@media(max-width:560px){.hin{padding:6px 10px 4px}.brand{width:100%;font-size:14px}nav{width:100%;justify-content:space-between}nav button{font-size:14px;padding:6px 7px}main{padding-top:12px}}
.frow{display:flex;justify-content:flex-end;margin:-6px 0 6px}
.flag{font:inherit;font-size:13px;color:var(--mut);background:none;border:1px solid var(--line);border-radius:5px;padding:2px 8px;cursor:pointer}
.flag.on{color:var(--acc);border-color:var(--acc);background:var(--accbg);font-weight:600}
.shd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qhead .flag{vertical-align:1px}
</style>
</head>

<div class="brand">BMSC 3401 Exam 1 <span id="modlist"></span></div>
<nav id="nav">
<button data-t="sheet">Study guide</button><button data-t="practice">Practice</button><button data-t="mock">Mock exam</button><button data-t="bank">Questions</button>
</nav></div></header>
<main id="main"></main>

"1.1":`
<h4>Four classes, what holds them together, what they do</h4>
<table>
<tr><th>Class</th><th>Building block</th><th>Bond</th><th>Role</th></tr>
<tr><td>Carbohydrate</td><td>monosaccharide</td><td>glycosidic</td><td>main fuel (glucose); storage as glycogen (animals) / starch (plants); branched chains for structure, cell ID, cell–cell contact</td></tr>
<tr><td>Lipid</td><td><b>no repeating unit</b></td><td>ester (fatty acid → glycerol)</td><td>stored fat, membranes, hormones</td></tr>
<tr><td>Protein</td><td>amino acid</td><td>peptide (unbranched chain)</td><td>enzymes, structure, signaling, transport</td></tr>
<tr><td>Nucleic acid</td><td>nucleotide (5-C sugar + base + phosphate)</td><td>phosphodiester</td><td>store and transfer genetic info</td></tr>
</table>
<p>All four bonds form by dehydration synthesis (water out) and break by hydrolysis (water in).</p>

<h4>Lipids</h4>
<ul>
<li><b>Triglyceride:</b> glycerol + 3 fatty acids via ester bonds. Stored fat (adipose).</li>
<li><b>Phospholipid:</b> glycerol + 2 FAs + modified phosphate (head). Sphingolipids use a <b>sphingosine</b> backbone instead. Bilayer: heads out, tails in.</li>
<li><b>Steroid:</b> 4 fused rings. Cholesterol → bile salts, testosterone, estradiol, cortisol. In the membrane it buffers fluidity in both directions (heat and cold).</li>
<li>Saturated = no C=C, packs tight, solid (butter). Unsaturated = ≥1 C=C, kinks, liquid (olive oil), adds membrane fluidity.</li>
</ul>

<h4>Amino acid groups (book grouping, no structures needed)</h4>
<table>
<tr><th>Group</th><th>Members</th><th>Water</th></tr>
<tr><td>Aliphatic</td><td>Ala, Gly, Ile, Leu, Pro, Val</td><td>hydrophobic, <b>except Gly</b></td></tr>
<tr><td>Aromatic</td><td>Phe, Trp, Tyr</td><td>hydrophobic (Tyr is polar but still counted hydrophobic)</td></tr>
<tr><td>Acidic (−)</td><td>Asp, Glu</td><td>hydrophilic</td></tr>
<tr><td>Basic (+)</td><td>Arg, His, Lys</td><td>hydrophilic</td></tr>
<tr><td>Hydroxylic</td><td>Ser, Thr</td><td>hydrophilic</td></tr>
<tr><td>Amidic</td><td>Asn, Gln</td><td>hydrophilic</td></tr>
<tr><td>Sulfur</td><td>Cys, Met</td><td>Cys hydrophilic, Met hydrophobic</td></tr>
</table>
<p class="conf"><b>Easy to confuse:</b> polar ≠ hydrophilic in this book. Gly is nonpolar but hydrophilic; Tyr is polar but hydrophobic. Pro is an imino acid (NH, not NH<sub>2</sub>).</p>

<h4>DNA vs RNA</h4>
<p>DNA: deoxyribose; A T G C. RNA: ribose; A <b>U</b> G C. They differ in sugar <i>and</i> one base.</p>

<h4>Where pathways happen</h4>
<table>
<tr><td>Cytosol</td><td>glycolysis, glycogen synthesis, fatty acid / amino acid / nucleotide synthesis</td></tr>
<tr><td>Mito matrix</td><td>citric acid cycle, β-oxidation</td></tr>
<tr><td>Inner mito membrane</td><td>oxidative phosphorylation (cristae add surface area)</td></tr>
<tr><td>Smooth ER</td><td>triacylglycerol, phospholipid, cholesterol and steroid hormone synthesis (Leydig cells, hepatocytes, adipocytes)</td></tr>
<tr><td>Peroxisome</td><td>first β-oxidation of <b>very long</b> fatty acids, H<sub>2</sub>O<sub>2</sub> breakdown, bile acid and DHA synthesis</td></tr>
<tr><td>Lysosome</td><td>digests all 4 classes; the only pathway run here is glycogen degradation</td></tr>
</table>
<p class="conf"><b>Easy to confuse:</b> ester (lipids) vs phosphodiester (nucleic acids); glycogen (animal) vs starch (plant).</p>
`,
"1.2":`
<h4>Two properties do most of the work</h4>
<ol>
<li><b>Polarity.</b> O is more electronegative than H → O is δ−, H's are δ+. Polar and charged molecules dissolve (hydrophilic); nonpolar ones don't (hydrophobic).</li>
<li><b>Hydrogen bonding.</b> δ+ H on N, O or F ↔ δ− atom on another molecule. Gives cohesion (meniscus, water dome on a penny, bugs on water).</li>
</ol>

<h4>Weak (noncovalent, intermolecular) forces, strongest → weakest</h4>
<table>
<tr><th>Force</th><th>What it is</th><th>Example</th></tr>
<tr><td>Ion–dipole</td><td>ion ↔ opposite end of a polar molecule</td><td>NaCl dissolving; charged side chains binding</td></tr>
<tr><td>Hydrogen bond</td><td>strongest dipole–dipole (H on N/O/F)</td><td>DNA strands, protein shape, water cohesion</td></tr>
<tr><td>Dipole–dipole</td><td>polar ↔ polar</td><td>polar groups lining up</td></tr>
<tr><td>van der Waals</td><td>transient dipoles; works between <b>all</b> molecules, even nonpolar</td><td>gecko feet; packed protein cores</td></tr>
</table>
<p>They're weak and <b>reversible</b>, which is the point: molecules can bind, let go and rearrange. Thousands of them together give a lot of stability. van der Waals attraction rises as atoms get closer until the <b>contact distance</b>; any closer and the electron clouds repel.</p>

<h4>Hydrophobic effect</h4>
FIG:hydro
<p>Nonpolar molecules cluster <b>not because they attract each other</b>, but because clustering frees the ordered "cage" waters → entropy goes up → spontaneous. This drives bilayer formation and buries hydrophobic amino acids in the protein core.</p>
<p class="conf"><b>Easy to confuse:</b> weak interactions = attraction. Hydrophobic effect = entropy of water, not attraction.</p>

<h4>Why water weakens electrostatic interactions <span class="tag">beyond</span></h4>
<p>Water molecules orient around each ion (δ− O toward cations, δ+ H toward anions), shielding the charges from each other. In textbook terms, water has a high dielectric constant. That's why salt dissolves, and why charge–charge interactions inside proteins are strongest where water is excluded.</p>

"1.3":`
<h4>Equations</h4>
<table>
<tr><td>pH = −log[H<sup>+</sup>]</td><td>[H<sup>+</sup>] = 10<sup>−pH</sup></td></tr>
<tr><td>pOH = −log[OH<sup>−</sup>]</td><td>pH + pOH = 14 (K<sub>w</sub> = 10<sup>−14</sup>)</td></tr>
<tr><td>K<sub>a</sub> = [H<sup>+</sup>][A<sup>−</sup>]/[HA]</td><td>pK<sub>a</sub> = −log K<sub>a</sub></td></tr>
<tr><td colspan="2"><b>pH = pK<sub>a</sub> + log([A<sup>−</sup>]/[HA])</b> &nbsp;→&nbsp; ratio = 10<sup>(pH − pKa)</sup></td></tr>
</table>
<ul>
<li>1 pH unit = 10× [H<sup>+</sup>]. 2 units = 100×.</li>
<li>Bigger K<sub>a</sub> = smaller pK<sub>a</sub> = stronger acid (dissociates more). Strong acids (HCl) dissociate fully: 0.1 M HCl → pH 1.</li>
<li>K<sub>eq</sub> &gt; 1 favors products, &lt; 1 favors reactants. Know how to interpret it; you're unlikely to calculate one.</li>
</ul>

<h4>Reading H–H without math</h4>
<table>
<tr><td>pH &gt; pK<sub>a</sub></td><td>[A<sup>−</sup>] &gt; [HA] (deprotonated wins)</td></tr>
<tr><td>pH = pK<sub>a</sub></td><td>[A<sup>−</sup>] = [HA], half dissociated, best buffering</td></tr>
<tr><td>pH &lt; pK<sub>a</sub></td><td>[HA] &gt; [A<sup>−</sup>] (protonated wins)</td></tr>
</table>
<p>Most organic acids at pH 7.4 are in base form, which is why pathways say pyruvate and lactate, not pyruvic acid and lactic acid. Uncharged HA crosses the membrane's hydrophobic core more easily; the charged form is more water-soluble.</p>

<h4>Buffers</h4>
<p>A weak acid + its conjugate base. It <b>resists change</b> in pH; it does not pull pH toward 7. It works best within <b>pK<sub>a</sub> ± 1</b>.</p>
TOOL:hh
<p class="conf"><b>Easy to confuse:</b> "buffer neutralizes" (wrong) vs "buffer maintains whatever pH it's at" (right). Strong acid = low pK<sub>a</sub>, not high.</p>

<h4>Direct measurement <span class="tag">beyond</span></h4>
<p>The lecture only covers calculation. In practice pH is measured with a pH meter (electrode reads [H<sup>+</sup>] directly) or with indicator dyes or strips that change color over a set pH range.</p>
`,
"1.4":`
<h4>The system</h4>
FIG:bicarb
<ul>
<li>pK<sub>a</sub> 6.1, blood pH 7.4 → [HCO<sub>3</sub><sup>−</sup>]:[H<sub>2</sub>CO<sub>3</sub>] = 10<sup>1.3</sup> ≈ <b>20:1</b>. That large bicarbonate reserve soaks up acids like lactic acid.</li>
<li>In the lungs the reaction runs left → CO<sub>2</sub> is exhaled, removing acid.</li>
<li>Ratio up → pH up. Ratio down → pH down.</li>
</ul>

<h4>Predicting the disorder</h4>
<table>
<tr><th>Cause</th><th>Shift</th><th>pH</th><th>Disorder</th></tr>
<tr><td>Breathing too slow / CO<sub>2</sub> retained (opioids, COPD)</td><td>right</td><td>↓</td><td>respiratory acidosis</td></tr>
<tr><td>Breathing too fast / CO<sub>2</sub> blown off (panic, altitude)</td><td>left</td><td>↑</td><td>respiratory alkalosis</td></tr>
<tr><td>Acid added (lactic acid, ketoacids) or HCO<sub>3</sub><sup>−</sup> lost (diarrhea)</td><td>bicarbonate consumed</td><td>↓</td><td>metabolic acidosis</td></tr>
<tr><td>Acid lost (vomiting stomach HCl)</td><td>H<sup>+</sup> regenerated, HCO<sub>3</sub><sup>−</sup> left over</td><td>↑</td><td>metabolic alkalosis</td></tr>
</table>
<p><b>Rule:</b> "respiratory" = the problem starts with CO<sub>2</sub>. "Metabolic" = it starts with acid or HCO<sub>3</sub><sup>−</sup>. Compensation is the other system pushing back: breathing faster to blow off CO<sub>2</sub> in metabolic acidosis is <b>beyond</b> the lecture, but it follows from the same equation.</p>
<h4>Why it matters</h4>
<p>pH shifts change which groups are protonated. That breaks electrostatic interactions and H-bonds → proteins misfold and enzymes lose activity.</p>
<p class="conf"><b>Easy to confuse:</b> more CO<sub>2</sub> = more acid (pH down). People flip this because CO<sub>2</sub> isn't "an acid" on its own; it becomes one by making H<sub>2</sub>CO<sub>3</sub>.</p>
<p class="mut sm">Note: 7.4 sits outside 6.1 ± 1, yet the system still works because it's open. The lungs remove CO<sub>2</sub> and the kidneys adjust HCO<sub>3</sub><sup>−</sup> <span class="tag">beyond</span>.</p>
`
},

questions:[
// ---------- 1.1 ----------
{id:"m1q01",lo:"1.1",src:"L1",type:"mc",
stem:"Which pairing of bond and biomolecule is correct?",
opts:["Ester bond — links fatty acids to glycerol in a triglyceride","Phosphodiester bond — links monosaccharides in glycogen","Glycosidic bond — links amino acids in a polypeptide","Peptide bond — links nucleotides in RNA"],ans:0,
exp:"Ester bonds attach fatty acids to glycerol. Glycosidic bonds join sugars, peptide bonds join amino acids, and phosphodiester bonds join nucleotides."},
{id:"m1q02",lo:"1.1",src:"L1",type:"tf",
stem:"Like the other three classes of biomolecules, lipids are polymers built from a repeating monomer.",ans:false,
exp:"Lipids are the exception: they are not made of repeating units. Carbohydrates, proteins and nucleic acids are polymers."},
{id:"m1q03",lo:"1.1",src:"L1",type:"mc",
stem:"A membrane is enriched in phospholipids carrying unsaturated fatty acid tails. Compared with a membrane of saturated tails, it will be:",
opts:["More fluid, because C=C double bonds keep the tails from packing tightly","More rigid, because C=C double bonds are stronger than single bonds","More fluid, because unsaturated tails are more hydrophilic","More rigid, because unsaturated tails carry extra hydrogens"],ans:0,
exp:"Double bonds put kinks in the tails so they pack loosely, which gives fluidity. Saturated tails, with no double bonds, pack tightly and give stability. Unsaturated tails are still hydrophobic, and they carry fewer hydrogens, not more."},
{id:"m1q04",lo:"1.1",src:"L1",type:"mc",
stem:"Which amino acid is grouped as hydrophilic even though its R group is nonpolar?",
opts:["Glycine","Tyrosine","Methionine","Proline"],ans:0,
exp:"Glycine is the aliphatic exception: nonpolar but counted hydrophilic. Tyrosine is the reverse case (polar but hydrophobic). Met and Pro are nonpolar and hydrophobic."},
{id:"m1q05",lo:"1.1",src:"L1",type:"tf",
stem:"Because tyrosine's side chain is polar, it is classified with the hydrophilic amino acids.",ans:false,
exp:"Tyrosine is polar but interacts only weakly with water, so the book counts it as polar hydrophobic, alongside Phe and Trp in the aromatic group."},
{id:"m1q06",lo:"1.1",src:"L1",type:"mc",
stem:"A residue buried in the water-excluding core of a folded protein is most likely to be:",
opts:["Methionine","Cysteine","Serine","Glutamine"],ans:0,
exp:"The core holds hydrophobic residues. Of the two sulfur amino acids, Met is hydrophobic and Cys is hydrophilic. Ser (hydroxylic) and Gln (amidic) are polar hydrophilic."},
{id:"m1q07",lo:"1.1",src:"L1",type:"mc",
stem:"Which set contains only amino acids that are positively charged at neutral pH?",
opts:["Arg, His, Lys","Asp, Glu, Lys","Arg, Gln, His","Asn, Arg, Lys"],ans:0,
exp:"The basic (positive) amino acids are Arg, His and Lys. Asp and Glu are acidic (negative). Gln and Asn are amidic and uncharged."},
{id:"m1q08",lo:"1.1",src:"L1",type:"tf",
stem:"DNA and RNA nucleotides differ only in which nitrogenous bases they use.",ans:false,
exp:"They also differ in the sugar: deoxyribose in DNA, ribose in RNA. Base-wise, DNA has T and RNA has U."},
{id:"m1q09",lo:"1.1",src:"L1",type:"mc",
stem:"Glycogen and starch are best described as:",
opts:["Branched glucose polysaccharides storing fuel in animals and plants, respectively","Branched glucose polysaccharides storing fuel in plants and animals, respectively","Glucose disaccharides storing fuel in animals and plants, respectively","Structural fructose polysaccharides found in animals and plants, respectively"],ans:0,
exp:"Both store glucose as polysaccharides joined by glycosidic bonds. Glycogen is the animal form and starch is the plant form."},
{id:"m1q10",lo:"1.1",src:"L2",type:"mc",
stem:"Which cell would you expect to have the most extensive smooth ER?",
opts:["A testosterone-secreting Leydig cell","An antibody-secreting plasma cell","An enzyme-secreting pancreatic acinar cell","A mature red blood cell"],ans:0,
exp:"Smooth ER is where lipids and steroids are made, so steroid-producing cells like Leydig cells have a lot of it. Cells that secrete proteins rely on rough ER, and mature RBCs have no organelles."},
{id:"m1q11",lo:"1.1",src:"L2",type:"mc",
stem:"The citric acid cycle and oxidative phosphorylation occur in which locations, respectively?",
opts:["Mitochondrial matrix; inner mitochondrial membrane","Inner mitochondrial membrane; mitochondrial matrix","Cytosol; inner mitochondrial membrane","Mitochondrial matrix; intermembrane space"],ans:0,
exp:"The citric acid cycle runs in the matrix, and oxidative phosphorylation runs on the inner membrane, where cristae add surface area. Glycolysis is the cytosolic pathway. This pairing comes back in Module 3."},
{id:"m1q12",lo:"1.1",src:"L2",type:"mc",
stem:"The initial breakdown of very long-chain fatty acids takes place in the:",
opts:["Peroxisome","Lysosome","Smooth ER","Cytosol"],ans:0,
exp:"Peroxisomes begin β-oxidation of very long fatty acids. Ordinary β-oxidation happens in the mitochondrial matrix, and the lysosome's only metabolic pathway is glycogen degradation."},
{id:"m1q13",lo:"1.1",src:"L1",type:"mc",
stem:"Cholesterol's effect on the plasma membrane is to:",
opts:["Limit phospholipid movement at high temperature and prevent tight packing at low temperature","Increase fluidity at all temperatures by separating phospholipid tails","Decrease fluidity at all temperatures by stiffening phospholipid tails","Form transmembrane channels that let polar molecules cross the bilayer"],ans:0,
exp:"Cholesterol buffers fluidity in both directions: it keeps the membrane from getting too loose when warm and from packing solid when cold. Channels are formed by integral proteins, not cholesterol."},
{id:"m1q14",lo:"1.1",src:"L1",type:"tf",
stem:"Sphingolipids are phospholipids built on a glycerol backbone, like diglyceride phospholipids.",ans:false,
exp:"Sphingolipids use a sphingosine backbone instead of glycerol, and they are often studded with carbohydrates."},
{id:"m1q15",lo:"1.1",src:"L1",type:"mc",
stem:"Which functional group in amino acids acts as a base by accepting H⁺?",
opts:["Amine (–NH₂)","Carboxyl (–COOH)","Hydroxyl (–OH)","Phosphate (–PO₄)"],ans:0,
exp:"The amine group accepts H⁺ (basic, becoming –NH₃⁺). The carboxyl group donates H⁺ (acidic). Both are found in every amino acid."},
{id:"m1q16",lo:"1.1",src:"L1",type:"tf",
stem:"Carbon dioxide is an organic compound because it contains carbon.",ans:false,
exp:"Organic compounds have carbon bonded to hydrogen. CO₂ has carbon bonded only to oxygen, so it's inorganic."},
{id:"m1q17",lo:"1.1",src:"L1",type:"tf",
stem:"Phospholipids spontaneously arrange tail-to-tail in water because each molecule is amphipathic.",ans:true,
exp:"The hydrophilic heads face water and the hydrophobic tails hide together. That's how the bilayer forms with no energy input."},

// ---------- 1.2 ----------
{id:"m1q18",lo:"1.2",src:"L3",type:"mc",
stem:"When small oil droplets in water merge into one large droplet, the main driving force is:",
opts:["An increase in entropy as ordered water molecules around the oil are released","Hydrogen bonds forming between neighboring oil molecules","A decrease in entropy as oil molecules become more ordered","Ion–dipole attraction between oil molecules and water"],ans:0,
exp:"That's the hydrophobic effect: merging shrinks the total oil surface, freeing caged water molecules and raising entropy. Oil can't hydrogen-bond, and merging isn't driven by attraction.",fig:"hydro"},
{id:"m1q19",lo:"1.2",src:"L3",type:"tf",
stem:"Nonpolar molecules cluster in water because they are strongly attracted to one another.",ans:false,
exp:"The hydrophobic effect is about water's entropy, not attraction. That's the key difference between it and the weak interactions."},
{id:"m1q20",lo:"1.2",src:"L3",type:"mc",
stem:"Which ranks the interactions from strongest to weakest?",
opts:["Ion–dipole > hydrogen bond > dipole–dipole > van der Waals","Hydrogen bond > ion–dipole > van der Waals > dipole–dipole","Ion–dipole > dipole–dipole > hydrogen bond > van der Waals","van der Waals > dipole–dipole > hydrogen bond > ion–dipole"],ans:0,
exp:"A full ionic charge beats partial charges. A hydrogen bond is the strongest type of dipole–dipole. van der Waals forces are the weakest individually."},
{id:"m1q21",lo:"1.2",src:"L3",type:"mc",
stem:"Which pair can form a hydrogen bond?",
opts:["The H of an –OH group and the O of water","The H of a C–H group and the O of water","A Na⁺ ion and the O of water","Two methane (CH₄) molecules"],ans:0,
exp:"The donor H has to be bonded to N, O or F. A C–H hydrogen isn't polarized enough. Na⁺ with water is ion–dipole, and methane–methane is only van der Waals."},
{id:"m1q22",lo:"1.2",src:"L3",type:"tf",
stem:"van der Waals interactions can occur only between polar molecules.",ans:false,
exp:"They happen between all molecules, even nonpolar ones, because electrons briefly sit unevenly and create transient dipoles."},
{id:"m1q23",lo:"1.2",src:"L3",type:"mc",
stem:"Two atoms are pushed closer together than their van der Waals contact distance. What happens?",
opts:["Repulsion between their electron clouds outweighs attraction","Attraction reaches its maximum and stays there","A covalent bond forms between them","The transient dipoles become permanent dipoles"],ans:0,
exp:"Attraction increases as atoms approach until the contact distance. Closer than that, the electron clouds repel."},
{id:"m1q24",lo:"1.2",src:"L3",type:"mc",
stem:"A gecko can hang from a glass ceiling with no glue. Which interaction explains this?",
opts:["Very many van der Waals interactions acting together","A few strong hydrogen bonds to the glass","Ion–dipole attraction between foot proteins and glass","The hydrophobic effect excluding water from the foot"],ans:0,
exp:"Each van der Waals interaction is tiny, but millions of close contacts add up. It's the lecture's example of their cumulative strength."},
{id:"m1q25",lo:"1.2",src:"L3",type:"mc",tag:"beyond",
stem:"Why does water weaken the attraction between two oppositely charged ions?",
opts:["Water molecules orient around each ion and shield the charges from each other","Water forms covalent bonds with the ions, neutralizing their charge","Water donates electrons to the cation until both ions are neutral","Water excludes the ions from solution through the hydrophobic effect"],ans:0,
exp:"Because water is polar, it surrounds each ion with oppositely oriented partial charges (δ− O toward cations, δ+ H toward anions), which screens the ions from each other. In textbook terms, water has a high dielectric constant. This is also why salt dissolves."},
{id:"m1q26",lo:"1.2",src:"L3",type:"tf",
stem:"A major advantage of weak interactions in biology is that they form and break easily, letting molecules bind and release.",ans:true,
exp:"Weak forces are transient and reversible. That's what lets a cell interact with its environment dynamically, while their large numbers still give stability."},
{id:"m1q27",lo:"1.2",src:"L3",type:"tf",
stem:"Hydrogen bonds hold the two strands of DNA together, yet they are weak enough to let the strands separate during replication.",ans:true,
exp:"This is the lecture's main example of weak-but-useful: stable in large numbers, but easy to break."},
{id:"m1q28",lo:"1.2",src:"L3",type:"mc",
stem:"Which property of water most directly explains why a water strider can stand on a pond surface?",
opts:["Cohesion from hydrogen bonding between water molecules","Water's ability to act as both an acid and a base","The hydrophobic effect around the insect's legs","Ion–dipole interactions at the water surface"],ans:0,
exp:"Hydrogen bonds between water molecules create cohesion and surface tension. The penny water dome and the meniscus are the same effect."},

// ---------- 1.3 ----------
{id:"m1q29",lo:"1.3",src:"L4",type:"mc",
stem:"A solution has [H₃O⁺] = 1 × 10⁻³ M. What are its pOH and [OH⁻]?",
opts:["pOH 11; [OH⁻] = 1 × 10⁻¹¹ M","pOH 3; [OH⁻] = 1 × 10⁻³ M","pOH 11; [OH⁻] = 1 × 10⁻³ M","pOH 3; [OH⁻] = 1 × 10⁻¹¹ M"],ans:0,
exp:"pH = 3, so pOH = 14 − 3 = 11 and [OH⁻] = 10⁻¹¹ M.",
steps:["pH = −log(10⁻³) = 3","pOH = 14 − pH = 11","[OH⁻] = 10<sup>−pOH</sup> = 10⁻¹¹ M"]},
{id:"m1q30",lo:"1.3",src:"L4",type:"mc",
stem:"Urine pH changes from 6 to 4. The [H⁺] has:",
opts:["Increased 100-fold","Increased 2-fold","Decreased 100-fold","Increased 20-fold"],ans:0,
exp:"Each pH unit is a 10× change, and lower pH means more H⁺. Two units down = 10 × 10 = 100× more H⁺.",
steps:["Δ pH = 4 − 6 = −2","[H⁺] ratio = 10<sup>2</sup> = 100","pH went down, so [H⁺] went up"]},
{id:"m1q31",lo:"1.3",src:"L4",type:"mc",
stem:"Acetic acid has a pKa of 4.8. At pH 7.4, it exists mostly as:",
opts:["Acetate, with [A⁻]/[HA] ≈ 400","Acetic acid, with [HA]/[A⁻] ≈ 400","Acetate, with [A⁻]/[HA] ≈ 2.6","Equal amounts of acetate and acetic acid"],ans:0,
exp:"pH is above the pKa, so the deprotonated form wins. Ratio = 10^(7.4 − 4.8) = 10^2.6 ≈ 400.",
steps:["pH = pKa + log([A⁻]/[HA])","7.4 = 4.8 + log(ratio) → log(ratio) = 2.6","ratio = 10<sup>2.6</sup> ≈ 398","Common trap: 2.6 is the log of the ratio, not the ratio itself"]},
{id:"m1q32",lo:"1.3",src:"L4",type:"tf",
stem:"When the pH equals the pKa, half of the acid molecules are deprotonated.",ans:true,
exp:"pH = pKa makes log([A⁻]/[HA]) = 0, so the ratio is 1:1. This is also where buffering is strongest."},
{id:"m1q33",lo:"1.3",src:"L4",type:"mc",
stem:"Acid X has Ka = 1 × 10⁻³ and acid Y has Ka = 1 × 10⁻⁶. Which is correct?",
opts:["X is the stronger acid and has the lower pKa (3 vs 6)","X is the stronger acid and has the higher pKa (6 vs 3)","Y is the stronger acid and has the lower pKa (3 vs 6)","Y is the stronger acid and has the higher pKa (6 vs 3)"],ans:0,
exp:"A larger Ka means it dissociates more, so it's a stronger acid. pKa = −log Ka gives 3 for X and 6 for Y. Stronger acid = lower pKa."},
{id:"m1q34",lo:"1.3",src:"L4",type:"mc",
stem:"A drug is a weak acid with pKa 3.5. Assume it is absorbed only in its conjugate base form. Where is absorption greater?",
opts:["Small intestine (pH 3.5), because there [A⁻] equals [HA]","Stomach (pH 1.5), because there [A⁻] exceeds [HA]","Stomach (pH 1.5), because there [HA] exceeds [A⁻]","Absorption is equal, since the pKa does not change"],ans:0,
exp:"In the stomach, pH 1.5 is below the pKa, so HA dominates (A⁻:HA = 1:100). At pH 3.5, pH = pKa, so half the drug is A⁻. More conjugate base means more absorption.",
steps:["Stomach: ratio = 10<sup>1.5 − 3.5</sup> = 10⁻² → 1 A⁻ per 100 HA","Intestine: ratio = 10<sup>0</sup> = 1 → 1:1","More A⁻ available in the intestine → more absorbed"]},
{id:"m1q35",lo:"1.3",src:"L4",type:"mc",
stem:"Which form of a weak acid diffuses through the hydrophobic core of the plasma membrane more easily?",
opts:["The protonated, uncharged form (HA)","The deprotonated, charged form (A⁻)","Both cross equally well","Neither; weak acids cross only through channels"],ans:0,
exp:"Charged forms are more polar and water-soluble but struggle to cross the hydrophobic core. The uncharged HA crosses more readily."},
{id:"m1q36",lo:"1.3",src:"L4",type:"mc",
stem:"You need a buffer to hold a solution at pH 7.0. Which weak acid is the best choice?",
opts:["H₂PO₄⁻ (pKa 6.8)","Acetic acid (pKa 4.8)","NH₄⁺ (pKa 9.2)","H₃PO₄ (pKa 2.1)"],ans:0,
exp:"A buffer works best within pKa ± 1. Only 6.8 covers 7.0 (range 5.8–7.8)."},
{id:"m1q37",lo:"1.3",src:"L4",type:"tf",
stem:"Adding a buffer to an acidic solution moves its pH toward 7.",ans:false,
exp:"This is the misconception the lecture calls out. A buffer resists change at whatever pH it's at; it doesn't neutralize."},
{id:"m1q38",lo:"1.3",src:"L4",type:"mc",
stem:"What is the pH of 0.01 M HCl?",
opts:["2","1","12","0.01"],ans:0,
exp:"HCl is a strong acid and fully dissociates, so [H⁺] = 0.01 = 10⁻² M and pH = 2.",
steps:["Strong acid → [H⁺] = 0.01 M = 10⁻² M","pH = −log(10⁻²) = 2"]},
{id:"m1q39",lo:"1.3",src:"L4",type:"mc",
stem:"Metabolic pathways name intermediates like \"pyruvate\" and \"lactate\" rather than \"pyruvic acid\" and \"lactic acid\" because:",
opts:["Their pKa values are well below 7.4, so they exist mostly as conjugate bases","Their pKa values are well above 7.4, so they exist mostly as conjugate bases","They are strong acids that dissociate completely at any pH","Cells convert them to bases with ATP before using them"],ans:0,
exp:"When pH > pKa the deprotonated (-ate) form dominates. Organic acids have pKa values far below blood pH."},
{id:"m1q40",lo:"1.3",src:"L4",type:"mc",
stem:"In the titration curve shown, which point marks the region of strongest buffering?",
opts:["A","B","C","D"],ans:1,fixed:true,fig:"titr",
exp:"B is the flat middle of the curve, where pH = pKa and [HA] = [A⁻]. Adding base barely moves pH there. At A and D almost all of the acid is in one form, and C is past the buffer zone."},
{id:"m1q41",lo:"1.3",src:"L4",type:"tf",
stem:"A Keq less than 1 indicates that a reaction at equilibrium favors the reactants.",ans:true,
exp:"Keq is products over reactants. Below 1 means more reactant at equilibrium. Water's tiny Keq shows how little it dissociates."},

// ---------- 1.4 ----------
{id:"m1q42",lo:"1.4",src:"L4",type:"mc",
stem:"A patient's blood pH is 7.1. Using pKa 6.1, what is the [HCO₃⁻]:[H₂CO₃] ratio?",
opts:["10:1","20:1","1:10","1:1"],ans:0,
exp:"Ratio = 10^(7.1 − 6.1) = 10¹ = 10. That's half the normal 20:1, so this patient is acidemic.",
steps:["7.1 = 6.1 + log(ratio)","log(ratio) = 1.0","ratio = 10¹ = 10 → 10:1 (normal is 20:1 at 7.4)"]},
{id:"m1q43",lo:"1.4",src:"L4",type:"mc",
stem:"A blood sample has [HCO₃⁻]:[H₂CO₃] = 40:1 (pKa 6.1). This patient has:",
opts:["Alkalosis, pH ≈ 7.7","Acidosis, pH ≈ 7.1","Alkalosis, pH ≈ 46","Normal pH, 7.4"],ans:0,
exp:"pH = 6.1 + log 40 ≈ 6.1 + 1.6 = 7.7, which is above 7.4. Doubling the ratio raises pH by log 2 ≈ 0.3.",
steps:["pH = 6.1 + log(40)","log(40) ≈ 1.6","pH ≈ 7.7 → above 7.4 = alkalosis"]},
{id:"m1q44",lo:"1.4",src:"L4",type:"mc",
stem:"An opioid overdose slows a patient's breathing. Which sequence follows?",
opts:["CO₂ rises → equilibrium shifts toward H⁺ + HCO₃⁻ → pH falls → respiratory acidosis","CO₂ rises → equilibrium shifts toward CO₂ + H₂O → pH rises → respiratory alkalosis","CO₂ falls → equilibrium shifts toward H⁺ + HCO₃⁻ → pH falls → metabolic acidosis","CO₂ falls → equilibrium shifts toward CO₂ + H₂O → pH rises → respiratory alkalosis"],ans:0,fig:"bicarb",
exp:"Slower breathing means less CO₂ is exhaled. The extra CO₂ pushes the equation right, making more H⁺. It's respiratory because the problem started with CO₂."},
{id:"m1q45",lo:"1.4",src:"L4",type:"mc",
stem:"During a panic attack a person hyperventilates. Their blood will show:",
opts:["Lower CO₂, lower [H⁺], higher pH","Higher CO₂, higher [H⁺], lower pH","Lower CO₂, higher [H⁺], lower pH","Higher CO₂, lower [H⁺], higher pH"],ans:0,
exp:"Blowing off CO₂ pulls the equation left, which uses up H⁺, so pH rises (respiratory alkalosis)."},
{id:"m1q46",lo:"1.4",src:"L4",type:"tf",
stem:"Increasing the CO₂ concentration in blood raises blood pH.",ans:false,
exp:"More CO₂ makes more carbonic acid, which releases H⁺, so pH goes down."},
{id:"m1q47",lo:"1.4",src:"L4",type:"tf",
stem:"In the lungs, the bicarbonate reactions run toward CO₂, so acid leaves the body as exhaled gas.",ans:true,
exp:"Enzymes in the lung favor the reverse reaction. That's how CO₂ made by metabolism stops building up as acid."},
{id:"m1q48",lo:"1.4",src:"L4",type:"mc",
stem:"During a sprint, lactic acid floods the blood. How does the bicarbonate system respond?",
opts:["HCO₃⁻ binds the added H⁺, forming H₂CO₃ that converts to CO₂ for exhalation","H₂CO₃ binds the added H⁺, forming HCO₃⁻ that is excreted","CO₂ binds the added H⁺, forming H₂CO₃ that releases HCO₃⁻","The added H⁺ converts water into more HCO₃⁻ to raise pH"],ans:0,
exp:"Bicarbonate is the base that soaks up H⁺. This is why the 20:1 bicarbonate reserve matters. The equation shifts left and the extra CO₂ is breathed off."},
{id:"m1q49",lo:"1.4",src:"L4",type:"mc",tag:"beyond",
stem:"A patient with severe vomiting loses large amounts of stomach HCl. Which disturbance is most likely?",
opts:["Metabolic alkalosis","Metabolic acidosis","Respiratory alkalosis","Respiratory acidosis"],ans:0,
exp:"Losing H⁺ leaves extra HCO₃⁻ behind, so pH rises. The cause is acid loss, not CO₂, so it's metabolic. Severe diarrhea is the opposite: it loses HCO₃⁻ and causes metabolic acidosis."},
{id:"m1q50",lo:"1.4",src:"L4",type:"mc",tag:"beyond",
stem:"A patient with diabetic ketoacidosis breathes deeply and rapidly. What does this accomplish?",
opts:["Exhaling more CO₂ pulls the equilibrium left, removing H⁺ and raising pH toward normal","Inhaling more O₂ neutralizes the ketoacids directly","Exhaling more CO₂ pushes the equilibrium right, making HCO₃⁻ to cause alkalosis","Retaining CO₂ increases carbonic acid, which buffers the ketoacids"],ans:0,
exp:"This is respiratory compensation for metabolic acidosis. Removing CO₂ pulls H⁺ + HCO₃⁻ back toward CO₂. It partly corrects pH but doesn't fix the cause."},
{id:"m1q51",lo:"1.4",src:"L4",type:"mc",
stem:"Acidosis can impair enzyme function mainly because a pH change:",
opts:["Alters protonation of side chains, disrupting the electrostatic interactions and H-bonds that hold the protein's shape","Breaks the peptide bonds that link the protein's amino acids","Converts hydrophobic amino acids into hydrophilic ones","Increases the hydrophobic effect so the protein cannot fold"],ans:0,
exp:"Gaining or losing H⁺ changes side-chain charges, which disrupts the weak interactions that set the 3D shape. Peptide bonds are covalent and stay intact. This links 1.2 with 1.4."},
{id:"m1q52",lo:"1.4",src:"L4",type:"tf",tag:"beyond",
stem:"Even though blood pH (7.4) lies outside carbonic acid's pKa ± 1 range, the bicarbonate system remains effective because the lungs can adjust CO₂.",ans:true,
exp:"6.1 ± 1 only reaches 7.1, but it's an open system: breathing removes or keeps CO₂, and the kidneys handle HCO₃⁻. That's why it still buffers well at 7.4."}
],

<script>
(function(){
"use strict";
const KEY="bmsc3401-exam1";
let S={q:{},mocks:0,set:{timer:true,fb:"each",len:25},drills:{},flag:{},saved:{},pos:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
S.flag=S.flag||{};S.saved=S.saved||{};S.pos=S.pos||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const Q=[],LOS=[],LOBY={},QBY={};
MODS.forEach(m=>{m.los.forEach(l=>{l.mod=m;LOS.push(l);LOBY[l.id]=l;});m.questions.forEach(q=>{q.mod=m;Q.push(q);QBY[q.id]=q;});});
document.getElementById("modlist").textContent="· "+MODS.map(m=>m.short).join(", ");

const $=(s,el)=>(el||document).querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v);}kids.flat().forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c));});return e;}
const main=$("#main");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function seeded(str){let x=0;for(const c of str)x=(x*31+c.charCodeAt(0))|0;return()=>{x=(x*1103515245+12345)|0;return((x>>>8)&0xffff)/65536;};}
function seededShuffle(a,seed){const r=seeded(seed);a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fig(k){if(!k||!FIGS[k])return null;return h("div",{class:"fig",html:FIGS[k]});}
function loLabel(q){return "LO "+q.lo+" · "+q.mod.short+" "+q.src;}
function flagBtn(q){const b=h("button",{class:"flag"});const p=()=>{const on=!!S.flag[q.id];b.textContent=on?"Flagged":"Flag";b.classList.toggle("on",on);b.title=on?"Remove flag":"Flag for review";};b.addEventListener("click",()=>{if(S.flag[q.id])delete S.flag[q.id];else S.flag[q.id]=1;save();p();});p();return b;}

// options: returns [{text,correct}] in display order
function optsFor(q,shuf){
  if(q.type==="tf")return [{t:"True",c:q.ans===true},{t:"False",c:q.ans===false}];
  const o=q.opts.map((t,i)=>({t,c:i===q.ans}));
  if(q.fixed)return o;
  return shuf==="seed"?seededShuffle(o,q.id):shuffle(o);
}
function record(q,ok){const r=S.q[q.id]||{n:0,t:0,c:null};r.n++;r.t=Date.now();r.c=ok;S.q[q.id]=r;save();}

// ---- question view (shared) ----
// opts: {onAnswer(ok, idx), reveal:bool, picked:idx}
function qView(q,order,o){
  const w=h("div");
  w.append(h("div",{class:"stem",html:q.stem+(q.tag==="beyond"?' <span class="tag">beyond lecture</span>':"")}));
  const f=fig(q.fig);if(f)w.append(f);
  const box=h("div",{class:"opts"});
  const btns=order.map((op,i)=>{const b=h("button",{class:"opt",html:op.t});b.addEventListener("click",()=>o.onPick(i));box.append(b);return b;});
  w.append(box);
  const fbw=h("div");w.append(fbw);
  function paint(picked,reveal){
    btns.forEach((b,i)=>{b.className="opt";
      if(reveal){b.disabled=true;if(order[i].c)b.classList.add("ok");else if(i===picked)b.classList.add("bad");}
      else if(i===picked)b.classList.add("pick");});
    fbw.innerHTML="";
    if(reveal){const ok=picked!=null&&order[picked].c;fbw.append(explain(q,ok,picked==null));}
  }
  return {el:w,paint};
}
function explain(q,ok,skipped){
  const d=h("div",{class:"fb "+(ok?"ok":"bad")});
  d.append(h("b",{class:"v"},skipped?"Not answered":(ok?"Correct":"Incorrect")));
  d.append(h("div",{html:q.exp}));
  if(q.steps){const det=h("details",{class:"steps"},h("summary",null,"Work it through"),h("ol",null,q.steps.map(s=>h("li",{html:s}))));d.append(det);}
  return d;
}

// ---- tabs ----
let tab=null;const tabs={};
document.getElementById("nav").addEventListener("click",e=>{const t=e.target.dataset.t;if(t){go(t);}});
function go(t,arg){savePos();tab=t;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));if(tabs[t].cleanup)tabs[t].cleanup();main.innerHTML="";tabs[t].render(arg);window.scrollTo(0,t==="sheet"?(S.pos.sheet||0):0);S.tab=t;save();try{history.replaceState(null,"","#"+t);}catch(e){}}
function savePos(){if(tab==="sheet"&&main.querySelector(".sheet")){S.pos.sheet=Math.round(window.scrollY);save();}}
let st_;window.addEventListener("scroll",()=>{clearTimeout(st_);st_=setTimeout(savePos,250);},{passive:true});
window.addEventListener("pagehide",savePos);

function loSelect(id,withAll){
  const s=h("select",{id});
  if(withAll)s.append(h("option",{value:"all"},"All objectives"));
  MODS.forEach(m=>{const g=h("optgroup",{label:m.name});g.append(h("option",{value:"mod:"+m.id},m.short+": all"));m.los.forEach(l=>g.append(h("option",{value:l.id},l.id+" "+l.title)));s.append(g);});
  return s;
}
function filterQ(v){if(v==="all")return Q.slice();if(v.startsWith("mod:"))return Q.filter(q=>q.mod.id===v.slice(4));return Q.filter(q=>q.lo===v);}

// ===== PRACTICE =====
tabs.practice={render(){
  main.append(h("h1",null,"Practice"));
  main.append(h("p",{class:"mut sm"},"Questions by objective with explanations as you go, plus short drills for the things that are easiest to mix up."));
  const sel=loSelect("psel",true);
  const missed=h("input",{type:"checkbox"}),flg=h("input",{type:"checkbox"});
  const cnt=h("span",{class:"mut sm"});
  function upd(){const pool=pool_();cnt.textContent=pool.length+" question"+(pool.length===1?"":"s");start.disabled=!pool.length;}
  function pool_(){let p=filterQ(sel.value);if(missed.checked)p=p.filter(q=>S.q[q.id]&&S.q[q.id].c===false);if(flg.checked)p=p.filter(q=>S.flag[q.id]);return p;}
  const start=h("button",{class:"btn pri",onclick:()=>runPractice(pool_(),"Practice")},"Start");
  [sel,missed,flg].forEach(e=>e.addEventListener("change",upd));
  main.append(h("div",{class:"row"},sel),h("div",{class:"row"},h("label",{class:"chk"},missed,"Missed only"),h("label",{class:"chk"},flg,"Flagged only"),cnt,start));
  upd();
  main.append(h("h2",null,"Drills"));
  MODS.forEach(m=>(m.drills||[]).forEach(d=>{
    const st=S.drills[d.id];
    main.append(h("div",{class:"card",onclick:()=>openDrill(d)},h("b",null,d.title),h("span",{class:"mut sm"},"LO "+d.lo+" · "+d.intro+(st?" · last: "+st:""))));
  }));
}};

function runPractice(pool,title){
  // unseen first, then oldest
  const qs=shuffle(pool).sort((a,b)=>((S.q[a.id]||{}).t||0)-((S.q[b.id]||{}).t||0));
  let i=0,right=0;const missedIds=[];
  function show(){
    main.innerHTML="";
    if(i>=qs.length){
      main.append(h("h1",null,title+" done"),h("p",null,right+" / "+qs.length+" correct"));
      const r=h("div",{class:"row"});
      if(missedIds.length)r.append(h("button",{class:"btn pri",onclick:()=>runPractice(missedIds.map(id=>QBY[id]),"Retry")},"Retry the "+missedIds.length+" missed"));
      r.append(h("button",{class:"btn",onclick:()=>go("practice")},"Back"));main.append(r);return;
    }
    const q=qs[i];const order=optsFor(q);
    main.append(h("div",{class:"qhead"},h("span",null,(i+1)+" / "+qs.length),h("span",null,loLabel(q)+" ",flagBtn(q))));
    main.append(h("div",{class:"bar"},h("i",{style:"width:"+(i/qs.length*100)+"%"})));
    let done=false;
    const v=qView(q,order,{onPick(k){if(done)return;done=true;const ok=order[k].c;if(ok)right++;else missedIds.push(q.id);record(q,ok);v.paint(k,true);nx.disabled=false;nx.focus();}});
    main.append(v.el);
    const nx=h("button",{class:"btn pri",disabled:true,onclick:()=>{i++;show();}},i===qs.length-1?"Finish":"Next");
    main.append(h("div",{class:"row"},nx,h("button",{class:"btn link",onclick:()=>{i=qs.length;show();}},"End")));
  }
  show();
}

// ===== DRILLS =====
function openDrill(d){
  main.innerHTML="";
  main.append(h("div",{class:"row"},h("button",{class:"btn link",style:"margin-left:0;padding-left:0",onclick:()=>go("practice")},"← Practice")));
  main.append(h("h1",null,d.title),h("p",{class:"lohd"},"LO "+d.lo+" · "+LOBY[d.lo].title),h("p",{class:"mut"},d.intro));
  const body=h("div");main.append(body);
  if(d.kind==="sort")sortDrill(d,body,0);
  else if(d.kind==="case")caseDrill(d,body);
  else if(d.kind==="tool")body.append(TOOLS[d.tool]());
}
function sortDrill(d,body,ri){
  body.innerHTML="";
  const R=d.rounds[ri];
  if(d.rounds.length>1)body.append(h("h3",{style:"margin-top:4px"},"Round "+(ri+1)+" of "+d.rounds.length+": "+R.name));
  const items=shuffle(R.items).map(([t,bin,why])=>({t,bins:Array.isArray(bin)?bin:[bin],why,miss:0,done:false}));
  let sel=null,first=0;
  const pool=h("div",{class:"chips"});const msg=h("div",{class:"msg"});
  const binEls={};const bins=h("div",{class:"bins"});
  R.bins.forEach(b=>{const cs=h("div",{class:"chips"});const el=h("div",{class:"bin",onclick:()=>place(b)},h("h5",null,b),cs);binEls[b]={el,cs};bins.append(el);});
  body.append(pool,msg,bins);
  const chipEl=new Map();
  items.forEach(it=>{const c=h("button",{class:"chip",onclick:()=>{if(it.done)return;sel=it;paint();}},it.t);chipEl.set(it,c);pool.append(c);});
  function paint(){items.forEach(it=>{const c=chipEl.get(it);if(!it.done){c.className="chip"+(it===sel?" sel":"")+(it.miss>=2?" rev":"");}});Object.values(binEls).forEach(b=>b.el.classList.toggle("arm",!!sel));}
  function place(b){
    if(!sel)return;const it=sel;
    if(it.bins.includes(b)){
      it.done=true;if(!it.miss)first++;const c=chipEl.get(it);c.className="chip done";binEls[b].cs.append(c);
      msg.className="msg ok";msg.textContent=it.why?it.t+": "+it.why:"";
      sel=null;
    }else{
      it.miss++;msg.className="msg bad";
      msg.textContent=it.miss>=2?it.t+" goes in "+it.bins[0]+"."+(it.why?" "+it.why+".":""):it.t+" isn't "+b+". Try again.";
    }
    paint();
    if(items.every(x=>x.done)){
      const res=first+" / "+items.length+" on first try";S.drills[d.id]=res;save();
      const row=h("div",{class:"row"},h("span",null,res));
      if(ri+1<d.rounds.length)row.append(h("button",{class:"btn pri",onclick:()=>sortDrill(d,body,ri+1)},"Next round"));
      row.append(h("button",{class:"btn",onclick:()=>sortDrill(d,body,ri)},"Redo round"));
      body.append(row);
    }
  }
}
function caseDrill(d,body){
  body.innerHTML="";
  const cs=shuffle(d.cases);let i=0,right=0;
  function show(){
    body.innerHTML="";
    if(i>=cs.length){const res=right+" / "+cs.length+" fully correct";S.drills[d.id]=res;save();body.append(h("p",null,res),h("div",{class:"row"},h("button",{class:"btn pri",onclick:()=>caseDrill(d,body)},"Again")));return;}
    const c=cs[i];const pick=[null,null,null];
    const card=h("div",{class:"case"},h("div",{class:"qhead"},h("span",null,(i+1)+" / "+cs.length),h("span",null,c.beyond?"beyond lecture":"")),h("div",{class:"t"},c.t));
    const segs=d.fields.map((f,fi)=>{const seg=h("div",{class:"seg"});f.slice(1).forEach((lab,oi)=>seg.append(h("button",{onclick:()=>{if(pick.every(p=>p!=null)&&done)return;pick[fi]=oi;paintSeg();check();}},lab)));card.append(h("div",{class:"fld"},h("div",{class:"l"},f[0]),seg));return seg;});
    let done=false;const out=h("div");card.append(out);body.append(card);
    function paintSeg(){segs.forEach((s,fi)=>[...s.children].forEach((b,oi)=>{b.className="";if(done){if(oi===c.a[fi])b.className="ok";else if(oi===pick[fi])b.className="bad";}else if(oi===pick[fi])b.className="on";}));}
    function check(){if(done||pick.some(p=>p==null))return;done=true;const ok=pick.every((p,k)=>p===c.a[k]);if(ok)right++;paintSeg();
      out.append(h("div",{class:"fb "+(ok?"ok":"bad")},h("b",{class:"v"},ok?"Correct":"Incorrect"),h("div",{html:c.e})),h("div",{class:"row"},h("button",{class:"btn pri",onclick:()=>{i++;show();}},i===cs.length-1?"Finish":"Next")));}
  }
  show();
}

// ===== TOOLS =====
const TOOLS={hh(){
  const w=h("div",{class:"hh"});
  const P=[["Aspirin, stomach",3.5,1.5,"HA","A⁻"],["Aspirin, small intestine",3.5,3.5,"HA","A⁻"],["Aspirin, blood",3.5,7.4,"HA","A⁻"],["Acetic acid, blood",4.8,7.4,"HA","A⁻"],["Blood, normal",6.1,7.4,"H₂CO₃","HCO₃⁻"],["Blood, pH 7.25",6.1,7.25,"H₂CO₃","HCO₃⁻"]];
  let names=["HA","A⁻"];
  const pk=h("input",{type:"range",min:0,max:14,step:0.05,value:4.8}),ph=h("input",{type:"range",min:0,max:14,step:0.05,value:7.4});
  const pkv=h("b"),phv=h("b");
  const out=h("div",{class:"out"}),split=h("div",{class:"split"}),plot=h("div",{class:"fig"});
  const pre=h("div",{class:"presets"},P.map(p=>h("button",{class:"btn sm",onclick:()=>{pk.value=p[1];ph.value=p[2];names=[p[3],p[4]];draw();}},p[0])));
  w.append(pre,h("div",{class:"sl"},h("span",null,"pKa"),pk,pkv),h("div",{class:"sl"},h("span",null,"pH"),ph,phv),out,split,plot);
  pk.addEventListener("input",()=>{names=["HA","A⁻"];draw();});ph.addEventListener("input",draw);
  function fmt(r){if(r>=1e4||r<1e-3)return r.toExponential(1).replace("e+","×10^").replace("e","×10^");if(r>=100)return Math.round(r).toLocaleString();if(r>=10)return r.toFixed(1);return r.toPrecision(2);}
  function draw(){
    const a=+pk.value,b=+ph.value,d=b-a,r=Math.pow(10,d),f=r/(1+r);
    pkv.textContent=a.toFixed(2).replace(/0$/,"");phv.textContent=b.toFixed(2).replace(/0$/,"");
    const who=Math.abs(d)<0.05?"Equal amounts — best buffering":(d>0?"pH above pKa → "+names[1]+" dominates":"pH below pKa → "+names[0]+" dominates");
    const inb=Math.abs(d)<=1?"inside the buffer range (pKa ± 1)":"outside the buffer range (pKa ± 1)";
    out.innerHTML=`pH − pKa = ${d.toFixed(2)} → [${names[1]}]/[${names[0]}] = 10<sup>${d.toFixed(2)}</sup> = <b>${fmt(r)} : 1</b><br>${who}; ${inb}.`;
    split.innerHTML="";const pa=(f*100);
    split.append(h("div",{class:"ha",style:"width:"+(100-pa)+"%"},(100-pa)>12?names[0]+" "+(100-pa).toFixed(pa>99.9||pa<0.1?2:1)+"%":""),h("div",{class:"a",style:"width:"+pa+"%"},pa>12?names[1]+" "+pa.toFixed(pa>99.9||pa<0.1?2:1)+"%":""));
    // curve: pH vs fraction deprotonated
    const W=520,H=230,L=40,Rr=505,T=12,B=200,X=v=>L+(Rr-L)*v,Y=p=>B-(B-T)*p/14;
    let pts=[];for(let k=1;k<200;k++){const fr=k/200;pts.push(X(fr).toFixed(1)+","+Y(Math.max(0,Math.min(14,a+Math.log10(fr/(1-fr))))).toFixed(1));}
    const fd=Math.min(0.995,Math.max(0.005,f)),dotY=Y(Math.max(0,Math.min(14,b)));
    let g=`<svg viewBox="0 0 ${W} ${H+14}" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12"><rect width="${W}" height="${H+14}" fill="#fff"/>`;
    g+=`<rect x="${L}" y="${Y(Math.min(14,a+1))}" width="${Rr-L}" height="${Y(Math.max(0,a-1))-Y(Math.min(14,a+1))}" fill="#eef2f9"/>`;
    for(let p=0;p<=14;p+=2)g+=`<line x1="${L}" x2="${Rr}" y1="${Y(p)}" y2="${Y(p)}" stroke="#eee"/><text x="${L-6}" y="${Y(p)+4}" text-anchor="end" fill="#666">${p}</text>`;
    g+=`<line x1="${L}" y1="${B}" x2="${Rr}" y2="${B}" stroke="#1c1c1c"/><line x1="${L}" y1="${T}" x2="${L}" y2="${B}" stroke="#1c1c1c"/>`;
    g+=`<text x="${L+6}" y="${Y(Math.min(14,a+1))-4}" fill="#1f4b8f">buffer range (pKa ± 1)</text>`;
    g+=`<polyline fill="none" stroke="#1f4b8f" stroke-width="2.5" points="${pts.join(" ")}"/>`;
    g+=`<circle cx="${X(fd)}" cy="${dotY}" r="6" fill="#1c1c1c"/>`;
    g+=`<text x="${L}" y="${H+8}" fill="#666">all ${names[0]}</text><text x="${(L+Rr)/2}" y="${H+8}" text-anchor="middle" fill="#666">fraction deprotonated →</text><text x="${Rr}" y="${H+8}" text-anchor="end" fill="#666">all ${names[1]}</text></svg>`;
    plot.innerHTML=g;
  }
  draw();return w;
}};

// ===== MOCK =====
let timerId=null;
tabs.mock={cleanup(){if(timerId){clearInterval(timerId);timerId=null;}},render(){
  main.append(h("h1",null,"Mock exam"));
  main.append(h("p",{class:"mut sm"},"Same format as the real one: multiple choice and true/false, mixed across objectives. Each new mock pulls questions you haven't seen yet first."));
  const box=h("div",{class:"box"});main.append(box);
  const modChecks=MODS.map(m=>{const c=h("input",{type:"checkbox",checked:true});c.addEventListener("change",upd);box.append(h("label",{class:"chk",style:"margin:4px 0"},c,m.name+" ("+m.questions.length+")"));return [m,c];});
  const missing=["M1","M2","M3"].filter(s=>!MODS.some(m=>m.short===s));
  if(missing.length)box.append(h("p",{class:"mut sm",style:"margin:4px 0 8px"},missing.join(" and ")+" not added yet."));
  const seg=(vals,key)=>{const s=h("div",{class:"seg"});vals.forEach(([v,l])=>{const b=h("button",{onclick:()=>{S.set[key]=v;save();paint();upd();}},l);b.dataset.v=v;s.append(b);});function paint(){[...s.children].forEach(b=>b.classList.toggle("on",String(S.set[key])===b.dataset.v));}paint();return s;};
  box.append(h("div",{class:"row"},h("span",{class:"sm",style:"width:76px"},"Length"),seg([[25,"25 questions"],[10,"10 questions"]],"len")));
  box.append(h("div",{class:"row"},h("span",{class:"sm",style:"width:76px"},"Timer"),seg([[true,"On"],[false,"Off"]],"timer"),h("span",{class:"mut sm",id:"tinfo"})));
  box.append(h("div",{class:"row"},h("span",{class:"sm",style:"width:76px"},"Feedback"),seg([["each","After each question"],["end","At the end"]],"fb")));
  const info=h("p",{class:"sm"});box.append(info);
  const start=h("button",{class:"btn pri",onclick:()=>{const mods=modChecks.filter(x=>x[1].checked).map(x=>x[0]);runMock(buildMock(mods,+S.set.len));}},"Start mock "+(S.mocks+1));
  box.append(start);
  function upd(){const mods=modChecks.filter(x=>x[1].checked).map(x=>x[0]);const pool=Q.filter(q=>mods.includes(q.mod));const un=pool.filter(q=>!S.q[q.id]).length;
    info.textContent=un+" of "+pool.length+" questions unseen."+(pool.length<S.set.len?" Only "+pool.length+" available for now.":"");
    $("#tinfo").textContent=S.set.timer?Math.round(Math.min(+S.set.len,pool.length)*2)+" min (2 min per question)":"";
    start.disabled=!pool.length;}
  upd();
  main.append(h("h2",null,"Past mocks"));
  const hist=S.hist||[];
  main.append(hist.length?h("div",{class:"tw"},h("table",null,h("tr",null,h("th",null,"#"),h("th",null,"Date"),h("th",null,"Score")),hist.slice().reverse().map(x=>h("tr",null,h("td",null,x.n),h("td",null,new Date(x.d).toLocaleDateString()),h("td",null,x.s+" / "+x.of))))):h("p",{class:"mut sm"},"None yet."));
}};
function buildMock(mods,len){
  const age=q=>{const r=S.q[q.id];return r?r.t:0;};
  // per module quota
  const n=Math.min(len,Q.filter(q=>mods.includes(q.mod)).length);
  const quota=new Map(mods.map(m=>[m,0]));let left=n;
  while(left>0){let moved=false;for(const m of mods){if(left<=0)break;if(quota.get(m)<m.questions.length){quota.set(m,quota.get(m)+1);left--;moved=true;}}if(!moved)break;}
  let picked=[];
  mods.forEach(m=>{
    const byLo=m.los.map(l=>shuffle(m.questions.filter(q=>q.lo===l.id)).sort((a,b)=>age(a)-age(b)));
    let k=quota.get(m),i=0;
    // round robin across LOs, rotate start
    let lo=Math.floor(Math.random()*byLo.length);
    while(k>0&&byLo.some(a=>a.length)){const a=byLo[lo%byLo.length];if(a.length){picked.push(a.shift());k--;}lo++;if(++i>500)break;}
  });
  return shuffle(picked);
}
function runMock(qs){
  S.mocks++;save();
  const num=S.mocks;
  const st=qs.map(q=>({q,order:optsFor(q),pick:null,locked:false}));
  const each=S.set.fb==="each";
  let i=0,deadline=S.set.timer?Date.now()+qs.length*120000:null;
  if(timerId)clearInterval(timerId);
  if(deadline)timerId=setInterval(()=>{const t=$("#timer");const ms=deadline-Date.now();if(ms<=0){clearInterval(timerId);timerId=null;finish();return;}if(t){t.textContent=fmtT(ms);t.classList.toggle("late",ms<300000);}},1000);
  function fmtT(ms){const s=Math.ceil(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
  function show(){
    main.innerHTML="";const x=st[i];
    const answered=st.filter(s=>s.pick!=null).length;
    main.append(h("div",{class:"qhead"},h("span",null,"Mock "+num+" · "+(i+1)+" / "+st.length),h("span",{id:"timer"},deadline?fmtT(deadline-Date.now()):""),h("span",null,(each?loLabel(x.q):answered+" answered")+" ",flagBtn(x.q))));
    main.append(h("div",{class:"bar"},h("i",{style:"width:"+((i+(x.pick!=null?1:0))/st.length*100)+"%"})));
    const v=qView(x.q,x.order,{onPick(k){if(x.locked)return;x.pick=k;if(each){x.locked=true;record(x.q,x.order[k].c);v.paint(k,true);}else v.paint(k,false);nav();}});
    main.append(v.el);v.paint(x.pick,x.locked);
    const row=h("div",{class:"row"});main.append(row);
    function nav(){row.innerHTML="";
      if(!each&&i>0)row.append(h("button",{class:"btn",onclick:()=>{i--;show();}},"Back"));
      const last=i===st.length-1;
      if(!last)row.append(h("button",{class:"btn pri",disabled:each&&!x.locked,onclick:()=>{i++;show();}},"Next"));
      else row.append(h("button",{class:"btn pri",disabled:each&&!x.locked,onclick:()=>tryFinish(row)},"Finish"));
      row.append(h("button",{class:"btn link",onclick:()=>tryFinish(row,true)},"End exam"));
    }
    nav();
  }
  function tryFinish(row,early){
    const un=st.filter(s=>s.pick==null).length;
    if(un&&!row.querySelector(".conf2")){row.append(h("span",{class:"sm conf2",style:"width:100%"},un+" unanswered. ",h("button",{class:"btn sm",onclick:finish},"Finish anyway")));return;}
    finish();
  }
  function finish(){
    if(timerId){clearInterval(timerId);timerId=null;}
    if(!each)st.forEach(s=>record(s.q,s.pick!=null&&s.order[s.pick].c));
    else st.forEach(s=>{if(!s.locked)record(s.q,false);});
    const right=st.filter(s=>s.pick!=null&&s.order[s.pick].c).length;
    S.hist=(S.hist||[]);S.hist.push({n:num,d:Date.now(),s:right,of:st.length});save();
    main.innerHTML="";window.scrollTo(0,0);
    main.append(h("h1",null,"Mock "+num),h("p",{style:"font-size:20px;margin:4px 0 12px"},right+" / "+st.length+" ("+Math.round(right/st.length*100)+"%)"));
    const per={};st.forEach(s=>{const k=s.q.lo;per[k]=per[k]||[0,0];per[k][1]++;if(s.pick!=null&&s.order[s.pick].c)per[k][0]++;});
    main.append(h("h2",null,"By objective"),h("div",{class:"tw"},h("table",{class:"res"},Object.keys(per).sort((a,b)=>parseFloat(a)-parseFloat(b)||a.localeCompare(b)).map(k=>h("tr",null,h("td",null,k+" "+LOBY[k].title),h("td",{class:"n"},per[k][0]+" / "+per[k][1]))))));
    const miss=st.filter(s=>!(s.pick!=null&&s.order[s.pick].c));
    main.append(h("h2",null,miss.length?"Missed ("+miss.length+")":"Missed (0)"));
    miss.forEach(s=>{
      const d=h("div",{class:"miss"},h("div",{class:"qhead"},h("span",null,loLabel(s.q)),flagBtn(s.q)),h("div",{class:"stem",html:s.q.stem}));
      const f=fig(s.q.fig);if(f){f.style.maxWidth="460px";d.append(f);}
      d.append(h("div",{class:"sm"},h("span",{class:"ya"},"Your answer: "),h("span",{html:s.pick==null?"none":s.order[s.pick].t})));
      d.append(h("div",{class:"sm"},h("span",{class:"ca"},"Correct: "),h("span",{html:s.order.find(o=>o.c).t})));
      const ex=explain(s.q,false,s.pick==null);ex.firstChild.remove();d.append(ex);main.append(d);
    });
    main.append(h("div",{class:"row"},h("button",{class:"btn pri",onclick:()=>go("mock")},"New mock"),miss.length?h("button",{class:"btn",onclick:()=>runPractice(miss.map(s=>s.q),"Missed from mock "+num)},"Practice the missed ones"):null));
  }
  show();
}

// ===== BANK =====
tabs.bank={render(){
  main.append(h("h1",null,"Question bank"));
  main.append(h("p",{class:"mut sm"},"Every question with its answer. Same pool the mocks and practice draw from."));
  const sel=loSelect("bsel",true);const ty=h("select",null,h("option",{value:""},"All types"),h("option",{value:"mc"},"Multiple choice"),h("option",{value:"tf"},"True / false"));
  const ex=h("input",{type:"checkbox",checked:true}),fo=h("input",{type:"checkbox"});
  main.append(h("div",{class:"row"},sel,ty),h("div",{class:"row"},h("label",{class:"chk"},ex,"Explanations"),h("label",{class:"chk"},fo,"Flagged only")));
  const list=h("div");main.append(list);
  function draw(){list.innerHTML="";const pool=filterQ(sel.value).filter(q=>(!ty.value||q.type===ty.value)&&(!fo.checked||S.flag[q.id]));
    list.append(h("p",{class:"mut sm"},pool.length+" questions"));
    LOS.forEach(l=>{const qs=pool.filter(q=>q.lo===l.id);if(!qs.length)return;
      const d=h("details",{class:"lo",open:true},h("summary",null,l.id+" "+l.title+" ("+qs.length+")"));
      qs.forEach(q=>{const it=h("div",{class:"qli"},h("div",{class:"qhead"},h("span",null,loLabel(q)),h("span",null,q.type==="tf"?"T/F · ":"MC · ",flagBtn(q))),h("div",{class:"stem",html:q.stem+(q.tag==="beyond"?' <span class="tag">beyond lecture</span>':"")}));
        const f=fig(q.fig);if(f)it.append(f);
        it.append(h("ul",{class:"qlo"},optsFor(q,"seed").map(o=>h("li",{class:o.c?"ok":"",html:o.t}))));
        if(ex.checked){it.append(h("div",{class:"ex",html:q.exp}));if(q.steps)it.append(h("details",{class:"steps"},h("summary",null,"Work it through"),h("ol",null,q.steps.map(s=>h("li",{html:s})))));}
        d.append(it);});
      list.append(d);});
  }
  [sel,ty,ex,fo].forEach(e=>e.addEventListener("change",draw));draw();
}};

// ===== CHEAT SHEET =====
tabs.sheet={render(arg){
  main.append(h("h1",null,"Study guide"));
  const onlySaved=!!S.set.onlySaved;
  const sv=h("input",{type:"checkbox",checked:onlySaved});sv.addEventListener("change",()=>{S.set.onlySaved=sv.checked;S.pos.sheet=0;save();go("sheet");});
  const nsaved=Object.keys(S.saved).length;
  const jump=h("div",{class:"jump"});main.append(h("div",{class:"row",style:"margin:4px 0"},h("label",{class:"chk sm"},sv,"Saved sections only ("+nsaved+")")),jump);
  if(onlySaved&&!nsaved)main.append(h("p",{class:"mut"},"Nothing saved yet. Use Save on any section to keep it here."));
  MODS.forEach(m=>{
    if(onlySaved&&!m.los.some(l=>S.saved[l.id]))return;
    main.append(h("h2",null,m.name));
    m.los.forEach(l=>{
      if(onlySaved&&!S.saved[l.id])return;
      const id="s"+l.id.replace(".","-");jump.append(h("a",{href:"#"+id,onclick:e=>{e.preventDefault();document.getElementById(id).scrollIntoView({behavior:"smooth"});}},l.id));
      const sec=h("section",{class:"sheet",id});
      const sb=h("button",{class:"flag"});const sp=()=>{const on=!!S.saved[l.id];sb.textContent=on?"Saved":"Save";sb.classList.toggle("on",on);};sb.addEventListener("click",()=>{if(S.saved[l.id])delete S.saved[l.id];else S.saved[l.id]=1;save();sp();});sp();
      sec.append(h("div",{class:"shd"},h("h3",null,l.id+" "+l.title),sb));
      const html=(m.sheets[l.id]||"").replace(/FIG:(\w+)/g,"<div data-fig='$1'></div>").replace(/TOOL:(\w+)/g,"<div data-tool='$1'></div>");
      const body=h("div",{html});
      body.querySelectorAll("table").forEach(t=>{const w=h("div",{class:"tw"});t.replaceWith(w);w.append(t);});
      body.querySelectorAll("[data-fig]").forEach(e=>{const f=fig(e.dataset.fig);if(f)e.replaceWith(f);});
      body.querySelectorAll("[data-tool]").forEach(e=>e.replaceWith(TOOLS[e.dataset.tool]()));
      sec.append(body);
      const drills=(m.drills||[]).filter(d=>d.lo===l.id&&d.kind!=="tool");
      const nq=m.questions.filter(q=>q.lo===l.id).length;
      sec.append(h("div",{class:"row sm"},h("button",{class:"btn sm",onclick:()=>runPractice(m.questions.filter(q=>q.lo===l.id),"LO "+l.id)},"Practice "+l.id+" ("+nq+")"),drills.map(d=>h("button",{class:"btn sm",onclick:()=>{go("practice");openDrill(d);}},d.title))));
      main.append(sec);
    });
  });
}};

document.getElementById("reset").addEventListener("click",function(){
  if(this.dataset.arm){S={q:{},mocks:0,set:S.set,drills:{},flag:{},saved:S.saved,pos:S.pos,hist:[]};save();this.textContent="Reset progress";delete this.dataset.arm;go(tab);}
  else{this.dataset.arm="1";this.textContent="Tap again to reset";setTimeout(()=>{this.textContent="Reset progress";delete this.dataset.arm;},3000);}
});
const start=(location.hash||"").slice(1)||S.tab;tab=null;go(tabs[start]?start:"sheet");
})();
